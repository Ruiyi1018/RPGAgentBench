  title: Friends Season 1
  creator: David Crane and Marta Kauffman
  scope: United States broadcast episodes 1-23
  authority: primary
data_constraints:
- Every current fact must already hold immediately after S1E23.
- Never use S1E24 or later-season knowledge.
- Candidate events require an episode and within-episode order.
- Private facts do not become Player-visible without an explicit disclosure.
- Only listed environment IDs may be used at runtime.
