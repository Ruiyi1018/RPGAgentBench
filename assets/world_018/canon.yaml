world_id: world_018
canon_policy:
  primary_source: Friends, United States broadcast Season 1 episodes 1-23
  source_type: television season
  excluded_versions:
  - Season 1 episode 24 and all later seasons
  - deleted scenes, extended cuts, and DVD-only material
  - reunion special
  - spin-offs, novelizations, and adaptations
  - fan works and later-retconned details
  shared_snapshot: Immediately after Ben's birth and naming at the end of S1E23, before S1E24 begins
  generated_timeline: Only events completed on screen from S1E01 through S1E23 may precede the shared snapshot
  quotation_policy: Paraphrase only; do not reproduce dialogue
  player_semantics:
    default_identity: An unfamiliar adult visitor at the NPC's current location
    initial_knowledge: Only facts whose Frozen knowledge visibility includes player
    capabilities:
    - Speak with the NPC
    - Observe the current public location and visible objects
    limitations:
    - No automatic access to private memories, off-screen conversations, homes, workplaces, or records
    - No authority over employment, housing, relationships, medical care, or property
    override_rule: A later scenario may replace identity, location, knowledge, inventory, or access only by declaring each override explicitly
evaluated_npcs:
- rachel_green
- monica_geller
- phoebe_buffay
- joey_tribbiani
- chandler_bing
- ross_geller
- gunther
event_entities: []
sources:
