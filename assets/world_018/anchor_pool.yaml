  anchor_for: [rachel_green, monica_geller]
- id: monica_reconnects_rachel
  episode_order: 1
  scene_order: 2
  fact: Monica recognizes Rachel as her high-school friend and permits Rachel to stay in her apartment.
  known_by: [rachel_green, monica_geller]
  state_change: "rachel.housing_permission.monica_apartment: absent -> granted"
  cf_edit: Monica recognizes Rachel but does not grant permission to stay.
  anchor_for: [rachel_green, monica_geller]
- id: group_watches_spanish_soap
  episode_order: 1
  scene_order: 3
  fact: After Rachel arrives, Rachel, Ross, Monica, Phoebe, Joey, and Chandler watch a Spanish-language soap together in Monica's apartment.
  known_by: [rachel_green, monica_geller, phoebe_buffay, joey_tribbiani, chandler_bing, ross_geller]
  state_change: "shared_activity.spanish_soap: absent -> completed_once"
  cf_edit: The same six friends gather in Monica's apartment with the television switched off, so the shared viewing does not occur.
  anchor_for: [rachel_green, monica_geller, phoebe_buffay, joey_tribbiani, chandler_bing, ross_geller]
- id: rachel_cuts_credit_cards
