  scene_order: 1
  fact: Rachel enters Central Perk in a wedding dress after leaving her wedding.
  known_by: [rachel_green, monica_geller, phoebe_buffay, joey_tribbiani, chandler_bing, ross_geller]
  state_change: "rachel.social_contact.central_perk_group: disconnected -> reconnected"
