- id: joey_fired_butt_double_job
  episode_order: 6
  scene_order: 2
  fact: Joey loses the film job as Al Pacino's body double after continuing exaggerated clenching despite the director's correction, then tells Rachel, Monica, Phoebe, Chandler, and Ross that he was fired.
  known_by: [rachel_green, monica_geller, phoebe_buffay, joey_tribbiani, chandler_bing, ross_geller]
  state_change: "joey.employment.butt_double: active -> terminated"
  cf_edit: Joey follows the director's correction by showering without exaggerated clenching, so he is not fired from the role for overacting.
  anchor_for: [joey_tribbiani]
- id: thanksgiving_dinner_ruined
  episode_order: 9
  scene_order: 2
  fact: After the group goes to the roof and is locked out, Monica's Thanksgiving meal burns.
  known_by: [rachel_green, monica_geller, phoebe_buffay, joey_tribbiani, chandler_bing, ross_geller]
  state_change: "monica.thanksgiving_meal: prepared -> ruined"
  cf_edit: The apartment door remains unlocked, allowing Monica to return before the meal burns.
  anchor_for: [monica_geller]
