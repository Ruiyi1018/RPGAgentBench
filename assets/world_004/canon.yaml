- 所有事实限定在嘉靖本范围内，且不得包含赤壁决战开始后的情节
- 不得使用毛宗岗评本或电视剧改编本中的情节与人物设定
- 不伪造具体卷数、回目编号或原文引文
- 锚点事件按时间顺序排列，状态变化只描述事件带来的直接影响
- cf_edit必须给出真实替代情形，不得写‘无’或空泛表述
