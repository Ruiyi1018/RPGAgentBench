    permissions: 无警务、市场管理或私人住所固有权限；当前NPC可在运行态决定隔壁会客区的生活照顾许可，但默认Player不得由当前NPC直接取得问询区或问询记录访问
    override_policy: 具体场景若改变Player身份、地点、知识或权限，必须显式覆盖；问询区或问询记录访问还必须同时覆盖对应运行态控制权，不得仅以已核验身份或请求理由代替正式授权，也不得据此自动获得NPC私密知识
