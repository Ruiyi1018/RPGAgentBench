world_id: world_011
source: 电视剧《狂飙》第1集2000年除夕回溯
events:
- id: ev_001
  canon_order: 1
  fact: 唐小龙、唐小虎借鱼摊续租调整向高启强暗示需要等离子电视
  known_by: [gao_qiqiang, tang_xiaolong, tang_xiaohu]
  state_change: 高启强认识到保住原鱼摊面临唐家兄弟提出的额外条件
  cf_edit: 唐家兄弟明确按正常规则续租，不提出电视条件
  anchor_for: [gao_qiqiang, tang_xiaolong, tang_xiaohu]
- id: ev_002
  canon_order: 2
  fact: 高启强因等离子电视价格过高，购买一台普通电视并在除夕送到唐家兄弟聚集处
  known_by: [gao_qiqiang, tang_xiaolong, tang_xiaohu]
  state_change: 高启强以普通电视争取保留鱼摊
  cf_edit: 高启强没有购买或送出任何电视
  anchor_for: [gao_qiqiang]
- id: ev_003
  canon_order: 3
  fact: 唐小龙拒收普通电视，高启强搬离时唐小虎推搡，电视坠地摔坏
  known_by: [gao_qiqiang, tang_xiaolong, tang_xiaohu]
  state_change: 续租争议由送礼交涉升级为财物损坏和当面对立
  cf_edit: 唐小虎没有推搡，电视被完整搬离
  anchor_for: [gao_qiqiang, tang_xiaolong, tang_xiaohu]
- id: ev_004
  canon_order: 4
  fact: 高启强因电视被摔坏和受辱先动手打唐小虎，随后遭唐小龙等多人围殴
  known_by: [gao_qiqiang, tang_xiaolong, tang_xiaohu]
  state_change: 三方成为除夕斗殴的直接参与者，高启强受伤
  cf_edit: 高启强受到推搡和辱骂后没有返回动手
  anchor_for: [gao_qiqiang, tang_xiaolong, tang_xiaohu]
- id: ev_005
  canon_order: 5
  fact: 安欣和李响到场制止斗殴，并将高启强带回双桥派出所问询
  known_by: [an_xin, gao_qiqiang, li_xiang, tang_xiaolong, tang_xiaohu]
  state_change: 冲突由现场斗殴转为警方处置，高启强失去当晚自由行动条件
  cf_edit: 安欣和李响到场时斗殴尚未发生，仅作现场调解
  anchor_for: [an_xin, gao_qiqiang, li_xiang]
- id: ev_006
  canon_order: 6
  fact: 问询中安欣和李响得知高启强为保鱼摊送电视、电视摔坏后动手的经过
  known_by: [an_xin, gao_qiqiang, li_xiang]
  state_change: 两名民警掌握高启强陈述的冲突起因，但责任仍待依法处理
  cf_edit: 高启强拒绝说明送电视和摊位续租背景
  anchor_for: [an_xin, gao_qiqiang, li_xiang]
- id: ev_007
  canon_order: 7
  fact: 高启盛和高启兰到双桥派出所给高启强送年夜饭，起初被门卫拦下
  known_by: [an_xin, gao_qiqiang]
  state_change: 安欣确认高启强的弟弟妹妹在除夕夜等候并希望与兄长一起过年
  cf_edit: 高启强的弟弟妹妹当晚没有到派出所送饭
  anchor_for: [an_xin, gao_qiqiang]
- id: ev_008
  canon_order: 8
  fact: 安欣在规则边界内安排高启盛、高启兰在问询室隔壁吃饺子，转送饺子给高启强并调大电视声音
  known_by: [an_xin, gao_qiqiang, li_xiang]
  state_change: 高启强知道安欣给予其一家除夕夜的人情照顾，对安欣产生明确感激
  cf_edit: 安欣仅按门卫原决定拒绝弟妹进入，也没有转送饺子或调大电视声音
  anchor_for: [an_xin, gao_qiqiang]
