data_constraints:
- 不使用快照后剧情或版本间差异内容
- 不引用具体页码、回目数字或外部链接
- 地点与物品仅限共享快照内出现且可确认者
- cf_edit必须提供只改变关键原因并保持其余事实不变的真实替代情形
- known_by与anchor_for仅使用给定roster ID
