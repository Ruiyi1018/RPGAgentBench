  known_by:
  - lin_pingzhi
  - yue_buqun
  state_change: 林平之与岳不群由师徒姻亲变为敌对者，林平之对华山派彻底失去信任。
  cf_edit: 若林平之没有发现岳不群窃取剑谱，他可能继续被蒙蔽并留在华山体系内。
  anchor_for:
  - lin_pingzhi
  - yue_buqun
