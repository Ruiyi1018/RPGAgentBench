world_id: world_015
source: 金庸《笑傲江湖》修订本正文
events:
- id: anchor_001
  fact: 令狐冲在思过崖习得独孤九剑。
  known_by:
  - linghu_chong
  state_change: 令狐冲从受内伤困扰的华山弟子变为掌握上乘剑法者，剑术能力大幅提升。
  cf_edit: 若风清扬未在思过崖出现，令狐冲就无法习得独孤九剑，只能继续依靠原有华山剑法应对强敌。
  anchor_for:
  - linghu_chong
- id: anchor_002
  fact: 令狐冲在洛阳结识任盈盈，并接受她安排的琴曲疗伤。
  known_by:
  - linghu_chong
  - ren_yingying
  state_change: 令狐冲获得任盈盈信任与帮助，任盈盈从暗中关注转为直接介入令狐冲的疗伤与处境。
  cf_edit: 若任盈盈未在洛阳现身，令狐冲将缺少琴曲疗伤与后续庇护，其江湖处境会显著恶化。
  anchor_for:
  - linghu_chong
  - ren_yingying
- id: anchor_003
  fact: 令狐冲担任恒山派掌门。
  known_by:
  - linghu_chong
  - ren_yingying
  - yilin
  state_change: 令狐冲由华山弃徒身份转为恒山派掌门，获得一派之主的名分与责任。
  cf_edit: 若恒山派未在危局中推举令狐冲，他便不会拥有掌门身份，后续号令恒山弟子的情节将不会发生。
  anchor_for:
  - linghu_chong
  - yilin
- id: anchor_004
  fact: 令狐冲与任盈盈并肩对抗东方不败。
  known_by:
  - linghu_chong
  - ren_yingying
  - dongfang_bubai
  state_change: 令狐冲与任盈盈形成同生共死的战斗联盟，东方不败的权势受到直接挑战。
  cf_edit: 若任盈盈未与令狐冲联手，便难以牵制东方不败，令狐冲将独自面对更强压迫。
  anchor_for:
  - linghu_chong
  - ren_yingying
  - dongfang_bubai
- id: anchor_005
  fact: 任盈盈出手为令狐冲缓解内伤。
  known_by:
  - linghu_chong
  - ren_yingying
  state_change: 令狐冲伤势得到阶段性控制，任盈盈对令狐冲的影响力进一步加深。
  cf_edit: 若任盈盈没有及时出手，令狐冲可能因内伤发作而失去后续行动能力。
  anchor_for:
  - linghu_chong
  - ren_yingying
- id: anchor_006
  fact: 任盈盈为救令狐冲甘愿受囚于少林。
  known_by:
  - linghu_chong
  - ren_yingying
  state_change: 任盈盈由自由之身转为囚禁状态，令狐冲因此欠下重大恩情。
  cf_edit: 若任盈盈未选择以自身为质，令狐冲的命便无法保全，但她也不会因此陷入少林囚禁。
  anchor_for:
  - ren_yingying
  - linghu_chong
- id: anchor_007
  fact: 任盈盈被日月教众人视为圣姑。
  known_by:
  - ren_yingying
  - dongfang_bubai
  state_change: 任盈盈在日月教内部拥有特殊身份，能够调度部分教众。
  cf_edit: 若任盈盈没有圣姑身份，她便难以调动教众为令狐冲奔走。
  anchor_for:
  - ren_yingying
- id: anchor_008
  fact: 任盈盈参与黑木崖对东方不败的围攻。
  known_by:
  - ren_yingying
  - dongfang_bubai
  - linghu_chong
  state_change: 任盈盈由被动躲避黑木崖势力转为主动反击，推动日月教权力变更。
  cf_edit: 若任盈盈没有参与围攻，东方不败虽仍会与令狐冲交手，但黑木崖势力倾覆的过程会缺少她的调度。
  anchor_for:
  - ren_yingying
  - dongfang_bubai
- id: anchor_009
  fact: 岳不群将林平之收为华山弟子。
  known_by:
  - yue_buqun
  - lin_pingzhi
  state_change: 林平之从落难公子转为华山门徒，岳不群获得接近辟邪剑谱的途径。
  cf_edit: 若岳不群未收林平之入门，林平之便不会进入华山，岳不群也难以借他追查剑谱。
  anchor_for:
  - yue_buqun
  - lin_pingzhi
- id: anchor_010
  fact: 岳不群取得辟邪剑谱并开始暗中修炼。
  known_by:
  - yue_buqun
  state_change: 岳不群由华山掌门变为自宫练剑者，武功大进但心性与身体发生重大变化。
  cf_edit: 若岳不群始终拿不到辟邪剑谱，他便不会以自残方式追求速成武功。
  anchor_for:
  - yue_buqun
- id: anchor_011
  fact: 岳不群与令狐冲师徒关系破裂。
  known_by:
  - yue_buqun
  - linghu_chong
  state_change: 令狐冲彻底失去华山弟子身份，岳不群也失去对令狐冲的师长约束。
  cf_edit: 若岳不群没有公开决裂，令狐冲仍会受华山门规牵制，难以接任恒山掌门。
  anchor_for:
  - yue_buqun
  - linghu_chong
- id: anchor_012
  fact: 岳不群在五岳剑派合并中争夺权力。
  known_by:
  - yue_buqun
  - linghu_chong
  - yilin
  state_change: 岳不群从华山掌门进一步谋求五岳剑派主导权，成为公开的权谋竞争者。
  cf_edit: 若岳不群没有暗中布局，五岳合并局面将缺少他的强力操控。
  anchor_for:
  - yue_buqun
- id: anchor_013
  fact: 林平之因家传辟邪剑谱被岳不群设计接近。
  known_by:
  - yue_buqun
  - lin_pingzhi
  state_change: 林平之从普通华山弟子变为被利用的棋子，逐渐察觉岳不群对剑谱的图谋。
  cf_edit: 若岳不群对辟邪剑谱没有企图，林平之便不会长期陷入被师长算计的处境。
  anchor_for:
  - lin_pingzhi
  - yue_buqun
- id: anchor_014
  fact: 林平之练成辟邪剑法后向余沧海复仇。
  known_by:
  - lin_pingzhi
  state_change: 林平之由被追杀者转为复仇者，实力足以对抗曾经不可战胜的敌人。
  cf_edit: 若林平之没有练成辟邪剑法，他即便找到余沧海也无法完成复仇。
  anchor_for:
  - lin_pingzhi
- id: anchor_015
  fact: 林平之与岳灵珊成亲。
  known_by:
  - lin_pingzhi
  - yue_buqun
  state_change: 林平之正式成为岳不群女婿，与华山派的关系更紧密也更具冲突。
  cf_edit: 若林平之没有与岳灵珊成亲，他对岳不群阴谋的发现可能更晚。
  anchor_for:
  - lin_pingzhi
  - yue_buqun
- id: anchor_016
