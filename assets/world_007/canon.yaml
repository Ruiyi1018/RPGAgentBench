data_constraints:
- 所有事实必须来自三联书店1994年修订版《天龙八部》并不晚于共享叙事切点
- 不得混入新修版、连载版、续作或影视游戏改编内容
- Profile与Frozen当前字段只写共享切点已成立的最新有效状态；历史状态须明确标作历史
- Anchor候选按chapter_order严格排序，known_by只按亲历、明确获告或可访问证据填写
- 每个cf_edit只改变一个正典相容的上游原因，并写明预期不同状态
- 默认Player不因世界事实成立而自动知情，也无任何组织、武力或私藏材料权限
- 地点、权限与物品只建模当前候选或Stage 3确实使用且来源可支持的对象
- 无法可靠确认的细节一律省略，不伪造URL、章节号、页码或集数
