canon_policy:
  primary_source: 金庸《天龙八部》三联书店1994年修订版（全五册）
  source_type: 长篇武侠小说修订版
  excluded_versions:
  - 新修版
  - 连载版
  - 电视剧改编
  - 漫画改编
  - 游戏改编
  - 续作及同人
  shared_snapshot: 三联书店1994年修订版少室山大战结束、萧峰与段誉虚竹结义后，群雄尚未离开少室山区域的叙事切点
  generated_timeline: 候选事件仅收录该叙事切点及此前在三联修订版中已经发生的离散事件；切点后的西夏招亲、鸠摩智失功、段誉继位、雁门关结局均排除
  quotation_policy: 只做事实级转述，不复制原作台词
  default_player_semantics:
    identity: 无既定门派、官职或与六名NPC私交的普通江湖访客
    starting_knowledge: 仅知道三联修订版中当时已公开的江湖身份与公开事件；不默认知道NPC私密目标、秘密、未公开关系或不在场事件
    capabilities: 可交谈、询问并在当前地点移动；无调兵、调派门人、查阅私藏典籍或代表任何势力承诺的默认权限
    material_access: 仅可使用Frozen inventory中属于player的物品及access中明确授予player的资源
    visibility_semantics: '[npc]表示仅该NPC开局确知；[npc, player]表示NPC与默认Player均确知；场景特例必须显式覆盖'
