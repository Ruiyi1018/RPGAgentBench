- item_id: anchor_pool.events.known_by
  severity: major
  rule_id: knowledge_visibility
  evidence: 多项known_by把内心状态或隐蔽意图直接赋给旁观者：ev_008把皇后“观察后宫争斗”列为甄嬛、沈眉庄、安陵容所知，ev_014把安陵容的依赖与“潜在摇摆”列为甄嬛、沈眉庄、皇后所知，ev_021把皇后“利用安排促使矛盾公开化”的意图列为华妃、甄嬛、苏培盛所知，文件没有披露或证据链支持。最终复核补充：重建后的ev_012仅列安陵容、苏培盛为known_by，并断言甄嬛、沈眉庄当时不知道执行细节；但同集结尾安陵容前去说明时听到二人议论其处置行为，Profile又记为三人开始隔阂，事件存在/行为与具体执行细节的知情范围没有拆开。
