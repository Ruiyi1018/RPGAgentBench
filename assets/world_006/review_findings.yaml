- item_id: characters.current_effective_state
  severity: major
  rule_id: current_relationship_state
  evidence: Profile把沈眉庄写作“皇帝新宠”且initial_context对皇帝为trusting，只保留“较早受宠后受排挤”的早期概括；若快照位于甄嬛第一次正式失宠前，沈眉庄此时已经历假孕冤案及复位，对皇帝的信任和处境不能等同早期状态。甄嬛、华妃的Profile与运行态也未反映紧邻失宠前的小产、怨隙和降位后果。最终复核补充：前移快照解决了上述晚期冲突，但安陵容Profile明确写第10集末与甄嬛、沈眉庄“开始产生隔阂感”，Frozen却仍保留双向trusting；an_lingrong_goal_002的主动隐瞒也不是该事件后的已建立目标。2026-09-11独立终审补充：Frozen三方关系和无依据目标已修复，但三份Profile的identity.role/affiliations仍用当前式“姐妹盟友”“亲近”“交好”，与其social及Frozen的neutral冲突，当前有效关系仍有两个答案。
