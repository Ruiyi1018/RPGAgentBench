  resolution: 已在保留三方Frozen neutral、姐妹往来目标及ev_012知识粒度的基础上，同步甄嬛identity.role/affiliations、安陵容identity.affiliations与沈眉庄identity.role：仅保留历史姐妹名分和当前审慎往来，明确第10集末已有隔阂，不再出现当前“姐妹盟友”“亲近小团体”或“交好”的第二答案。
  status: fixed

