  resolution: 已重写ev_012知情粒度：knowledge_scope分别记录执行结果、安陵容提示与现场执行过程；执行结果包含皇帝，安陵容提示包含安陵容、苏培盛及随后议论此事的甄嬛、沈眉庄，冷宫现场过程仅限安陵容与苏培盛。三人Frozen知识同步，默认Player未获得任何私密细节。
