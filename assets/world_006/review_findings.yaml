  severity: major
  rule_id: character_source_grounded
  evidence: 苏培盛Profile写“皇帝允礼近前服侍之人”；电视剧中允礼是果郡王、皇帝之弟，苏培盛所近侍的是雍正皇帝，该字段把两个不同人物合并。
  required_change: 更正苏培盛的直属服侍对象，并回归所有由该错误身份派生的关系、权限和知识描述。
