- item_id: canon.canon_policy.primary_source
  severity: major
  rule_id: source_version_explicit
  evidence: primary_source和sources.scope都只写“电视剧《甄嬛传》/全剧”，未锁定2011年76集大陆版等具体发行剪辑；不同电视剪辑的集数与内容边界可能不同。
  required_change: 明确唯一采用的电视剧发行版本/剪辑及其识别信息，并让后续事件定位均以该版本为准。
  resolution: 已将primary_source与src_001锁定为2011年首播、郑晓龙执导的中国大陆76集剪辑版，并声明所有事件集数和集内顺序均以该版为准。
  status: fixed

- item_id: canon.canon_policy.shared_snapshot
  severity: blocker
  rule_id: snapshot_state_consistency
  evidence: shared_snapshot仍为“甄嬛初次失宠之前，具体集数待人工锁定”。按电视剧常见76集顺序，甄嬛小产约在第30集、正式失宠约在第32集；该边界前沈眉庄已历经假孕冤案及复位、甄嬛已小产、华妃已因罚跪事件受降位惩处，但Profile、initial_context和候选池仍主要停留在更早的初受宠/初受排挤状态，无法确定一个共同的最新有效状态。最终复核补充：边界虽已锁定到第10集末，但an_lingrong Profile已写余氏执行后“开始产生隔阂感”，其Frozen仍把甄嬛、沈眉庄均设为trusting，并新增无来源的主动隐瞒目标，说明边界末端状态仍未同步。2026-09-11独立终审补充：Frozen三方已改为neutral，但甄嬛identity.role仍称安陵容为“姐妹盟友”、identity.affiliations仍称“亲近的姐妹小团体”，安陵容identity.affiliations仍称与二人“交好”，沈眉庄identity.role仍称安陵容为“姐妹盟友”，与同文件当前social及Frozen的“有隔阂的中立”并不唯一一致。
  required_change: 保留已锁定的第10集离散边界；将三份Profile的当前身份/阵营/关系概括同步为第10集末状态，明确“仍有姐妹名分与往来”不等于当前盟友或交好，并与social及Frozen的neutral保持唯一一致。
  resolution: 已保留第10集末离散边界；甄嬛identity.role/affiliations、安陵容identity.affiliations及沈眉庄identity.role均改为“仍有姐妹名分或往来但已生隔阂”，不再把安陵容与二人概括为当前盟友或交好。三方social与Frozen继续统一为ev_012覆盖后的neutral，甄嬛与沈眉庄之间的loyal保持不变。
  status: fixed

- item_id: canon.default_player_semantics
  severity: major
  rule_id: player_role_bounded
  evidence: canon未定义默认Player身份、知识来源、可接触材料、行动权限及scenario覆盖规则；所有initial_context却都创建了player状态，无法判定Player开局应知内容和可执行行为。
  required_change: 在canon中定义统一默认Player语义及显式scenario覆盖规则，明确默认Player的知识与权限边界。
  resolution: 已在canon.default_player_semantics中定义默认Player身份、公开知识范围、材料、开局地点内对话权限及禁止权限，并规定scenario必须逐项显式覆盖冲突语义。
  status: fixed

- item_id: environment.locations
  severity: major
  rule_id: referenced_assets_exist
  evidence: environment仅有碎玉轩、翊坤宫、景仁宫、御花园、养心殿和长街；沈眉庄在该时段的咸福宫/存菊堂、安陵容的延禧宫等实际住所未建模，且两人的initial_context均无事件依据地把当前位置设为loc_006长街。最终复核补充：住所已补齐，但候选ev_008的汤泉行宫侍寝场景和ev_012的冷宫执行场景仍无地点节点或明确映射。
  required_change: 保留新增住所与当前位置修复，并为候选池实际使用的汤泉行宫、冷宫补充最小地点节点和双向可达连接，或在候选中提供到现有节点的无歧义映射。
  resolution: 在保留咸福宫存菊堂与延禧宫及当前位置修复的基础上，新增loc_009汤泉行宫与loc_010冷宫，为ev_008、ev_012分别填写location_id，并补齐养心殿/长街与两节点的双向可达连接。
  status: fixed

- item_id: environment.stage3_affordances
  severity: major
  rule_id: world_affordances_sufficient
  evidence: Profiles的核心可测试权力包括皇帝召见/恩赏/冷落、皇后与华妃安排宫务、苏培盛通传和各宫差使宫人；environment只提供4件无角色归属的普通物品，全部initial_context的inventory、access、offers和commitments均为空，未提供可执行的授权、通传、奖惩或资源状态。
  required_change: 以最小可执行状态建模计划测试所需的关键权限、通传/召见渠道、宫务资源或承诺，并在initial_context中分配符合角色权威与限制的初始值。
  resolution: 已增加养心殿通传名册、中宫宫务牌和翊坤宫差使牌，并在各initial_context的inventory/access中建模召见通传、宫务学习、宫室差使、奖惩裁决及Player默认拒绝权限；苏培盛另有可执行通传承诺。
  status: fixed

- item_id: characters.all.source_grounding
  severity: major
  rule_id: character_source_grounded
  evidence: 7份Profile均无逐项来源或事件ID；大量内心动机、秘密、关系判断和权力结论只能回指笼统的全剧来源，无法区分边界前明示事实、合理推断与观众后见信息。最终复核补充：新增source_grounding仍按整组字段笼统列事件，且若干引用不支持对应结论；例如hua_fei的goals_permissions_limits只引ev_009公开讥讽，却据此主张可借宫务和差使宫人压制他人。2026-09-11独立终审补充：虽已增加逐项映射，emperor_yongzheng与shen_meizhuang双向trusting只引ev_005“首次承宠并获准学习宫务”，zhen_huan与皇帝双向trusting只引ev_008“首次承宠”，这些事件本身不建立信任等级；empress_yixiu对皇帝loyal只引中宫宫务权限事实，也不建立忠诚关系。另有多项来源仍是“src_001:第1至第10集……”的十集范围概括，未给可核验场景。2026-09-11独立最终Auditor复核：强关系与整段概括已修复，但沈眉庄Profile仍多处把“受到华妃防备/排挤”写成当前确定事实，source_grounding.guard_against_hua仅引ev_005；该事件只记录沈眉庄承宠和取得宫务学习权限，不记录华妃对她的行动或态度。Frozen的shen_meizhuang_goal_003同样以ev_005支撑“防范华妃施压”。华妃Frozen的hua_fei_goal_002又以只针对甄嬛的ev_009支撑“限制甄嬛与沈眉庄”，均超出所引证据。
  required_change: 保留已经修复的关系等级与具体场景引用；为沈眉庄受到华妃防备、排挤或施压及华妃限制沈眉庄补充边界前可核验的离散场景来源，或将Profile与Frozen目标收窄为当前证据只支持的风险判断，不得让ev_005或只针对甄嬛的ev_009承担未发生的状态变化。
  resolution: 已保留华妃—沈眉庄双向neutral及canon:runtime_defaults.relationship来源；沈眉庄Profile中“受到华妃防备、排挤或施压”的既成事实均降级为风险判断，并明确其依据仅为ev_005所示自身受宠/宫务学习状态与ev_009所示华妃公开针对甄嬛，不主张华妃已对沈眉庄行动。shen_meizhuang_goal_003同步改为基于ev_009防范类似风险；hua_fei_goal_002删除“限制沈眉庄”，仅保留ev_009直接支持的限制甄嬛。
  status: fixed

