- item_id: frozen.all.state_provenance
  severity: major
  rule_id: state_traceability
  evidence: 所有relationships、goals和knowledge的basis_event/source_event均统一写generic的initial_state，没有指向canon候选事件或其他可核验来源；Stage 1无法追踪旧状态、触发证据和当前有效状态。最终复核补充：generic值虽已替换，但引用事件不一定支持状态强度，例如安陵容对甄嬛、沈眉庄的trusting及沈眉庄对甄嬛的loyal都只引用ev_001“同批入选”，该事件既未建立这些关系等级，也未覆盖第10集末的最新变化。2026-09-11独立终审补充：三方及甄嬛—沈眉庄来源已修复，但其余无强状态依据的neutral并未全部改引runtime default；例如皇帝对华妃neutral引ev_009（皇帝不在known_by且该事件无皇帝状态变化），甄嬛对苏培盛neutral引ev_007，安陵容对苏培盛neutral引ev_012，沈眉庄对苏培盛neutral引ev_005，均未由对应事件建立该关系等级。多个profile:引用也只指向关系文案而非其底层证据。
