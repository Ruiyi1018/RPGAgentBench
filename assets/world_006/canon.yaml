sources:
- id: src_001
  title: 电视剧《甄嬛传》（2011年中国大陆76集版）
  creator: 郑晓龙执导
  scope: 第1集至第10集余氏伏诛后；集数和集内顺序均按中国大陆76集剪辑版
  authority: primary
pre_existing_state_sources:
- id: canon_fact_zhen_shen_friendship
  source_locator: 76集版第1集，选秀前后甄嬛与沈眉庄以旧识姐妹身份相互照应
  fact: 甄嬛与沈眉庄入宫前已有稳定姐妹情分；截至共享快照，该关系未被后续事件撤销。
- id: canon_fact_three_sisters_bond
  source_locator: 76集版第1集选秀相助至第10集三人往来
  fact: 甄嬛在选秀时帮助安陵容，三人入宫后持续以姐妹相称并相互往来；第10集末议论余氏处置方式使三方开始产生隔阂。
- id: canon_fact_hua_palace_authority
  source_locator: 76集版第3集新人入宫安置后至第10集的宫务与翊坤宫差使场景
  fact: 华妃可在皇后名分约束下经手部分宫务并差使翊坤宫宫人，但无权自行决定妃嫔生死、废黜或皇帝召见。
- id: canon_fact_empress_palace_authority
  source_locator: 76集版第1集选秀及第3集起景仁宫宫务场景
  fact: 皇后以中宫身份主持后宫礼制与日常宫务，但不能替皇帝决定恩宠和最终处分。
- id: canon_fact_su_attendant_authority
  source_locator: 76集版第1至第10集养心殿通传、随驾与传旨场景
  fact: 苏培盛是皇帝近侍，可奉旨通传、安排见驾并督促宫人执行口谕，但不能擅改旨意或自行裁决妃嫔。
data_constraints:
- 所有事实必须限定在2011年中国大陆76集版《甄嬛传》第1至第10集的共享快照内
- 不得使用共享快照之后的剧情
- 不得混入原著小说、剧本、广播剧、漫画或同人创作
- 只做事实级转述，不复制原作台词
- 无法可靠确认的细节宁可省略
- 候选事件必须给出可核验的76集版集数与唯一canon_order，不得伪造定位
- Anchor池事件必须按canon_order形成总序
- Location连接必须引用已列出的地点ID
- Item类型和可携带性必须来自当前来源范围及共享快照
- known_by和anchor_for只能使用Roster中的角色ID
- 每个cf_edit必须给出只改变关键原因的真实替代情形，禁止写'无'
- 同一角色不同事件之间的状态变化必须保持一致
- 初始上下文中的Player统一采用default_player_semantics；knowledge.visibility中[npc]仅NPC知情，[npc, player]表示NPC与默认Player均知情
- scenario改变Player身份、材料、知识或权限时必须显式覆盖，不能沿用冲突的默认可见性
