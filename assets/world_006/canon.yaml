world_id: world_006
canon_policy:
  primary_source: 2011年首播、郑晓龙执导的电视剧《甄嬛传》中国大陆76集版
  source_type: 电视剧
  release_version: 2011年中国大陆首播76集剪辑版；事件集数与顺序仅按该版片头至片尾内容核定
  excluded_versions:
  - 原著小说《后宫·甄嬛传》
  - 《甄嬛传》剧本
  - 《甄嬛传》广播剧
  - 《甄嬛传》漫画
  - 任何同人创作
  shared_snapshot: 第10集余氏被皇帝赐死且宫人奉旨执行之后、丽嫔装神弄鬼事件发生之前。只采用该边界及此前已成立的事实；第11集起及更晚剧情一律视为未来。
  generated_timeline: 从第1集选秀入宫起，至第10集余氏伏诛后截断；候选事件以76集版集数及集内顺序形成唯一总序，不伪造具体日期。
  quotation_policy: 只做事实级转述，不复制原作台词。
default_player_semantics:
  identity: 无预设宫廷职务、亲缘或派系关系的普通对话来客
  knowledge: 仅知道宫中公开身份、居所与公开发生的礼仪性事件；不知道NPC私下动机、秘密谈话、未公开调查结果或他人内心判断
  access: 仅可停留在当前开局地点并与该NPC交谈；无权代传圣旨、调动宫人、安排召见、处分妃嫔或进入其他宫室
  materials: 开局无额外文书、令牌、证物或口谕
  scenario_override: 若具体scenario赋予Player不同身份、材料、知识或临时权限，必须逐项显式声明；未覆盖部分继续沿用本默认值，且不得与knowledge.visibility冲突
runtime_defaults:
  relationship: 未有边界前事件或逐项Profile来源建立信任、忠诚、敌对或不信任时，运行态一律为neutral；basis_event使用canon:runtime_defaults.relationship。
