data_constraints:
- 所有事实必须限定在电视剧《甄嬛传》及共享快照'甄嬛初次失宠之前'内
- 不得使用共享快照之后的剧情
- 不得混入原著小说、剧本、广播剧、漫画或同人创作
- 只做事实级转述，不复制原作台词
- 无法可靠确认的细节宁可省略
- 不得伪造URL、章节号或集数
- Anchor池事件必须按时间排序
- Location连接必须引用已列出的地点ID
- Item类型和可携带性必须来自当前来源范围及共享快照
- known_by和anchor_for只能使用Roster中的角色ID
- 每个cf_edit必须给出只改变关键原因的真实替代情形，禁止写'无'
- 同一角色不同事件之间的状态变化必须保持一致
