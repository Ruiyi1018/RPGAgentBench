world_id: world_006
source: 2011年中国大陆76集版电视剧《甄嬛传》第1至第10集
events:
- id: ev_001_selection
  canon_order: '01.1'
  source_locator: 76集版第1集，选秀
  fact: 甄嬛、沈眉庄与安陵容参加选秀并被选入宫。
  known_by: [zhen_huan, emperor_yongzheng, empress_yixiu, an_lingrong, shen_meizhuang, su_peisheng]
  state_change: 甄嬛、沈眉庄与安陵容取得后宫妃嫔身份及入宫资格。
  cf_edit: 若安陵容未获留牌，仅将安陵容的入宫资格改为未取得，她便不能以妃嫔身份参与后续宫中往来。
  anchor_for: [zhen_huan, an_lingrong, shen_meizhuang]
- id: ev_002_palace_assignment
  canon_order: '03.1'
  source_locator: 76集版第3集，新人入宫安置
  fact: 甄嬛入住碎玉轩，沈眉庄入住咸福宫存菊堂，安陵容入住延禧宫。
  known_by: [zhen_huan, emperor_yongzheng, empress_yixiu, an_lingrong, shen_meizhuang, su_peisheng]
  state_change: 三人的当前居所和各自宫室通行起点被确定。
  cf_edit: 若只将安陵容的安置地点改为碎玉轩，她的当前居所与日常接触对象会改变，甄嬛和沈眉庄的居所不变。
  anchor_for: [zhen_huan, an_lingrong, shen_meizhuang]
- id: ev_003_haitang_buried
  canon_order: '04.1'
  source_locator: 76集版第4集，碎玉轩海棠树
  fact: 甄嬛发现碎玉轩海棠树下埋有麝香，确认此处曾被用于暗害芳贵人。
  known_by: [zhen_huan]
  state_change: 甄嬛新增“碎玉轩曾有隐蔽加害风险”的私密知识，并提高对宫中环境的警惕。
  cf_edit: 若树下挖出的物品不含麝香，仅撤销这一证据，甄嬛便不能据此确认碎玉轩曾有该项加害风险。
  anchor_for: [zhen_huan]
- id: ev_004_zhen_avoids_favor
  canon_order: '04.2'
  source_locator: 76集版第4集，甄嬛请温实初协助称病
  fact: 甄嬛请温实初协助长期称病，以暂避侍寝和后宫争宠。
  known_by: [zhen_huan]
  state_change: 甄嬛建立暂避侍寝的主动计划，并把“自保优先于立刻获宠”设为当时承诺。
  cf_edit: 若只改变甄嬛是否请温实初配合称病，她将不具备持续避宠的执行条件，而其入宫身份与居所不变。
  anchor_for: [zhen_huan]
- id: ev_005_shen_favored
  canon_order: '04.3'
  source_locator: 76集版第4集，沈眉庄首次承宠后
  fact: 沈眉庄较早获皇帝召幸，并获准学习协理六宫事务。
  known_by: [emperor_yongzheng, hua_fei, empress_yixiu, an_lingrong, shen_meizhuang, su_peisheng, zhen_huan]
  state_change: 沈眉庄由新入宫妃嫔转为受宠贵人，并取得学习宫务的有限权限。
  cf_edit: 若只撤销皇帝让沈眉庄学习宫务的许可，她仍曾承宠，但没有该项宫务学习权限。
  anchor_for: [shen_meizhuang, emperor_yongzheng, hua_fei, empress_yixiu]
- id: ev_006_garden_meeting
  canon_order: '06.1'
  source_locator: 76集版第6集，御花园秋千旁
  fact: 甄嬛在御花园秋千旁与隐瞒身份的皇帝相遇，并把他当作果郡王。
  known_by: [zhen_huan, emperor_yongzheng]
  state_change: 皇帝知道称病的甄嬛可以在御花园活动；甄嬛记住了这位自称果郡王的男子，但尚不知道其真实身份。
  cf_edit: 若皇帝没有隐瞒身份，甄嬛会当场知道对方是皇帝；只改变身份披露，不改变相遇本身。
  anchor_for: [zhen_huan, emperor_yongzheng]
- id: ev_007_identity_revealed
  canon_order: '07.1'
  source_locator: 76集版第7集，皇帝出面制止余氏欺凌
  fact: 皇帝向甄嬛表明真实身份，甄嬛得知此前相遇者就是皇帝。
  known_by: [zhen_huan, emperor_yongzheng, su_peisheng]
  state_change: 甄嬛关于相遇者身份的知识由“果郡王”纠正为“皇帝”，避宠状态随之结束。
  cf_edit: 若皇帝此次仍不披露身份，仅保留身份隐瞒，甄嬛就不会在该时点纠正身份认知。
  anchor_for: [zhen_huan, emperor_yongzheng, su_peisheng]
- id: ev_008_zhen_first_favor
  canon_order: '08.1'
  source_locator: 76集版第8集，甄嬛首次侍寝
  location_id: loc_009
  fact: 甄嬛首次承宠，皇帝公开表现出对她的明显恩宠。
  known_by: [zhen_huan, emperor_yongzheng, hua_fei, empress_yixiu, an_lingrong, shen_meizhuang, su_peisheng]
  state_change: 甄嬛由称病避宠转为受宠的莞常在，并取得由苏培盛通传皇帝召见的渠道。
  cf_edit: 若只撤销此次召幸，甄嬛仍知道皇帝身份，但不会在该时点取得受宠状态和召见渠道。
  anchor_for: [zhen_huan, emperor_yongzheng, hua_fei, empress_yixiu, su_peisheng]
- id: ev_009_hua_punishes
  canon_order: '08.2'
  source_locator: 76集版第8集，景仁宫众妃请安
  fact: 众妃在景仁宫请安时，华妃公开以专宠为由讥讽甄嬛，皇后出面制止。
  known_by: [zhen_huan, hua_fei, empress_yixiu, an_lingrong, shen_meizhuang]
  state_change: 甄嬛取得华妃公开敌视自己的直接证据，对华妃的关系转为不信任；皇后公开维持了中宫秩序。
  cf_edit: 若华妃在该次请安中没有以专宠为由针对甄嬛，仅撤销这次公开言语行动，甄嬛便缺少该次敌意的直接证据。
  anchor_for: [zhen_huan, hua_fei]
- id: ev_010_poison_exposed
  canon_order: '10.1'
  source_locator: 76集版第10集，碎玉轩查出下药
  fact: 甄嬛与身边人查出花穗、小印子受余氏指使，在她的汤药中下药。
  known_by: [zhen_huan, emperor_yongzheng, su_peisheng]
  state_change: 甄嬛取得余氏指使下药的证据；皇帝据禀报取得处分余氏的事实依据。
  cf_edit: 若审问时花穗、小印子没有供出余氏，仅撤销指向余氏的口供，甄嬛与皇帝便不能据此确认主使者。
  anchor_for: [zhen_huan, emperor_yongzheng, su_peisheng]
- id: ev_011_yu_ordered_dead
  canon_order: '10.2'
  source_locator: 76集版第10集，皇帝下旨处死余氏
  fact: 甄嬛向皇帝说明下药及倚梅园冒名之事后，皇帝下旨处死余氏。
  known_by: [zhen_huan, emperor_yongzheng, su_peisheng]
  state_change: 皇帝建立处死余氏的明确口谕，苏培盛取得监督执行该口谕的权限与责任。
  cf_edit: 若皇帝只下旨将余氏继续幽禁而非处死，仅改变处分内容，苏培盛就没有执行死刑的授权。
  anchor_for: [emperor_yongzheng, su_peisheng, zhen_huan]
- id: ev_012_yu_executed
  canon_order: '10.3'
  source_locator: 76集版第10集，安陵容提示后宫人执行赐死
  location_id: loc_010
  fact: 余氏抗旨不肯自尽；安陵容提示既有赐死旨意即可强制执行，苏培盛随后令宫人完成处置。
  known_by: [an_lingrong, su_peisheng, zhen_huan, shen_meizhuang]
  knowledge_scope:
    execution_result:
      known_by: [an_lingrong, su_peisheng, zhen_huan, shen_meizhuang, emperor_yongzheng]
      content: 余氏已按赐死旨意被处置。
    an_lingrong_suggestion:
      known_by: [an_lingrong, su_peisheng, zhen_huan, shen_meizhuang]
      content: 安陵容曾提示可依既有赐死旨意强制执行；甄嬛与沈眉庄随后议论该处置方式，安陵容听到议论。
    physical_execution_details:
      known_by: [an_lingrong, su_peisheng]
      content: 强制执行的现场过程只限实际推动或执行一方知晓，未赋予甄嬛、沈眉庄或默认Player。
  state_change: 皇帝处死余氏的口谕被履行；甄嬛、沈眉庄得知安陵容推动强制执行并对此产生戒备，安陵容听到二人议论后，三方姐妹关系由此前信任转为有隔阂的中立。
  cf_edit: 若安陵容没有作出这一提示，仅撤销该信息输入，苏培盛在该时点不会因她的建议而改用强制执行。
  anchor_for: [an_lingrong, su_peisheng, zhen_huan, shen_meizhuang]
