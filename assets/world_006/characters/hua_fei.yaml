  snapshot_boundary: canon.yaml#canon_policy.shared_snapshot
  identity_authority:
    identity.role: {source: canon_fact_hua_palace_authority}
    capability.authority.palace_affairs: {source: canon_fact_hua_palace_authority, scope: 仅限部分宫务影响与翊坤宫差使}
    capability.limitations: {source: canon_fact_hua_palace_authority}
  current_relationships:
    social.relationship_rules.zhen_huan: {source: [ev_008_zhen_first_favor, ev_009_hua_punishes], state: hostile}
    social.relationship_rules.shen_meizhuang: {source: canon:runtime_defaults.relationship, state: neutral, note: 沈眉庄受宠与学习宫务不单独证明华妃已形成敌对关系等级}
    social.relationship_rules.empress_yixiu: {source: ev_009_hua_punishes, state: distrustful}
    social.relationship_rules.emperor_yongzheng: {source: canon:runtime_defaults.relationship, state: neutral, note: 受宠与在意皇帝态度不单独证明忠诚等级}
  current_knowledge:
    shen_favor_and_permission: {source: ev_005_shen_favored}
    zhen_favor: {source: ev_008_zhen_first_favor}
    own_public_confrontation: {source: ev_009_hua_punishes}
  goals_permissions_limits:
    preserve_favor: {source: [ev_005_shen_favored, ev_008_zhen_first_favor]}
    pressure_new_favorites: {source: ev_009_hua_punishes}
    use_palace_affairs: {source: canon_fact_hua_palace_authority, scope: 不含处分、废黜、处死或皇帝召见}
