data_constraints:
- 所有anchor事件必须发生在共享快照（第三次识破白骨精之前）之前。
- 所有事件事实只可依据通行本第二十七回内容，不得混入其他章节或改编版本细节。
- 不得引用原文语句，只允许事实级转述。
- 地点和物品必须限于白虎岭相关场景及师徒随身之物。
- 孙悟空、唐僧、猪八戒、沙僧、白骨精、黑狐精、白龙马为可使用角色ID，不得新增角色。
- 每个cf_edit必须提供真实替代情形，且只改变关键原因。
- Anchor池事件必须按时间排序。
- 不得生成共享快照之后的剧情事件。
- 所有known_by和anchor_for必须使用roster中已有ID。
- 不得伪造章节号、页数、原文片段或外部来源。
