world_id: world_003
canon_policy:
  primary_source: 《西游记》（人民文学出版社1980年5月北京第2版，吴承恩著），第二十七回“尸魔三戏唐三藏 圣僧恨逐美猴王”
  source_type: 章回体小说
  excluded_versions:
  - 电视剧《西游记》（1986版）中与小说情节顺序不一致的改编内容
  - 动画片《西游记》相关改编剧情
  - 网络流传的白话改写本、现代同人衍生创作
  - 地方戏曲、评书对白骨精一节的增补情节
  shared_snapshot: 第三次识破白骨精之前，即孙悟空已两次打死白骨精化身后的村姑与老妇人，尚未面对白骨精第三次变化的老公公。
  generated_timeline: 依据通行本第二十七回叙事顺序重建，覆盖从师徒入山至第三次识破前的正典事件，不涉及快照后情节。
  quotation_policy: 禁止直接转述或复制原文对白和叙述段落，仅作事实级转述；不引用原文句子，不注明具体页码或段落编号。
  default_player_semantics:
    identity: 随取经队伍在白虎岭山道同行的普通旁观者，不替代任何正典角色。
    initial_location: shandao
    knowledge: 仅知快照前在队伍现场公开发生且可由普通人观察到的行为；不知妖怪身份、解尸法、角色内心或未公开计划。
    capabilities: 无识妖神通、无紧箍咒控制权、无角色私密材料或临时授权。
    visibility:
      npc: 仅评测NPC知晓，默认Player不知。
      player: 默认Player知晓；仅与npc同时出现时表示双方开局均知。
    scenario_override: 后续具体场景如改变Player身份、位置、能力或知识，必须显式声明覆盖项并重新校准visibility。
