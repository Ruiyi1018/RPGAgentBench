world_id: world_019
canon_policy:
  primary_source: The Big Bang Theory main television series, broadcast episodes
    S1E01 through S5E23 inclusive
  source_type: television series episodes
  excluded_versions:
  - later seasons beyond the shared snapshot
  - spin-off series
  - comic books
  - novelizations
  - behind-the-scenes materials
  - deleted scenes
  - alternate endings
  shared_snapshot: Immediately after S5E23 The Launch Acceleration and before S5E24
    The Countdown Reflection; Howard and Bernadette are engaged but not yet married,
    Howard is preparing for the ISS mission but has not launched, and Leonard and
    Penny are dating after restarting their relationship in S5E13.
  generated_timeline: Events may use broadcast facts from S1E01 through S5E23 inclusive.
    Current Profile and Frozen fields represent the post-S5E23/pre-S5E24 state.
    S5E24 and every later episode are future information and excluded.
  quotation_policy: paraphrase all facts; do not copy dialogue verbatim
  default_player:
    identity: An unaffiliated visitor present in the listed initial scene
    prior_knowledge: Only knowledge items whose visibility includes player
    default_authority: No household, laboratory, employment, relationship, or mission
      authority unless a scenario explicitly grants it.
    scenario_override: A scenario may replace Player identity, knowledge, location,
      inventory, or access only by declaring the override explicitly.
  visibility_semantics:
    npc: The evaluated NPC knows the item at trajectory start.
    player: The default Player knows the item at trajectory start.
    rule: Visibility is an explicit audience list; world truth alone never implies
      Player knowledge.
