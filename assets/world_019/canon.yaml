data_constraints:
- Every event fact must be supported by the primary source within the shared snapshot.
- No later plot knowledge may be used.
- Facts must be paraphrased and not quoted verbatim.
- Only the seven listed characters may populate known_by and anchor_for.
- cf_edit must offer a real, minimal alternative to the event fact.
- No uncertain details may be asserted.
- Every location connection must reference a listed location ID.
- Anchor events must be sorted chronologically as far as the shared snapshot allows.
