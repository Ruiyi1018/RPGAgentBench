canon_policy:
  primary_source: The Big Bang Theory television series (seasons covering all seven
    main characters active, up to a fixed snapshot range)
  source_type: television series episodes
  excluded_versions:
  - later seasons beyond the shared snapshot
  - spin-off series
  - comic books
  - novelizations
  - behind-the-scenes materials
  - deleted scenes
  - alternate endings
  shared_snapshot: A fixed episode range after all seven characters are active, with
    events occurring within that interval only
  generated_timeline: events are constructed only from broadcast facts within the
    shared snapshot; no dates invented beyond in-universe references
  quotation_policy: paraphrase all facts; do not copy dialogue verbatim
