knowledge_evidence:
- id: ke_s1e05_group_observes_penny_at_work
  source_episode: S1E05 The Hamburger Postulate
  acquisition: Leonard and Howard directly encounter Penny working as their waitress
    at The Cheesecake Factory.
  known_by:
  - leonard_hofstadter
  - howard_wolowitz
- id: ke_s3e05_bernadette_observes_howard_courtship
  source_episode: S3E05 The Creepy Candy Coating Corollary
  acquisition: On their first double date, Bernadette directly observes Howard use
    exaggerated flirtation and jokes while trying to impress her.
  known_by:
  - bernadette_rostenkowski
- id: ke_s4e20_bernadette_observes_raj_alcohol_condition
  source_episode: S4E20 The Herb Garden Germination
  acquisition: At The Cheesecake Factory, Bernadette directly hears Raj explain that
    liquor has enabled him to speak to her and observes that he speaks only after drinking.
  known_by:
  - bernadette_rostenkowski
- id: ke_s4e24_bernadette_hears_roommate_rules
  source_episode: S4E24 The Roommate Transmogrification
  acquisition: During the Apartment 4A gathering, Bernadette and Howard directly hear
    Sheldon invoke the Roommate Agreement's after-10-p.m. restrictions.
  known_by:
  - bernadette_rostenkowski
  - howard_wolowitz
- id: ke_s5e10_penny_observes_knock_ritual
  source_episode: S5E10 The Flaming Spittoon Acquisition
  acquisition: Penny directly hears Sheldon's repeated triple-knock-and-name sequence
    at her Apartment 4B door.
  known_by:
  - penny
- id: ke_s5e19_group_relationship_status
  source_episode: S5E19 The Weekend Vortex
  acquisition: In Apartment 4A, Amy, Howard, and Raj directly participate in the discussion
    that treats Leonard and Penny as dating and Amy and Sheldon as girlfriend and boyfriend.
  known_by:
  - amy_farrah_fowler
  - howard_wolowitz
  - raj_koothrappali
- id: ke_s5e19_group_gathering
  source_episode: S5E19 The Weekend Vortex
  acquisition: Raj and Penny directly participate in the Apartment 4A gathering built
    around the group's shared gaming and social plans.
  known_by:
  - raj_koothrappali
  - penny
- id: ke_s5e19_amy_invokes_relationship_notice
  source_episode: S5E19 The Weekend Vortex
  acquisition: Amy directly invokes the Relationship Agreement's advance-notice terms
    when reminding Sheldon of their planned family visit.
  known_by:
  - amy_farrah_fowler
data_constraints:
- Every event fact must be supported by the primary source within the shared snapshot.
- No later plot knowledge may be used.
- Facts must be paraphrased and not quoted verbatim.
- Only the seven listed characters may populate known_by and anchor_for.
- cf_edit must offer a real, minimal alternative to the event fact.
- No uncertain details may be asserted.
- Every location connection must reference a listed location ID.
- Anchor events must be sorted chronologically as far as the shared snapshot allows.
- Current state must match the post-S5E23 and pre-S5E24 boundary.
- Player knowledge is granted only by an explicit player entry in a visibility list
  or an explicit scenario override.
