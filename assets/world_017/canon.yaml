data_constraints:
- 所有anchor事件必须能由4.3版本及此前游戏内内容直接或合理推出
- 不写入任何4.4版本及之后新增的剧情变化
- 不得伪造任务名、版本号或无出处的细节
- 若某事件无法确认具体发生时段，仅保留大致时序，不标注精确章节号
- 跨区角色关系只能在双方均已有明确游戏内互动记录时写入
- 不把玩家行为或非官方二设当作正典
- 不把默认Player视为旅行者；Player知识与权限只由Frozen可见性、access或场景显式覆盖产生
