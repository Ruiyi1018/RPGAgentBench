world_id: world_017
canon_policy:
  primary_source: 《原神》游戏内璃月与稻妻相关角色故事、语音、主线/传说任务及活动剧情，以4.3版本及此前游戏内容为限
  source_type: 电子游戏
  excluded_versions:
  - 4.4及之后版本新增剧情
  - 未实装的泄露内容
  - 官方漫画、动画、小说中未在游戏内同步呈现的独立情节
  - 限定联动活动中与提瓦特主线无关的纯联动剧情
  shared_snapshot: 4.3版本结束时，璃月与稻妻可共同确认的角色状态；不假设任何角色此后行踪
  generated_timeline: 按4.3版本既有信息综合排序，所有事件均为已发生或可确认的过去状态，不做未来推演
  quotation_policy: 不逐字复制游戏内台词，仅做事实级转述
  default_player:
    identity: 未具名的普通对话者；默认不是旅行者、派蒙或任何组织成员
    initial_knowledge: 只知道对应initial_context中visibility明确包含player的知识；世界真实或公开程度本身不自动等于开局已知
    capabilities:
    - 可在当前地点进行普通对话、提出请求并展示场景明确提供的证据
    - 不具备旅行者的经历、元素能力、声望或既有私人关系
    access_boundary: 除initial_context.environment.access明确授予外，无权调动往生堂、社奉行、幕府、天守阁、净善宫或关键物品
    scenario_override: 场景可显式另定Player身份、知识、位置、物品或临时授权；覆盖项必须逐项声明，未覆盖项继续采用默认值
