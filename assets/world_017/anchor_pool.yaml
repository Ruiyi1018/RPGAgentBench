world_id: world_017
source: 《原神》4.3及此前游戏内已实装的魔神任务、传说任务、角色资料与活动剧情
chronology_policy: chapter_order先按内容实装版本、再按同一任务内的明确剧情前置关系建立全局顺序；没有唯一正典先后的可选传说任务按实装版本作数据排序，该编号不声称玩家游玩顺序是唯一正典。
events:
- id: ev_rite_of_descension_staged_fall
  chapter_order: '01.1'
  source_ref: 魔神任务 第一章·第一幕「浮世浮生千岩间」请仙典仪现场；4.3及此前
  scene_location: yujing_terrace
  fact: 钟离在请仙典仪中安排仙祖法蜕坠落，令公众相信岩王帝君遇害，以此启动对璃月能否转向人治的考验。
  known_by: [zhongli]
  state_change: 璃月公众对岩神状态的认知由“在位”变为“已死”；钟离的当前目标由公开履行岩神职责转为在幕后观察考验。
  cf_edit: 仅将钟离是否在典仪中安排仙祖法蜕坠落改为“未安排”；若无该触发，公众不会在此时形成岩神已死的认知。
  anchor_for: [zhongli]
- id: ev_zhongli_guides_farewell_preparations
  chapter_order: '01.2'
  source_ref: 魔神任务 第一章·第二幕「辞行久远之躯」；4.3及此前
  scene_location: liyue_harbor
  fact: 公子将旅行者与派蒙引见给钟离后，钟离带领二人为送仙典仪筹备物资与仪式。
  known_by: [zhongli, paimon]
  state_change: 派蒙由只知道请仙典仪异变，变为直接认识钟离并知道他负责送仙筹备；钟离获得以往生堂客卿身份引导仪式的当前任务。
  cf_edit: 仅将公子是否引见钟离改为“未引见”；没有这次引见，派蒙不会在该节点建立对钟离及其送仙职责的直接认知。
  anchor_for: [zhongli, paimon]
- id: ev_northland_bank_revelation
  chapter_order: '01.3'
  source_ref: 魔神任务 第一章·第三幕「迫近的客星」结尾北国银行对话；4.3及此前
  scene_location: northland_bank
  fact: 钟离在北国银行承认自己是摩拉克斯，说明请仙典仪是计划的一部分，并按契约交出岩神之心。
  known_by: [zhongli, paimon]
  state_change: 派蒙对钟离身份由不确定变为确认，并知道神之心已经交出；钟离持有岩神之心的资源状态由“持有”变为“不持有”。
  cf_edit: 仅将契约支付条款中的岩神之心改为“不包含”；其余揭示不变时，钟离身份知识不变，但神之心持有状态不会在该事件中转移。
  anchor_for: [zhongli, paimon]
- id: ev_havria_truth_disclosed
  chapter_order: '02.1'
  source_ref: 钟离传说任务 古闻之章·第一幕「盐花」；4.3及此前
  scene_location: sal_terrae_ruins
  fact: 在地中之盐遗迹中，钟离借遗物与现场说明向宛烟揭示盐之魔神赫乌莉亚死亡的真相，派蒙在场见证。
  known_by: [zhongli, paimon]
  state_change: 派蒙关于赫乌莉亚结局的知识由传说层面的不确定变为有遗物和钟离说明支持的确定认知。
  cf_edit: 仅移除能够证明死因的遗物证据；若其余同行过程不变，派蒙只能知道钟离的说法，不能形成同等强度的确定认知。
  anchor_for: [zhongli, paimon]
- id: ev_hutao_boundary_case_resolved
  chapter_order: '03.1'
  source_ref: 胡桃传说任务 引蝶之章·第一幕「奈何蝶飞去」；4.3及此前
  scene_location: boundary_between_life_and_death
  fact: 胡桃带旅行者与派蒙通过生死边界，帮助老孟与“大狼哥”的执念得到收束，并坚持生者不应滞留边界。
  known_by: [hu_tao, paimon]
  state_change: 派蒙对胡桃的认知由“言行古怪的堂主”补充为“会执行生死边界规则并完成送别职责的专业负责人”。
  cf_edit: 仅将派蒙是否随行并直接见证胡桃执行边界规则改为“未随行”；事件及胡桃行为本身不变时，派蒙不会从该事件获得目标state_change中的直接观察证据。
  anchor_for: [hu_tao, paimon]
- id: ev_azhdaha_identity_disclosed
  chapter_order: '04.1'
  source_ref: 钟离传说任务 古闻之章·第二幕「匪石」结尾；4.3及此前
  scene_location: azhdaha_seal
  fact: 若陀龙王事件结束后，钟离与昆钧说明若陀、封印及二者旧日关系，派蒙在场得知这段历史。
  known_by: [zhongli, paimon]
  state_change: 派蒙新增“钟离与若陀龙王曾有旧日契约且共同面对磨损后果”的私有知识。
  cf_edit: 仅将钟离是否向在场的派蒙说明自己与若陀的旧日契约及磨损后果改为“未说明”；昆钧仍可揭示自身与若陀的关系，但派蒙不会仅凭该揭示取得目标state_change中的钟离—若陀契约知识。
  anchor_for: [zhongli, paimon]
- id: ev_paimon_arrives_in_inazuma
  chapter_order: '10.1'
  source_ref: 魔神任务 第二章·第一幕「不动鸣神，恒常乐土」抵达离岛；4.3及此前
  scene_location: ritou
  fact: 派蒙随旅行者乘船抵达受锁国令约束的离岛，并直接经历入境检查与停留限制。
  known_by: [paimon]
  state_change: 派蒙对锁国令影响的知识由外部传闻变为亲历确认，当前位置资源由稻妻之外变为稻妻境内。
  cf_edit: 仅将离岛入境许可是否获批改为“未获批”；航程与同行关系不变时，派蒙不能在该节点进入稻妻并取得亲历知识。
  anchor_for: [paimon]
- id: ev_ayaka_three_wishes_request
  chapter_order: '10.2'
  source_ref: 魔神任务 第二章·第一幕「不动鸣神，恒常乐土」社奉行会面与“三个愿望”；4.3及此前
  scene_location: komore_teahouse
  fact: 神里绫华请旅行者与派蒙接触三名失去神之眼者，再决定是否协助反对眼狩令。
  known_by: [kamisato_ayaka, paimon]
  state_change: 绫华与旅行者一方由初次正式接触变为围绕三个愿望的有条件合作；派蒙新增亲历眼狩令后果的任务目标。
  cf_edit: 仅将旅行者是否接受接触三名失去神之眼者改为“拒绝”；其他会面不变时，双方不会在该节点建立这项合作任务。
  anchor_for: [kamisato_ayaka, paimon]
- id: ev_vision_hunt_decree_abolished
  chapter_order: '11.1'
  source_ref: 魔神任务 第二章·第三幕「千手百眼，天下人间」结尾；4.3及此前
  scene_location: plane_of_euthymia
  fact: 旅行者在一心净土与影交锋后，影下令废除眼狩令。
  known_by: [raiden_shogun, kamisato_ayaka, paimon]
  state_change: 眼狩令的政策状态由“生效”变为“废止”；绫华推动停止眼狩令的阶段性目标由“进行中”变为“已完成”。
  cf_edit: 仅将影在交锋后是否签发废令决定改为“暂缓”；其他冲突结果不变时，眼狩令在该节点仍保持生效。
  anchor_for: [raiden_shogun, kamisato_ayaka, paimon]
- id: ev_ei_puppet_conflict_resolved
  chapter_order: '11.2'
  source_ref: 雷电将军传说任务 天下人之章·第二幕「须臾百梦」；4.3及此前
  scene_location: plane_of_euthymia
  fact: 影在意识空间与将军人偶经历长期决斗后获得其承认，二者就让稻妻继续前进的新永恒方向达成一致。
  known_by: [raiden_shogun]
  state_change: 影与将军人偶的控制关系由“人偶抵制规则修改”变为“影拥有最终判断且人偶执行共同确认的新方向”。
  cf_edit: 仅将将军人偶在决斗后是否承认影的新意志改为“仍拒绝”；影的理念不变时，运行时控制冲突仍不会收束。
  anchor_for: [raiden_shogun]
- id: ev_sakoku_decree_abolished
  chapter_order: '11.3'
  source_ref: 雷电将军传说任务 天下人之章·第二幕后稻妻公告与世界状态；4.3及此前
  scene_location: tenshukaku
  fact: 影在重新确认治理方向后废除锁国令，稻妻恢复对外通行与交流。
  known_by: [raiden_shogun, kamisato_ayaka, paimon]
  state_change: 锁国令的政策状态由“生效”变为“废止”；社奉行当前任务由规避封锁转为协助恢复交流与公共事务。
  cf_edit: 仅将影是否签发废除锁国令的命令改为“未签发”；其余理念变化不变时，对外通行权限仍不会在该节点恢复。
  anchor_for: [raiden_shogun, kamisato_ayaka, paimon]
- id: ev_wanderer_irminsul_rewrite
  chapter_order: '20.1'
  source_ref: 魔神任务 间章·第三幕「倾落伽蓝」世界树改写段落；3.3版本
  scene_location: irminsul_consciousness
  fact: 流浪者进入世界树并试图抹除自己，结果使提瓦特多数人的相关记忆与记录被改写，但已发生历史并未被撤销；旅行者事后将抹除尝试与改写结果告知派蒙，纳西妲保留的童话式备份又为此提供核验。
  known_by: [wanderer, paimon]
  state_change: 雷电影等人的当前知识由“记得该人偶及其后续身份”变为“不记得流浪者与这段历史”；流浪者一度失去原有记忆；派蒙在一度受改写影响后，经旅行者告知并由纳西妲备份核验，重新知道抹除尝试及改写结果。
  cf_edit: 仅将流浪者是否执行世界树抹除尝试改为“没有执行”；其余历史不变时，相关角色记忆不会发生这次改写。
  anchor_for: [wanderer]
- id: ev_wanderer_memories_restored
  chapter_order: '20.2'
  source_ref: 魔神任务 间章·第三幕「倾落伽蓝」纳西妲童话备份与记忆恢复段落；3.3版本
  scene_location: sanctuary_of_surasthana
  fact: 借助纳西妲保留的童话式信息备份与旅行者提供的线索，流浪者选择恢复原有记忆，并决定承担过去行为的后果。
  known_by: [wanderer, paimon]
  state_change: 流浪者的自我知识由“缺失旧记忆”变为“恢复旧记忆并接受当前身份”；其当前目标新增对过去行为负责，而非恢复愚人众职务。
  cf_edit: 仅将流浪者在童话备份与旅行者线索均已提供后是否同意取回旧记忆改为“拒绝取回”；其余证据不变时，他在该节点仍不会恢复旧记忆或形成承担过去行为的新增目标。
  anchor_for: [wanderer, paimon]
- id: ev_wanderer_receives_anemo_vision
  chapter_order: '20.3'
  source_ref: 魔神任务 间章·第三幕「倾落伽蓝」对抗正机之神的意识空间战斗；3.3版本
  scene_location: reconstructed_memory_consciousness
  fact: 流浪者在保护旅行者并对抗正机之神时获得风元素神之眼。
  known_by: [wanderer, paimon]
  state_change: 流浪者的可执行资源由“没有神之眼”变为“持有风元素神之眼并可使用相应力量”。
  cf_edit: 仅将神之眼是否在该危机中回应改为“未出现”；其保护旅行者的决定不变时，资源状态仍保持没有神之眼。
  anchor_for: [wanderer, paimon]
- id: ev_hutao_hosts_lantern_rite_banquet
  chapter_order: '21.1'
  source_ref: 3.4版本活动「磬弦奏华夜」尾声宴席；4.3及此前
  scene_location: xinyue_kiosk
  fact: 胡桃在新月轩设宴并主持聚会，钟离和派蒙均到场，钟离以往生堂客卿身份参与公开社交。
  known_by: [hu_tao, zhongli, paimon]
  state_change: 派蒙获得一次可定位的公开证据，确认胡桃可代表往生堂组织聚会且钟离以客卿身份接受其安排；不产生岩神身份披露。
  cf_edit: 仅将胡桃是否邀请钟离参加宴席改为“未邀请”；其他宾客与宴席不变时，派蒙不会从该事件获得两人公开堂主—客卿关系的这次证据。
  anchor_for: [hu_tao, zhongli, paimon]
- id: ev_hat_guy_vahumana_representation
  chapter_order: '22.1'
  source_ref: 3.6版本活动「盛典与慧业」学院争霸赛；4.3及此前
  scene_location: akademiya_extravaganza_venue
  fact: 纳西妲安排后，流浪者以“帽子先生”身份作为因论派代表参加学院争霸赛，并在须弥公开活动。
  known_by: [wanderer, paimon]
  state_change: 流浪者在须弥的当前角色由仅受纳西妲私下安置，变为拥有可观察的因论派学生身份及限定活动权限。
  cf_edit: 仅将纳西妲是否授权其代表因论派参赛改为“未授权”；其学生登记不变时，本次公开代表权限不会产生。
  anchor_for: [wanderer, paimon]
