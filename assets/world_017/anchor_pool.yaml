world_id: world_017
source: 《原神》游戏内璃月与稻妻相关角色故事、语音、主线/传说任务及活动剧情，以4.3版本及此前游戏内容为限
events:
- id: ev_zhongli_as_rex_lapis
  fact: 钟离即岩神摩拉克斯，在璃月以凡人身份活动，向部分知情者隐瞒神明身份。
  known_by:
  - zhongli
  - hu_tao
  state_change: 由神明真实身份可被少数人确认，转向公开层面仍维持凡人身份。
  cf_edit: 如果璃月没有发生请仙典仪上的神陨事件，钟离可能不会以凡人身份长期留在璃月港。
  anchor_for:
  - zhongli
  - hu_tao
- id: ev_hu_tao_wangsheng_director
  fact: 胡桃是往生堂现任堂主，负责璃月丧葬与阴阳相关事务。
  known_by:
  - hu_tao
  - zhongli
  state_change: 往生堂的职责与胡桃个人立场形成稳定绑定。
  cf_edit: 如果胡桃没有继承往生堂堂主之位，她可能不会如此自然地接触钟离及其他仙人相关事务。
  anchor_for:
  - hu_tao
  - zhongli
- id: ev_zhongli_employed_by_hutao
  fact: 钟离由胡桃安排为往生堂客卿，日常负责筹备丧仪、鉴定古物与处理各类委托。
  known_by:
  - zhongli
  - hu_tao
  state_change: 钟离在凡人社会中获得稳定身份，并与胡桃建立长期合作关系。
  cf_edit: 如果胡桃没有邀请钟离进入往生堂，钟离留在璃月港的身份可能更难被普通民众解释。
  anchor_for:
  - zhongli
  - hu_tao
- id: ev_paimon_travel_companion
  fact: 派蒙以旅伴身份与旅行者同行，在璃月与稻妻均有活动记录。
  known_by:
  - paimon
  state_change: 派蒙从与旅行者相遇后的漂泊伙伴，逐渐参与跨地区事件。
  cf_edit: 如果派蒙没有选择跟随旅行者，她可能不会进入璃月与稻妻的众多政治与神明事件。
  anchor_for:
  - paimon
- id: ev_zhongli_liyue_archon_quest
  fact: 钟离以送仙仪式相关安排推动璃月人治过渡，并让岩神之心转交给至冬一方。
  known_by:
  - zhongli
  - paimon
  state_change: 璃月从岩神直接统领状态转向人治，钟离逐步退居幕后。
  cf_edit: 如果钟离没有放弃神之心，璃月政体可能不会在短时间内完成如此彻底的人治交接。
  anchor_for:
  - zhongli
  - paimon
- id: ev_hu_tao_lantern_rite_participation
  fact: 胡桃在璃月节庆期间参与往生堂相关仪式，并与其他璃月角色有共同活动。
  known_by:
  - hu_tao
  - zhongli
  state_change: 胡桃由日常丧仪经营者扩展至大型公共节庆参与者。
  cf_edit: 如果往生堂不参与节庆事务，胡桃在公共场合与钟离同行的机会会减少。
  anchor_for:
  - hu_tao
  - zhongli
- id: ev_raiden_pursues_eternity
  fact: 雷电将军以追求永恒为治理核心，对稻妻内部异变与外界变化采取高度控制。
  known_by:
  - raiden_shogun
  - kamisato_ayaka
  state_change: 稻妻政策长期固化，许多人物命运都受到锁国与眼狩令影响。
  cf_edit: 如果雷电将军没有将永恒作为唯一执政目标，稻妻可能不会长时间维持高压封闭状态。
  anchor_for:
  - raiden_shogun
  - kamisato_ayaka
- id: ev_kamisato_ayaka_family_duty
  fact: 神里绫华作为神里家大小姐，承担社奉行与家族对外事务。
  known_by:
  - kamisato_ayaka
  - raiden_shogun
  state_change: 神里家继续在稻妻社会中保持重要政治与文化地位。
  cf_edit: 如果神里家失势，绫华可能无法以社奉行身份直接参与稻妻事务与接触旅行者。
  anchor_for:
  - kamisato_ayaka
  - raiden_shogun
- id: ev_wanderer_created_by_raiden
  fact: 流浪者原本与雷电将军有关联，是稻妻神明相关计划中留下的人偶，后被弃置并产生自我意识。
  known_by:
  - wanderer
  - raiden_shogun
  state_change: 一个本无既定生命轨迹的人偶开始独立行动，并最终以流浪者身份存在。
  cf_edit: 如果雷电将军没有选择将其舍弃，流浪者可能不会形成后来对神明与自身的强烈独立意识。
  anchor_for:
  - wanderer
  - raiden_shogun
- id: ev_wanderer_fatui_period
  fact: 流浪者曾以愚人众相关身份活动，后脱离该体系，恢复单独行动。
  known_by:
  - wanderer
  - paimon
  state_change: 流浪者从组织化的执行者变为更游离的独立个体。
  cf_edit: 如果流浪者没有离开愚人众，他可能仍受组织目标制约，不会以现在的方式在各地出现。
  anchor_for:
  - wanderer
  - paimon
- id: ev_ayaka_meets_traveler_and_paimon
  fact: 神里绫华在稻妻城及周边与旅行者和派蒙见面，并尝试寻求改变稻妻现状的方法。
  known_by:
  - kamisato_ayaka
  - paimon
  state_change: 绫华从被动维持家族立场，逐步转为直接参与改变稻妻政策的行动。
  cf_edit: 如果绫华没有主动接触旅行者和派蒙，她可能只能继续在社奉行内部等待机会。
  anchor_for:
  - kamisato_ayaka
  - paimon
- id: ev_paimon_inazuma_entry
  fact: 派蒙随旅行者进入稻妻，亲眼见证锁国令与眼狩令下的社会状况。
  known_by:
  - paimon
  - kamisato_ayaka
  state_change: 派蒙对稻妻局势的认识从传闻变为亲身经历。
  cf_edit: 如果旅行者和派蒙没有成功进入稻妻，他们与绫华及反抗势力的合作就无从展开。
  anchor_for:
  - paimon
  - kamisato_ayaka
- id: ev_raiden_gnosis_handled
  fact: 雷神之心未由雷电将军继续持有，而是经由相关人物转交至至冬一方。
  known_by:
  - raiden_shogun
  - paimon
  state_change: 稻妻神明对神之心的直接掌控被解除。
  cf_edit: 如果雷神之心始终由雷电将军本人保管，后续围绕该物的争夺与转交过程不会发生。
  anchor_for:
  - raiden_shogun
  - paimon
- id: ev_wanderer_confronts_raiden
  fact: 流浪者在稻妻相关事件中与雷电将军体系产生直接或间接对立认知。
  known_by:
  - wanderer
  - raiden_shogun
  state_change: 流浪者对自己与稻妻神明关系的理解从遗留身份转为主动审视。
  cf_edit: 如果流浪者从未回到稻妻或接近天守相关事务，他可能不会形成如此强烈的针对性态度。
  anchor_for:
  - wanderer
  - raiden_shogun
- id: ev_hutao_zhongli_rites
  fact: 胡桃与钟离曾共同处理涉及仙魂或亡者礼仪的委托。
  known_by:
  - hu_tao
  - zhongli
  state_change: 两人关系从雇佣层面深化为能共同应对特殊仪式的伙伴。
  cf_edit: 如果钟离不了解古老仪轨，胡桃在处理部分非人往生事务时会更困难。
  anchor_for:
  - hu_tao
  - zhongli
- id: ev_paimon_liyue_rites
  fact: 派蒙在璃月主线中见证送仙典仪及相关神明离开过程。
  known_by:
  - paimon
  - zhongli
  state_change: 派蒙对岩神真身与璃月权力更替的了解加深。
  cf_edit: 如果派蒙没有参与璃月主线，她可能无法在后续与钟离的对话中理解其真实身份。
  anchor_for:
  - paimon
  - zhongli
- id: ev_kamisato_festival
  fact: 神里绫华参与稻妻节庆活动，并在公开场合展现神里家立场。
  known_by:
  - kamisato_ayaka
  - paimon
  state_change: 绫华在政治活动之外也以文化人物身份成为稻妻公共形象之一。
  cf_edit: 如果神里家未主办或参与节庆，绫华与民众互动的公开渠道会减少。
  anchor_for:
  - kamisato_ayaka
  - paimon
- id: ev_zhongli_guyun_visit
  fact: 钟离曾前往孤云阁一带处理与镇压魔神相关的事务。
  known_by:
  - zhongli
  - paimon
  state_change: 岩神过去征战与封印遗留问题通过钟离的现身被部分揭示。
  cf_edit: 如果孤云阁没有镇压魔神遗迹，钟离可能不会在那里表现出与岩神身份高度相关的行动。
  anchor_for:
  - zhongli
  - paimon
- id: ev_raiden_witnesses_change
  fact: 雷电将军在稻妻主线末期经历对永恒路线的重新评估，并保留将军身份继续治理。
  known_by:
  - raiden_shogun
  - kamisato_ayaka
  state_change: 稻妻从极端锁国与眼狩令中开始逐步调整，神明自身对治理策略产生明显转变。
  cf_edit: 如果雷电将军从未见到旅行者带来的外部冲击，她可能不会启动对永恒观念的自我修正。
  anchor_for:
  - raiden_shogun
  - kamisato_ayaka
- id: ev_wanderer_new_name
  fact: 流浪者接受“流浪者”这一身份，并以不同于过去组织代号的方式存在。
  known_by:
  - wanderer
  - paimon
  state_change: 从被赋予身份转向自持身份，成为独立于稻妻神明体系也独立于至冬组织的个体。
  cf_edit: 如果流浪者仍沿用过去身份，他可能无法真正脱离原有组织影响。
  anchor_for:
  - wanderer
  - paimon
- id: ev_hutao_zhongli_public
  fact: 胡桃与钟离在日常活动中常以雇佣关系公开出现，周围人认可钟离为客卿。
  known_by:
  - hu_tao
  - zhongli
  state_change: 钟离作为往生堂一员的公共认知被固定下来。
  cf_edit: 如果钟离只在暗中行动，他在璃月的日常生活与节庆参与度会完全不同。
  anchor_for:
  - hu_tao
  - zhongli
- id: ev_ayaka_raiden_policy
  fact: 神里绫华反对眼狩令，并试图通过社奉行及外部协助改变雷电将军政策。
  known_by:
  - kamisato_ayaka
  - raiden_shogun
  state_change: 绫华从体制内部维护者转向体制内部改革者。
  cf_edit: 如果绫华认为维持家族安稳优先于国家变化，她可能不会冒险协助反抗势力。
  anchor_for:
  - kamisato_ayaka
  - raiden_shogun
- id: ev_paimon_cross_region
  fact: 派蒙在璃月与稻妻均作为同行者参与神明相关事件，成为跨区见证人。
  known_by:
  - paimon
  - zhongli
  - raiden_shogun
  state_change: 派蒙从单一地区旅伴成为多地区连续事件见证者。
  cf_edit: 如果派蒙未随旅行者跨地区行动，她就不可能同时出现在璃月与稻妻关键现场。
  anchor_for:
  - paimon
  - zhongli
  - raiden_shogun
