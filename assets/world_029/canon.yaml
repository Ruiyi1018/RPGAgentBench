data_constraints:
- Only use facts shown or stated within Season 1 episodes 1 through 12
- Do not use information from later seasons, comics, games, or other adaptations
- Paraphrase all storyline details and dialogue
- Anchor events must reflect the shared Season 1 snapshot
- Connections between locations must reference defined location IDs only
- Known_by and anchor_for values must reference roster character IDs only
