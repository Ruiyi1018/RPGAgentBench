world_id: world_029
canon_policy:
  primary_source: Rick and Morty Season 1 (Adult Swim original broadcast), S01E01-S01E11
  source_type: animated television series
  excluded_versions:
  - Season 2 and later episodes
  - Comic books
  - Manga
  - Promotional shorts
  - Video games
  shared_snapshot: Immediately before Rick activates the time freeze in the final S01E11 scene, after Beth and Jerry have entered the returned but still party-damaged Smith house; Birdperson has already left with Tammy, and no knowledge or state from Season 2 or later applies
  generated_timeline: Events are ordered by broadcast episode S01E01-S01E11 and then by explicit within-episode event order
  quotation_policy: Paraphrase all dialogue; do not reproduce exact lines
  player_semantics:
    identity: An ordinary present-day visitor at the NPC's listed starting location, with no pre-existing personal relationship to the evaluated NPC
    initial_knowledge: The Player knows only knowledge items whose visibility explicitly includes player; world truth and NPC-only knowledge are not automatically visible
    capabilities:
    - Ordinary conversation, observation, and movement through locations where access is explicitly available
    limitations:
    - No scientific, combat, portal-travel, institutional, parental, or household authority by default
    authorization: No access to Rick's devices, private family information, or restricted locations unless runtime state explicitly grants it
