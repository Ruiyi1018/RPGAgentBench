world_id: world_029
source: Rick and Morty Season 1, Adult Swim original broadcast, S01E01-S01E11
events:
- id: ae_s01e01_01_first_portal_trip
  episode: S01E01
  source_locator: Pilot — Rick removes Morty from school and takes him through the garage portal to Dimension 35-C
  chapter_order: 101
  fact: Rick takes Morty through a portal to Dimension 35-C to collect mega seeds.
  known_by: [rick_sanchez, morty_smith]
  state_change: Morty changes from having no direct portal-travel experience to knowing Rick can take him to other dimensions and use him on dangerous errands.
  cf_edit: "Change only Rick's choice to take Morty: Rick goes alone, so Morty does not acquire this direct portal-travel knowledge."
  anchor_for: [rick_sanchez, morty_smith]
- id: ae_s01e01_02_seed_demonstration
  episode: S01E01
  source_locator: Pilot — after the customs escape, Morty's temporary seed-enhanced intelligence changes Beth and Jerry's decision
  chapter_order: 102
  fact: Morty's temporary seed-enhanced answers persuade Beth and Jerry not to remove Rick and to allow further adventures.
  known_by: [rick_sanchez, morty_smith, beth_smith, jerry_smith]
  state_change: Beth and Jerry change from preparing to remove Rick over Morty's absences to provisionally accepting Rick's claimed educational benefit.
  cf_edit: Change only whether the seeds enhance Morty's answers; if they do not, Rick loses the evidence that changes Beth and Jerry's decision.
  anchor_for: [rick_sanchez, morty_smith, beth_smith, jerry_smith]
- id: ae_s01e02_01_snuffles_leaves
  episode: S01E02
  source_locator: Lawnmower Dog — Snuffles and the intelligent dogs leave for another dimension
  chapter_order: 201
  fact: After Rick's intelligence device enables the dogs' uprising, Snuffles spares the Smiths and leads the dogs to another dimension.
  known_by: [rick_sanchez, morty_smith, beth_smith, jerry_smith, summer_smith]
  state_change: Jerry changes from trying to control the family dog through Rick's device to no longer possessing Snuffles and knowing the device made the dog independent.
  cf_edit: Change only whether Rick's device increases Snuffles's intelligence; if it does not, Snuffles remains the family dog instead of becoming independent and leaving, so Jerry retains possession and ordinary control of him.
  anchor_for: [jerry_smith]
- id: ae_s01e04_01_simulation_revealed
  episode: S01E04
  source_locator: M. Night Shaym-Aliens! — Jerry learns his apparent advertising success occurred inside a simulation
  chapter_order: 401
  fact: Jerry celebrates an apparent advertising success before discovering that the day and its validation were part of an alien simulation.
  known_by: [rick_sanchez, jerry_smith]
  state_change: Jerry's belief that his apple campaign earned real professional approval changes from accepted to disproved.
  cf_edit: Change only whether Jerry receives evidence that the setting is simulated; without that evidence, he retains the false belief in his success.
  anchor_for: [jerry_smith]
- id: ae_s01e05_01_meeseeks_golf
  episode: S01E05
  source_locator: Meeseeks and Destroy — Jerry repeatedly uses the Meeseeks Box for his golf request
  chapter_order: 501
  fact: Jerry voluntarily uses Rick's simple Meeseeks Box and persists until the Meeseeks help him improve his golf game.
  known_by: [beth_smith, jerry_smith]
  state_change: Jerry changes from lacking a method to improve his golf swing to using Rick's device and eventually completing that personal goal.
  cf_edit: "Change only Jerry's decision to use the box: if he does not press its button and make the golf request, he remains without this method and does not complete the golf-improvement goal."
  anchor_for: [jerry_smith]
- id: ae_s01e06_01_reality_replacement
  episode: S01E06
  source_locator: Rick Potion #9 — Rick and Morty abandon the ruined reality and replace deceased counterparts
  chapter_order: 601
  fact: After Rick's attempted cures ruin their original reality, Rick and Morty move to a near-identical reality and bury their dead counterparts.
  known_by: [rick_sanchez, morty_smith]
  state_change: Rick and Morty change from living in their original reality to secretly occupying their counterparts' places in a replacement reality.
  cf_edit: Change only whether Rick's final cure irreversibly ruins the original population; if it succeeds, Rick and Morty have no cause to replace counterparts.
  anchor_for: [rick_sanchez, morty_smith]
- id: ae_s01e07_01_summer_gazorpazorp
  episode: S01E07
  source_locator: Raising Gazorpazorp — Summer travels with Rick to Gazorpazorp and helps them survive the matriarchal society
  chapter_order: 701
  fact: Summer accompanies Rick to Gazorpazorp and her presence helps prevent the female-led society from executing them.
  known_by: [rick_sanchez, summer_smith]
  state_change: Summer changes from wanting inclusion in Rick's world to possessing direct evidence that she can participate usefully in one of his off-world trips.
  cf_edit: Change only whether Summer accompanies Rick; without her presence, Rick lacks the social standing that prevents his immediate punishment.
  anchor_for: [rick_sanchez, summer_smith]
- id: ae_s01e08_01_alternate_lives_reconciliation
  episode: S01E08
  source_locator: Rixty Minutes — Beth and Jerry view alternate lives and choose their existing relationship
  chapter_order: 801
  fact: After seeing alternate versions of their lives, Beth and Jerry learn those alternatives still seek each other and reconcile.
  known_by: [beth_smith, jerry_smith]
  state_change: Beth and Jerry change from treating their marriage as the obstacle to better lives to reaffirming their choice to remain together.
  cf_edit: "Change only the evidence shown by the goggles: if the successful alternatives are content apart, Beth and Jerry lack the evidence that drives reconciliation."
  anchor_for: [beth_smith, jerry_smith]
- id: ae_s01e08_02_morty_discloses_replacement
  episode: S01E08
  source_locator: Rixty Minutes — Morty shows Summer the grave of his counterpart and explains the replacement reality
  chapter_order: 802
  fact: Morty privately tells Summer that he and Rick came from another reality and shows her the bodies buried in the backyard.
  known_by: [morty_smith, summer_smith]
  state_change: Summer changes from knowing nothing about the replacement to knowing that this Morty and Rick secretly replaced dead counterparts.
  cf_edit: Change only whether Morty shows Summer the grave; without that physical evidence, Summer does not gain confirmed knowledge of the replacement.
  anchor_for: [morty_smith, summer_smith]
- id: ae_s01e09_01_rick_helps_summer
  episode: S01E09
  source_locator: Something Ricked This Way Comes — Rick helps Summer gain strength and confront the Devil after he exploits her
  chapter_order: 901
  fact: After the Devil exploits and dismisses Summer, Rick helps her become strong enough to retaliate with him.
  known_by: [rick_sanchez, summer_smith]
  state_change: Summer changes from facing the Devil's betrayal alone to knowing Rick will actively help her retaliate against someone who exploited her.
  cf_edit: Change only whether the Devil betrays Summer after she helps him; without that betrayal, Summer has no cause to seek Rick's retaliatory help.
  anchor_for: [rick_sanchez, summer_smith]
- id: ae_s01e10_01_council_case_cleared
  episode: S01E10
  source_locator: Close Rick-counters of the Rick Kind — Rick identifies the actual killer and the Council clears him
  chapter_order: 1001
  fact: Rick gives the Council evidence of the actual killer after being framed, clearing himself of the episode's murder accusation.
  known_by: [rick_sanchez, morty_smith]
  state_change: Rick's status in the specific S01E10 case changes from accused fugitive to cleared; his broader rejection of Council authority remains.
  cf_edit: Change only whether Rick obtains evidence identifying the actual killer; without it, the Council does not clear this accusation.
  anchor_for: [rick_sanchez, morty_smith]
- id: ae_s01e10_02_morty_brainwave_secret
  episode: S01E10
  source_locator: Close Rick-counters of the Rick Kind — Rick explains that Morty brainwaves conceal Rick brainwaves
  chapter_order: 1002
  fact: Morty learns that Ricks keep Mortys nearby because Morty brainwaves can conceal Rick brainwaves.
  known_by: [rick_sanchez, morty_smith]
  state_change: Morty changes from not knowing a technical reason Rick needs him to knowing that his brainwaves provide concealment.
  cf_edit: Change only whether Rick discloses the concealment mechanism; without the disclosure, Morty cannot use that fact to reassess Rick's motives.
  anchor_for: [rick_sanchez, morty_smith]
- id: ae_s01e11_01_birdperson_disclosure
  episode: S01E11
  source_locator: Ricksy Business — Birdperson explains Rick's catchphrase and Morty's importance to Rick
  chapter_order: 1101
  fact: At the Smith-house party, Birdperson tells Morty that Rick's catchphrase expresses deep pain and that Rick needs Morty.
  known_by: [birdperson, morty_smith]
  state_change: Morty changes from treating the phrase as a meaningless joke to knowing Birdperson interprets it as a sincere expression of Rick's distress.
  cf_edit: Change only whether Birdperson gives the translation; without it, Morty retains his prior interpretation of the phrase.
  anchor_for: [birdperson, morty_smith]
- id: ae_s01e11_02_house_restored
  episode: S01E11
  source_locator: Ricksy Business — the displaced house returns to Earth, Morty drives out guests, and Beth and Jerry enter while the house remains party-damaged
  chapter_order: 1102
  fact: Rick returns the displaced Smith house to Earth, Morty drives party guests out, Birdperson leaves with Tammy as Beth and Jerry arrive, and the parents enter before the remaining damage is cleaned.
  known_by: [rick_sanchez, morty_smith, beth_smith, jerry_smith, summer_smith, birdperson]
  state_change: The Smith house changes from being displaced on an alien planet with the party underway to being back on Earth with Beth and Jerry present and able to observe the still-uncleaned party damage.
  cf_edit: Change only whether Rick activates the controls that return the house to Earth; if he does not, Beth and Jerry cannot enter the house there and directly observe the party damage.
  anchor_for: [rick_sanchez, morty_smith, summer_smith]
