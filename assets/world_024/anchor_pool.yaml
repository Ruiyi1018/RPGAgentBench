world_id: world_024
source: Twilight novel by Stephenie Meyer
events:
- id: ae_001
  chapter_order: "001"
  fact: Bella Swan moves from Phoenix to Forks to live with her father Charlie.
  known_by:
  - bella_swan
  - edward_cullen
  state_change: Bella lives at the Swan house, possesses her red truck, and is enrolled
    at Forks High School; she can use the house, truck, and school as current resources.
  cf_edit: Bella visits Forks briefly but remains resident and enrolled in Phoenix.
  anchor_for:
  - bella_swan
- id: ae_002
  chapter_order: "002"
  fact: Edward Cullen initially reacts to Bella with visible tension and avoids her
    in biology class.
  known_by:
  - bella_swan
  - edward_cullen
  state_change: Bella becomes confused and curious about Edward's hostile behavior.
  cf_edit: Edward greets Bella warmly from the first day and sits beside her without
    hesitation.
  anchor_for:
  - edward_cullen
  - bella_swan
- id: ae_003
  chapter_order: "003"
  fact: Edward stops an out-of-control van from crushing Bella in the school parking
    lot by putting himself between her and the vehicle.
  known_by:
  - bella_swan
  - edward_cullen
  state_change: Bella realizes Edward possesses impossible speed and strength, deepening
    the mystery around him.
  cf_edit: The van hits Bella and she is hospitalized, with no one intervening.
  anchor_for:
  - edward_cullen
  - bella_swan
- id: ae_011
  chapter_order: "004"
  fact: At Forks Hospital after the van accident, Carlisle examines Bella in his role
    as a physician and finds no serious injury.
  known_by:
  - bella_swan
  - edward_cullen
  - carlisle_cullen
  state_change: Bella directly knows Carlisle is a Forks Hospital physician with
    authority to examine and discharge patients; Carlisle has exercised that workplace
    permission in Bella's care.
  cf_edit: A different hospital physician examines Bella, and Carlisle does not participate
    in her care.
  anchor_for:
  - bella_swan
  - carlisle_cullen
- id: ae_004
  chapter_order: "005"
  fact: Jacob Black, a family friend from La Push, tells Bella that the Cullens are
    named in an old Quileute story and are said to stay away from the reservation
    under an old agreement; Jacob says he does not personally believe the story.
  known_by:
  - bella_swan
  - jacob_black
  state_change: Bella knows the traditional claim and its reservation boundary, while
    Jacob's own belief remains that it is only a story.
  cf_edit: Jacob declines to tell Bella any Quileute story about the Cullens.
  anchor_for:
  - jacob_black
- id: ae_006
  chapter_order: "006"
  fact: Bella researches Quileute legends and vampire accounts and forms the hypothesis
    that Edward is a vampire.
  known_by:
  - bella_swan
  state_change: Bella privately adopts the vampire explanation for Edward's abilities,
    but has not yet received his confirmation.
  cf_edit: Bella's research leads her to reject a supernatural explanation for Edward.
  anchor_for:
  - bella_swan
- id: ae_024
  chapter_order: "007"
  fact: Edward rescues Bella from men threatening her in Port Angeles, removes her
    from the immediate danger, and takes her to a restaurant before the return trip.
  known_by:
  - bella_swan
  - edward_cullen
  state_change: Bella changes from curiosity mixed with suspicion to relying on Edward
    for immediate protection, and Edward takes responsibility for getting her safely
    away from the threat.
  cf_edit: Edward is not present, and Bella receives help from local police instead.
  anchor_for:
  - bella_swan
  - edward_cullen
- id: ae_005
  chapter_order: "008"
  fact: Edward reveals to Bella that he can read minds, but hers is the only mind
    he cannot hear.
  known_by:
  - bella_swan
  - edward_cullen
  state_change: Bella learns about Edward's telepathic ability and her unique mental
    shield.
  cf_edit: Edward tells Bella he can hear her thoughts clearly like everyone else's.
  anchor_for:
  - edward_cullen
  - bella_swan
- id: ae_007
  chapter_order: "009"
  fact: During the drive home from Port Angeles, Bella tells Edward she has concluded
    that he is a vampire; Edward confirms her conclusion and explains that his family
    hunts animals rather than humans.
  known_by:
  - bella_swan
  - edward_cullen
  state_change: Bella's private vampire hypothesis becomes confirmed knowledge, and
    she learns that Edward's family follows an animal-blood diet.
  cf_edit: Edward denies being a vampire and claims his abilities come from a medical
    condition.
  anchor_for:
  - edward_cullen
  - bella_swan
- id: ae_008
  chapter_order: "010"
  fact: Edward shows Bella how his skin sparkles in direct sunlight in the meadow.
  known_by:
  - bella_swan
  - edward_cullen
  state_change: Bella witnesses the physical proof of Edward's vampire nature.
  cf_edit: Edward's skin remains unchanged in direct sunlight.
  anchor_for:
  - edward_cullen
  - bella_swan
- id: ae_009
  chapter_order: "011"
  fact: Edward takes Bella to the Cullen house, where she meets Carlisle and Alice
    along with Esme and Jasper; Rosalie and Emmett are absent.
  known_by:
  - bella_swan
  - edward_cullen
  - alice_cullen
  - carlisle_cullen
  state_change: Bella formally meets Alice and Carlisle as a human guest already
    informed of the family secret; Carlisle and Alice know Edward has brought her
    into that confidence, while no Bella-Rosalie relationship state is created at
    this visit.
  cf_edit: Edward refuses to introduce Bella to his family and keeps their home secret.
  anchor_for:
  - alice_cullen
  - carlisle_cullen
- id: ae_010
  chapter_order: "012"
  fact: At the Cullen house, Alice welcomes Bella and Edward identifies Alice's ability
    to see possible future outcomes shaped by decisions.
  known_by:
  - bella_swan
  - edward_cullen
  - alice_cullen
  state_change: Bella knows Alice has decision-sensitive precognition and accepts
    Alice's offered friendship.
  cf_edit: Edward still discloses Alice's decision-sensitive precognition, but Alice
    remains socially distant instead of welcoming Bella, so no offered friendship
    is established.
  anchor_for:
  - alice_cullen
- id: ae_013
  chapter_order: "013"
  fact: During the Cullen-house visit, Edward tells Bella Carlisle's history and explains
    that Carlisle established the family's refusal to drink human blood.
  known_by:
  - bella_swan
  - edward_cullen
  state_change: Bella knows from Edward that Carlisle founded and maintains the family's
    animal-blood rule; she can use that rule when deciding whether to trust Carlisle.
  cf_edit: Edward withholds Carlisle's history and gives Bella no account of the family's
    abstention rule.
  anchor_for:
  - bella_swan
  - edward_cullen
- id: ae_012
  chapter_order: "014"
  fact: At the baseball field before the family game, Bella meets Rosalie in the
    outing that Rosalie and Emmett have joined; Rosalie directs a hostile glare at
    Bella and does not welcome her.
  known_by:
  - bella_swan
  - edward_cullen
  - rosalie_hale
  state_change: Bella gains direct evidence of Rosalie's hostility and becomes guarded
    toward her; by seeing Bella included in the supernatural family activity, Rosalie
    knows Bella has been admitted to the Cullen secret, and her opposition is directly
    observable.
  cf_edit: Rosalie greets Bella warmly and embraces her as part of the family.
  anchor_for:
  - rosalie_hale
- id: ae_015
  chapter_order: "015"
  fact: While the Cullens are playing baseball during a thunderstorm, Alice notices
    that other vampires heard the game, changed direction, and will reach the field
    within minutes; Carlisle has the family continue playing to avoid provoking suspicion,
    while Edward leaves the game to guard Bella.
  known_by:
  - bella_swan
  - edward_cullen
  - alice_cullen
  - carlisle_cullen
  - rosalie_hale
  state_change: Alice's warning gives the family advance knowledge of imminent visitors;
    Edward changes from player to Bella's guard, and Carlisle chooses a non-hostile
    reception posture.
  cf_edit: Alice sees the other vampires continuing away from the field, so Edward
    remains in the game and no reception posture is needed.
  anchor_for:
  - alice_cullen
  - carlisle_cullen
- id: ae_017
  chapter_order: "016"
  fact: Laurent, Victoria, and James unexpectedly reach the baseball field while the
    Cullens are playing; Carlisle receives them civilly before they notice Bella is
    human.
  known_by:
  - bella_swan
  - edward_cullen
  - alice_cullen
  - carlisle_cullen
  - rosalie_hale
  state_change: The family and Bella now know the identities and presence of the three
    nomadic vampires, while Carlisle's permission for a friendly visit is immediately
    constrained by Bella's exposure.
  cf_edit: The Cullens play baseball without encountering any other vampires.
  anchor_for:
  - edward_cullen
  - alice_cullen
  - carlisle_cullen
  - rosalie_hale
- id: ae_018
  chapter_order: "017"
  fact: The tracker vampire James fixes his attention on Bella, recognizing her human
    scent after a gust exposes it; Edward reacts defensively and James accepts the
    resulting contest.
  known_by:
  - bella_swan
  - edward_cullen
  - alice_cullen
  - carlisle_cullen
  - rosalie_hale
  state_change: James begins hunting Bella specifically; every listed witness knows
    she is the target, and the Cullens' goal changes from concealment to active protection.
  cf_edit: James ignores Bella completely during the encounter.
  anchor_for:
  - edward_cullen
- id: ae_019
  chapter_order: "018"
  fact: In the Jeep after leaving the baseball field, Bella, Edward, and Alice agree
    on a provisional escape plan in which Alice and Jasper will escort Bella toward
    Phoenix while Edward stays visible in Forks long enough to misdirect James.
  known_by:
  - bella_swan
  - edward_cullen
  - alice_cullen
  state_change: Bella accepts temporary separation from Edward because Alice and
    Jasper will escort her, while Edward accepts the provisional decoy role in Forks.
  cf_edit: Alice declines to escort Bella, so Edward does not accept temporary separation
    under this provisional plan.
  anchor_for:
  - alice_cullen
- id: ae_020
  chapter_order: "019"
  fact: In the Jeep after the baseball-field encounter, Bella decides she must return
    home briefly and use a believable breakup-and-Phoenix story so Charlie will not
    follow her into danger.
  known_by:
  - bella_swan
  - edward_cullen
  - alice_cullen
  state_change: Bella takes an active commitment to mislead Charlie without revealing
    vampires, then leave Forks under Cullen escort; the plan cannot proceed until
    that household step is complete.
  cf_edit: Bella agrees to leave immediately without returning to Charlie or providing
    any explanation.
  anchor_for:
  - bella_swan
- id: ae_025
  chapter_order: "020"
  fact: >-
    Bella carries out the planned Swan-house diversion: she tells Charlie she has
    broken with Edward and is leaving for Phoenix, packs, and drives her truck away;
    Edward, who waited outside and heard the exchange, then moves Bella to the passenger
    seat, drives the truck, and returns with her to the Cullen house.
  known_by:
  - bella_swan
  - edward_cullen
  state_change: Bella fulfills the Charlie-diversion commitment without disclosing
    vampires; she and her truck are now at the Cullen house, and Charlie believes
    she is leaving because of the claimed breakup.
  cf_edit: Bella tells Charlie the vampire threat is the reason for leaving, exposing
    the Cullen secret instead of using the breakup story.
  anchor_for:
  - bella_swan
- id: ae_023
  chapter_order: "021"
  fact: When Edward asks Rosalie to wear Bella's clothes as part of a scent diversion,
    Rosalie explicitly objects to risking the family for Bella; Esme takes Bella's
    clothes instead.
  known_by:
  - rosalie_hale
  - edward_cullen
  - bella_swan
  - alice_cullen
  - carlisle_cullen
  state_change: Rosalie refuses the clothes-exchange request, and Esme takes Bella's
    clothes in her place; Bella knows only the objection Rosalie stated, not any unspoken
    motive or later-life history. No scent-decoy travel assignment is established
    by this event.
  cf_edit: Rosalie accepts Bella's clothes immediately, so Esme does not perform the
    scent exchange.
  anchor_for:
  - rosalie_hale
- id: ae_021
  chapter_order: "022"
  fact: >-
    At the Cullen house, the family fixes the final division of labor before departure:
    Alice and Jasper will escort Bella; Edward, Carlisle, and Emmett will track James;
    and Esme and Rosalie will carry Bella's scent in her truck to divert Victoria.
  known_by:
  - bella_swan
  - edward_cullen
  - alice_cullen
  - carlisle_cullen
  - rosalie_hale
  state_change: Alice holds the active escort commitment, Edward and Carlisle hold
    active tracker commitments, Rosalie holds a scent-decoy task, and Bella's truck
    is allocated to Esme and Rosalie for that task.
  cf_edit: Alice reports she cannot safely escort Bella, so the family does not assign
    Bella to Alice and Jasper.
  anchor_for:
  - edward_cullen
