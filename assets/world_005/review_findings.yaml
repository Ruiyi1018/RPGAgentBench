  evidence: 多个候选state_change只描述情绪、人物揭示或叙事意义，例如“确立特殊的情感起点”“显露不拘主仆的分寸”“增加交往密度”“自怜情绪”“阴狠一面直接展示”“暂时突破礼法边界”，没有唯一可查询的新知识、关系等级、目标/承诺、权限或资源状态，也没有可观察决定。
  required_change: 逐项把候选后果改写为可追踪且唯一可判定的状态更新及后续决定；无法形成客观状态变化的事件应退出候选池。
  resolution: 已逐项重写22个候选的state_change，落到可查询的知识、位置、身份、权限、健康、物品状态、目标或明确决定；生日夜宴等无持续变化者明确限定为参加事实，不再用情绪或叙事意义充当状态。
  status: fixed

- item_id: anchor_pool.events.cf_edit
  severity: major
  rule_id: counterfactual_minimal
  evidence: 多个cf_edit直接写成大跨度替代历史或泛化叙事结论，例如“后续宝黛感情难以为续”“她后来在荣国府的大权缺少关键展示机会”“相关器物与人物关系难有交汇机会”，未限定一个可控证据变量，也未给出两分支应产生的不同可执行状态或决定。
  required_change: 为拟用于Stage 2的候选明确单一可编辑原因或证据、两侧状态差异和依赖该差异的可观察决定；其余候选应明确不承担敏感性测试用途。
  resolution: 已为7个拟作敏感性材料的候选标记stage2_use:sensitivity，并逐项写明单一变量、两分支状态及不同决定；其余15个标记stage2_use:not_selected，明确不承担Stage 2敏感性测试且只保留可查询后果。
  status: fixed

