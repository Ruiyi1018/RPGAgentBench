  state_change: 贾宝玉与林黛玉各自新增“对方似曾相识”的私有知识，并开始将对方视为需进一步亲近的对象。
  cf_edit: 单一变量为初见时是否产生似曾相识感；有此感受时二人选择继续亲近，无此感受时仅按普通亲眷相待。
