data_constraints:
- 所有角色、地点、物品只能取自前八十回且不晚于抄检大观园前的情节
- 不引用回目号，除非人工锁定具体回目后补充
- 不用八十回后续书情节作为正典事实
- 不用脂批或其他版本异文作正典事实
- 不复制原作原文、诗词、对话
- 不自行发明不存在的地名与物件
- 不得为角色生成超出现有来源范围的行为事实
- 不得使用抄检大观园之后才公开的信息
- 初始上下文中的Player统一视为无预设亲缘、职务或特殊权限，但了解荣国府内广为人知背景的普通对话来客
- knowledge.visibility表示当前轨迹开局实际知情主体；[npc]仅NPC知情，[npc, player]为NPC与默认Player均知情
- 具体scenario若改变Player身份或信息来源，必须显式覆盖可见性，不得沿用与该scenario冲突的默认值
- initial_context的knowledge.source_event使用候选事件ID追溯事件事实；Profile派生状态使用profile:<character_id>.<field_path>，不再使用initial_state占位
