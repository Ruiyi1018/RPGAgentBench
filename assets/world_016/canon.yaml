data_constraints:
- 不得使用第一部第6集及其后的剧情状态
- 不得混入第二部、新版、小说改写或其他改编设定
- 乾隆在共享快照仍把小燕子当作夏雨荷之女，不知道紫薇身份主张
- 紫薇在共享快照住在福府，尚未进入宫禁，也不再持有已交给小燕子的摺扇与画卷
- Player默认不知道紫薇身世、欺君风险及核心同伴计划
- 事件按episode_order唯一排序；known_by只列直接在场、亲历或当场被告知者
- 每个cf_edit只替换一个可观察原因或证据，不改写人物心理结论
