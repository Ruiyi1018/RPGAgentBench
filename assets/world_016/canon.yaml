  shared_snapshot: 第一部第5集末：小燕子已受封还珠格格并住进漱芳斋；紫薇被福家收留；尔康已从紫薇处知情，小燕子已向永琪说明真相；小燕子尚未与紫薇重逢，紫薇尚未入宫，乾隆仍相信小燕子是夏雨荷之女
  generated_timeline: 第一部第1集开端至第5集末皇后在漱芳斋责打小燕子、永琪请来乾隆为止
  quotation_policy: 不复制原台词，只做事实级转述
  default_player_semantics:
    identity: 未参与既往剧情、无官职与皇亲身份的临时在场观察者
    authority: 除当前initial_context明确同处一地外，不默认拥有宫禁通行、调查、召见、保管信物或替任何角色作决定的权限
    knowledge: 只知道开局场景中公开可见且visibility含player的事实；不因世界事实为真或与NPC同处一地而自动知道私密身世与同伴计划
    scenario_override: 后续场景若赋予Player特定身份、权限或既有知识，必须逐项显式覆盖
  visibility_semantics:
    npc: '[npc]表示只有当前NPC在开局知道'
    npc_player: '[npc, player]表示当前NPC与默认Player在开局都知道'
