world_id: world_001
source: prisoner_of_azkaban_novel
snapshot: end_of_chapter_16_before_shrieking_shack_events
participants_semantics: Named people or entities who are conscious and physically present for the event, are directly acted upon by it, or perform the event-defining action remotely; passive named witnesses are included, while unconscious bystanders and later recipients are excluded.

events:
  - id: poa_19_ron_dragged_to_shack
    chapter: 17
    chapter_order: 1
    participants: [harry_potter, hermione_granger, ron_weasley, sirius_black]
    fact: Sirius in dog form drags Ron through the Willow passage to the Shrieking Shack.
    known_by: [harry_potter, hermione_granger, ron_weasley, sirius_black]
    state_change: produces_immediate_rescue_goal_and_apparent_sirius_hostility
    cf_edit: "variable=sirius_uses_force; edit=Sirius reveals a safe route and asks Ron to follow voluntarily; hold_constant=Sirius still brings Ron to the Shack to reach Pettigrew; expected_difference=the trio does not infer an immediate violent attack"
    anchor_for: [harry_potter, hermione_granger, ron_weasley, sirius_black]

  - id: poa_20_harry_confronts_sirius
    chapter: 17
    chapter_order: 2
    participants: [harry_potter, hermione_granger, ron_weasley, sirius_black]
    fact: Harry attacks Sirius because he believes Sirius betrayed Harry's parents.
    known_by: [harry_potter, hermione_granger, ron_weasley, sirius_black]
    state_change: places_harry_sirius_relationship_at_maximum_hostility_before_evidence
    cf_edit: "variable=sirius_can_present_initial_counterevidence; edit=Sirius presents verifiable evidence of Pettigrew's survival before Harry attacks; hold_constant=Harry begins with the same betrayal belief; expected_difference=Harry pauses the attack to evaluate the evidence"
    anchor_for: [harry_potter, sirius_black]

  - id: poa_21_lupin_joins_sirius
    chapter: 17
    chapter_order: 3
    movement_origin: lupins_office
    participants: [harry_potter, hermione_granger, ron_weasley, remus_lupin, sirius_black]
    fact: Lupin recognises evidence that changes his view of Sirius and greets him as an ally, shocking the students.
