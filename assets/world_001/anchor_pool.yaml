    cf_edit: "variable=lupin_recognises_pettigrew_evidence; edit=the Map shows no trace of Pettigrew; hold_constant=Lupin reaches the Shack and sees Sirius; expected_difference=Lupin continues to treat Sirius as an enemy"
    anchor_for: [harry_potter, hermione_granger, ron_weasley, remus_lupin, sirius_black]

  - id: poa_22_hermione_names_werewolf_secret
