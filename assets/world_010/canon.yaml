  authority: primary
data_constraints:
- 所有当前状态限定在latest_included_event之后、first_excluded_event之前
- 不得使用秀芹被捕、平安县城战斗及其后剧情
- 不得伪造URL、章节号或集数
- 不得引用原著小说或其他改编版本的内容
- 无法可靠确认的细节宁可省略
- 世界事实不等于NPC已知事实；NPC知情必须来自在场、明确转告或可获得证据
- 默认Player只知道player_semantics.initial_knowledge，其他知识必须由visibility或场景覆盖显式给出
