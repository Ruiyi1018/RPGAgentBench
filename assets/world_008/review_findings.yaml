  rule_id: source_version_scope
  evidence: canon仅写“鹿鼎记/原作小说正典文本”，同时把“修订版”列入excluded_versions，但未说明采用连载版、旧版、修订版或新修版中的哪一版；“修订版”本身也不是可唯一识别的版本名称。
  required_change: 明确唯一采用的小说版本/版次，并逐项明确排除的其他小说版本与改编范围，使Profile、候选事件和快照可按同一文本核验。
  resolution: 已将primary_source锁定为金庸《鹿鼎记》三联书店1994年修订版，并逐项排除明报连载版、2006年新修版、改编、续作与同人；sources.scope同步限定版次和快照上界。
  status: fixed

