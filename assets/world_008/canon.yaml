data_constraints:
- 只使用鹿鼎记原作小说正典文本范围内的信息
- 不得使用共享快照之后发生的情节
- 不得混入影视改编、漫画改编或其他版本内容
- 无法可靠确认的细节一律省略
- 不得伪造URL、章节号或集数
- 所有锚点事件必须按可推断时间顺序排列
- 地点和物品只能来自当前来源范围及共享快照
- 每个cf_edit必须给出只改变关键原因的真实替代情形
- known_by和anchor_for只能使用roster中的角色ID
- 所有connections必须引用已列出的地点ID
