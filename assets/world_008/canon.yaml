data_constraints:
- 只使用金庸《鹿鼎记》三联书店1994年修订版范围内的信息
- 不得使用共享快照之后发生的情节
- 不得混入明报连载版、2006年新修版、影视、漫画、游戏或续作内容
- 无法可靠确认的细节一律省略
- 不得伪造URL、章节号或集数
- 所有锚点事件必须按可推断时间顺序排列
- 地点和物品只能来自当前来源范围及共享快照
- 每个cf_edit必须给出只改变关键原因的真实替代情形
- known_by和anchor_for只能使用roster中的角色ID
- 所有connections必须引用已列出的地点ID
- shared_snapshot表示统一时间边界，不表示六名角色同处一室或彼此全知
