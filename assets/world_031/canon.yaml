data_constraints:
- Every anchor event fact must be supported by Season 1 episode content only.
- No episode numbers may be referenced in any field.
- No later season plot knowledge may be used.
- Quotations must be paraphrased, never copied verbatim.
- Anchor events must be sorted chronologically.
- Connected locations must reference existing location IDs only.
- All known_by and anchor_for entries must use roster IDs only.
- No invented URLs, chapter numbers, or external references.
- Every cf_edit must alter one causal antecedent and imply a different observable state or decision, never merely paraphrase the fact.
- Events must not include invented character reactions beyond the source.
- The default Player is an ordinary hospital visitor with no employment, kinship, clinical authority, chart access, or private relationship knowledge.
- "knowledge.visibility is the actual audience at trajectory start: [npc] is NPC-only and [npc, player] is known to both that NPC and the default Player."
- A scenario that gives the Player a different identity, evidence, or temporary authorization must explicitly override the default Player visibility and access.
