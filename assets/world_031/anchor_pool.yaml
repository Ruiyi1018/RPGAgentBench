world_id: world_031
source: Grey's Anatomy Season 1 episode transcripts
events:
- id: ae01
  chapter_order: '001'
  fact: Meredith, Cristina, George, and Izzie report to Seattle Grace as new surgical interns.
  known_by: [meredith_grey, cristina_yang, george_omalley, izzie_stevens, miranda_bailey]
  state_change: The four interns enter Bailey's supervised intern cohort.
  cf_edit: If these four interns had instead been enrolled in a different resident's cohort, with their intern roles unchanged, Bailey would have no supervisory authority over their current hospital work.
  anchor_for: [meredith_grey, cristina_yang, george_omalley, izzie_stevens, miranda_bailey]
- id: ae02
  chapter_order: '002'
  fact: Bailey introduces herself to the new interns and states the rules governing their first shift.
  known_by: [meredith_grey, cristina_yang, george_omalley, izzie_stevens, miranda_bailey]
  state_change: The interns learn that Bailey directly assigns and supervises their clinical work.
  cf_edit: If another resident had been assigned the cohort, Bailey would not control their shift assignments.
  anchor_for: [miranda_bailey, george_omalley]
- id: ae04
  chapter_order: '003'
  fact: Bailey issues the interns hospital pagers and instructs them to answer every page at a run.
  known_by: [meredith_grey, cristina_yang, george_omalley, izzie_stevens, miranda_bailey]
  state_change: Each intern gains a pager as an executable work resource and a duty to answer its calls.
  cf_edit: If Bailey had given the same instructions but not issued the pagers, the interns would lack the devices needed to receive pager-directed calls.
  anchor_for: [meredith_grey, cristina_yang, george_omalley, izzie_stevens]
- id: ae03
  chapter_order: '004'
  fact: Meredith and Derek recognize each other at the hospital and discover that he is an attending while she is an intern.
  known_by: [meredith_grey, derek_shepherd]
  state_change: Their prior personal encounter acquires a workplace hierarchy and a need for professional caution.
  cf_edit: If their prior encounter were unchanged but Derek held no role at Seattle Grace, it would not create an attending-intern workplace conflict there.
  anchor_for: [meredith_grey, derek_shepherd]
- id: ae06
  chapter_order: '005'
  fact: George tears the cecum during his first appendectomy and Burke takes over the procedure.
  known_by: [george_omalley, miranda_bailey, meredith_grey, cristina_yang, izzie_stevens]
  state_change: George and the observing interns gain evidence that he is not ready to lead a procedure without close supervision.
  cf_edit: If George had completed the appendectomy safely without Burke taking over, that operation would provide evidence of competence rather than failure.
  anchor_for: [george_omalley, miranda_bailey]
- id: ae05
  chapter_order: '006'
  fact: Meredith and Cristina jointly investigate Katie Bryce's seizures; Meredith identifies and presents the decisive aneurysm clue, and Derek selects Meredith to scrub in.
  known_by: [meredith_grey, derek_shepherd, cristina_yang]
  state_change: Meredith gains the supervised surgical opportunity under Derek's stated rule because she is the intern who presents the decisive diagnosis.
  cf_edit: Holding the jointly developed diagnosis and Derek's selection rule fixed, if Cristina rather than Meredith had first presented the decisive clue, Cristina would have received the supervised surgical opportunity instead of Meredith.
  anchor_for: [meredith_grey, derek_shepherd, cristina_yang]
- id: ae07
  chapter_order: '007'
  fact: George and Izzie move into Meredith's house with Meredith's agreement.
  known_by: [meredith_grey, george_omalley, izzie_stevens]
  state_change: George and Izzie become Meredith's housemates and gain ordinary access to the home.
  cf_edit: If Meredith had refused the arrangement, George and Izzie would not be her housemates or have household access.
  anchor_for: [meredith_grey, george_omalley, izzie_stevens]
- id: ae08
  chapter_order: '008'
  fact: Izzie confronts interns who mock her modeling advertisement by showing that the work paid for medical school.
  known_by: [izzie_stevens, george_omalley]
  state_change: George directly learns that Izzie's modeling income financed medical school, while Izzie openly affirms that choice to the witnessing interns.
  cf_edit: If Alex had not displayed and mocked the advertisement, Izzie would not have made that financing disclosure in the locker room then.
  anchor_for: [izzie_stevens]
- id: ae09
  chapter_order: '009'
  fact: When Elizabeth "Liz" Fallon arrests, Cristina continues CPR after a nurse states that Liz has a DNR until Burke physically stops the resuscitation.
  known_by: [cristina_yang]
  state_change: Cristina learns that her attachment to Liz led her to disregard a recorded DNR and that the directive must govern any further response.
  cf_edit: If Cristina had accepted the nurse's DNR notice when it was given, she would have stopped CPR then instead of continuing until Burke intervened.
  anchor_for: [cristina_yang]
- id: ae12
  chapter_order: '010'
  fact: Bailey sees Meredith and Derek together in Derek's car and realizes they are personally involved.
  known_by: [miranda_bailey]
  state_change: Bailey gains direct evidence of the hidden attending-intern relationship.
  cf_edit: If Bailey had not seen them together, she would not have direct evidence of their relationship at the snapshot.
  anchor_for: [miranda_bailey]
- id: ae11
  chapter_order: '011'
  fact: Cristina and Burke begin a private sexual relationship after working together.
  known_by: [cristina_yang]
  state_change: Cristina acquires a private personal involvement that complicates her professional relationship with an attending.
  cf_edit: If Cristina had declined Burke's private advance, their relationship would have remained professional at this point.
  anchor_for: [cristina_yang]
- id: ae13
  chapter_order: '012'
  fact: After Bailey relays the family's refusal, Izzie and Cristina perform an unauthorized autopsy and Bailey catches them.
  known_by: [izzie_stevens, cristina_yang, miranda_bailey]
  state_change: Bailey gains direct evidence that Izzie and Cristina bypassed her instruction, while both interns become accountable for that breach.
  cf_edit: If the family had authorized the autopsy, Bailey would permit the examination and the interns would not acquire an unauthorized-procedure breach.
  anchor_for: [izzie_stevens, cristina_yang, miranda_bailey]
- id: ae10
  chapter_order: '013'
  fact: Meredith privately tells Derek that Ellis Grey has Alzheimer's disease and lives in a nursing home.
  known_by: [meredith_grey, derek_shepherd]
  state_change: Derek gains private knowledge of Ellis's diagnosis directly from Meredith.
  cf_edit: If Meredith had withheld the diagnosis from Derek, he would not know why Ellis is absent from public life at the snapshot.
  anchor_for: [meredith_grey, derek_shepherd]
- id: ae14
  chapter_order: '014'
  fact: Addison arrives at Seattle Grace and introduces herself to Meredith as Derek's wife.
  known_by: [meredith_grey, derek_shepherd]
  state_change: Meredith learns from Addison that Derek is married and that Derek concealed this fact.
  cf_edit: If Addison had not identified herself as Derek's wife, Meredith would still lack confirmation that Derek was married.
  anchor_for: [meredith_grey, derek_shepherd]
