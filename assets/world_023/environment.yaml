transitions:
- id: transition_ship_to_construct
  from: loc_nebuchadnezzar
  to: loc_construct
  mode: jack_in
  required_access: construct_jack
  ordinary_travel: false
  embodiment: The connected human body remains aboard the Nebuchadnezzar; only a training avatar enters the Construct.
- id: transition_ship_to_matrix
  from: loc_nebuchadnezzar
  to: loc_matrix_city
  mode: jack_in
  required_access: matrix_jack
  ordinary_travel: false
  embodiment: The connected human body remains aboard the Nebuchadnezzar; only the residual self-image enters the Matrix.
- id: transition_matrix_to_ship
  from: loc_matrix_city
  to: loc_nebuchadnezzar
  mode: hardline_exit
  required_access: matrix_hardline_exit
  ordinary_travel: false
  embodiment: A hardline exit returns consciousness to the body aboard the Nebuchadnezzar.

presence_rules:
- Human Matrix and Construct locations represent avatars; their real bodies remain at loc_nebuchadnezzar while connected.
- Agent programs have Matrix-layer presence only and can never occupy a reality-layer location.
- Same-layer connected_to edges permit ordinary travel. Cross-layer connected_to entries are reachability indexes required by the runtime map and are usable only through the matching permission-gated transition; they never permit ordinary movement.

