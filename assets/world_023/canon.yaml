data_constraints:
- Facts must derive only from the designated source and shared snapshot.
- No later plot knowledge beyond the shared snapshot may be used.
- All anchor events must be chronological.
- Anchor events must reference listed roster characters only.
- Locations and items must appear in the source before the snapshot.
- Ordinary location travel must remain within one reality layer; cross-layer presence requires an explicit transition and granted access.
- No invented URLs, chapter numbers, or episode numbers.
- Paraphrase facts; do not copy dialogue verbatim.
- cf_edit values must be real minimal alternatives, never none or N/A.
