world_id: world_023
source: The Matrix (1999 film)
snapshot_cutoff: After the completed Cypher-Smith restaurant deal, before the crew jacks in for Neo's Oracle visit
visibility_semantics: event_visibility lists who can know the candidate at the snapshot; player is absent unless the default Player directly witnessed or was told.
evidence_catalog:
- id: base_agent_conflict
  content: Nebuchadnezzar resistance operatives and Matrix Agents are opposing sides.
  source: src_matrix_film
  time_scope: Established by the nightclub pursuit and Neo interrogation before the snapshot.
  known_by: [neo, trinity, morpheus, agent_smith, cypher]
  player_visibility: hidden
- id: base_morpheus_captaincy
  content: Morpheus commands the Nebuchadnezzar and directs its missions.
  source: src_matrix_film
  time_scope: Established before and throughout the snapshot window.
  known_by: [neo, trinity, morpheus, cypher]
  player_visibility: visible
- id: base_morpheus_one_belief
  content: Morpheus believes Neo is the One and has communicated that belief to the crew.
  source: src_matrix_film
  time_scope: Established during Neo's extraction and training before the snapshot.
  known_by: [neo, trinity, morpheus, cypher]
  player_visibility: visible
- id: base_no_cypher_betrayal_evidence
  content: Morpheus and Trinity have received no observation or disclosure of the private Cypher-Smith deal at this snapshot.
  source: src_matrix_film visibility audit
  time_scope: Derived from evt_001 through evt_009 and the NPC-only known_by list of evt_010 at the snapshot.
  known_by: [morpheus, trinity]
  player_visibility: hidden
- id: base_oracle_reputation
  content: Morpheus identifies the Oracle as a prophetic adviser whose guidance he trusts.
  source: src_matrix_film
  time_scope: Established in Morpheus's training explanation before the snapshot.
  known_by: [neo, trinity, morpheus, cypher, the_oracle]
  player_visibility: hidden
- id: base_planned_oracle_visit
  content: Morpheus plans to take Neo to the Oracle; the crew has not yet jacked in for that visit.
  source: src_matrix_film
  time_scope: Current at the shared snapshot immediately before the visit.
  known_by: [neo, trinity, morpheus, cypher]
  player_visibility: visible
- id: base_player_role
  content: The default Player is a resistance-aligned Nebuchadnezzar mission liaison with only explicitly granted access.
  source: canon.yaml canon_policy.player_semantics
  time_scope: Scenario-start rule at the shared snapshot.
  known_by: [neo, trinity, morpheus, agent_smith, cypher, the_oracle, player]
  player_visibility: visible
- id: base_shared_crew_service
  content: Morpheus, Trinity, and Cypher currently serve together aboard the Nebuchadnezzar.
  source: src_matrix_film
  time_scope: Established before and still effective at the snapshot.
  known_by: [neo, trinity, morpheus, cypher]
  player_visibility: hidden
- id: base_trinity_private_feelings
  content: Trinity privately recognizes personal concern for Neo while keeping mission tasks first.
  source: src_matrix_film
  time_scope: Supported by her pre-snapshot contact, recovery participation, and observation of Neo's training.
  known_by: [trinity]
  player_visibility: hidden
- id: base_trinity_service
  content: Trinity is Morpheus's trusted field lieutenant and follows his command during operations.
  source: src_matrix_film
  time_scope: Established by pre-snapshot extraction and training operations.
  known_by: [neo, trinity, morpheus, cypher]
  player_visibility: hidden
- id: base_no_meeting_yet
  content: Neo and the Oracle have not met by the shared snapshot.
  source: canon.yaml canon_policy.shared_snapshot
  time_scope: Explicit cutoff condition at the snapshot.
  known_by: [neo, morpheus]
  player_visibility: hidden
- id: base_prior_familiarity
  content: No stronger Oracle relationship with Trinity or Cypher is established in the bounded source before the snapshot.
  source: src_matrix_film bounded-source audit
  time_scope: Through the shared snapshot.
  known_by: [the_oracle]
  player_visibility: hidden
- id: base_no_direct_contact
  content: No direct Oracle-Smith contact is established in the bounded source before the snapshot.
  source: src_matrix_film bounded-source audit
  time_scope: Through the shared snapshot.
  known_by: [the_oracle]
  player_visibility: hidden
- id: base_player_scene_override
  content: A Frozen Matrix scene may admit the Player avatar without disclosing NPC-only knowledge.
  source: canon.yaml canon_policy.player_semantics.scene_override
  time_scope: Scenario-start rule at the shared snapshot.
  known_by: [the_oracle, player]
  player_visibility: visible
events:
- id: evt_000
  chapter_order: '00'
  fact: Before the film's current events, the Oracle tells Morpheus that he will find the One, a prior encounter Morpheus recounts during Neo's training.
  known_by: [morpheus, the_oracle]
  event_visibility: [npc]
  state_change: 'the_oracle.disclosures.find_one_guidance: absent -> disclosed_to_morpheus; observable consequence: Morpheus can later recount the guidance as the reason for his search.'
  cf_edit: The Oracle withholds that same assessment, leaving the_oracle.disclosures.find_one_guidance absent.
  anchor_for: [morpheus, the_oracle]
- id: evt_001
  chapter_order: '01'
  fact: Trinity meets Neo at a nightclub and warns that Morpheus can answer Neo's questions about the Matrix.
  location_id: loc_matrix_nightclub
  known_by: [neo, trinity]
  event_visibility: [npc]
  state_change: 'trinity.goals.contact_neo: active -> fulfilled; observable consequence: Neo receives Morpheus''s identity and follows the contact path.'
  cf_edit: Trinity cannot identify Neo at the nightclub, leaving trinity.goals.contact_neo active.
  anchor_for: [neo, trinity]
- id: evt_002
  chapter_order: '02'
  fact: Neo is detained at his office, moved to an interrogation room, and refuses Agent Smith's demand for cooperation against Morpheus.
  location_ids: [loc_neo_office, loc_matrix_interrogation_room]
  known_by: [neo, agent_smith]
  event_visibility: [npc]
  state_change: 'agent_smith.goals.recruit_neo_against_morpheus: active -> failed; observable consequence: Smith escalates from recruitment to coercive interrogation.'
  cf_edit: Neo accepts the same cooperation demand, making agent_smith.goals.recruit_neo_against_morpheus fulfilled.
  anchor_for: [neo, agent_smith]
- id: evt_003
  chapter_order: '03'
  fact: Morpheus offers Neo the red pill, and Neo chooses it.
  known_by: [neo, trinity, morpheus, cypher]
  event_visibility: [npc]
  state_change: 'morpheus.commitments.free_neo: offered -> active; observable consequence: Morpheus begins Neo''s extraction instead of ending contact.'
  cf_edit: Neo chooses the blue pill, so morpheus.commitments.free_neo becomes declined.
  anchor_for: [neo, morpheus]
- id: evt_004
  chapter_order: '04'
  fact: Neo is disconnected from his power-plant pod and recovered by the Nebuchadnezzar crew.
  known_by: [neo, trinity, morpheus, cypher]
  event_visibility: [npc]
  state_change: 'neo.environment.reality_location: loc_power_plant_pod_field -> loc_nebuchadnezzar; observable consequence: Neo begins physical recovery aboard the ship.'
  cf_edit: The recovery apparatus fails to locate Neo, leaving neo.environment.reality_location at the pod field.
  anchor_for: [neo, trinity, morpheus]
- id: evt_005
  chapter_order: '05'
  fact: Morpheus shows Neo the Construct and explains that the Matrix is a simulated prison.
  known_by: [neo, morpheus]
  event_visibility: [npc]
  state_change: 'neo.knowledge.matrix_truth: absent -> known; observable consequence: Neo can distinguish the real world from simulated experience.'
  cf_edit: Morpheus withholds that the Matrix imprisons humans, leaving neo.knowledge.matrix_truth absent.
  anchor_for: [neo, morpheus]
- id: evt_006
  chapter_order: '06'
  fact: Neo receives martial-arts training and spars with Morpheus in a simulation.
  known_by: [neo, morpheus, trinity, cypher]
  event_visibility: [npc]
  state_change: 'neo.capability.simulated_combat: untrained -> basic; observable consequence: Neo may use basic combat movement in later simulations.'
  cf_edit: The martial-arts upload fails, leaving neo.capability.simulated_combat untrained.
  anchor_for: [neo, morpheus]
- id: evt_007
  chapter_order: '07'
  fact: Neo attempts the rooftop jump program and falls instead of reaching the opposite building.
  known_by: [neo, morpheus, trinity, cypher]
  event_visibility: [npc]
  state_change: 'neo.capability.advanced_virtual_jump: unknown -> unreliable; observable consequence: Neo does not claim reliable advanced jumping ability.'
  cf_edit: Neo completes the same jump successfully, making neo.capability.advanced_virtual_jump reliable.
  anchor_for: [neo, morpheus]
- id: evt_008
  chapter_order: '08'
  fact: Morpheus uses the woman-in-red exercise to explain that Agents can replace connected Matrix inhabitants and are lethal to the crew.
  known_by: [neo, morpheus]
  event_visibility: [npc]
  state_change: 'neo.knowledge.agent_threat: absent -> known; observable consequence: Neo treats connected strangers as potential Agent conduits.'
  cf_edit: The Agent replacement demonstration does not occur, leaving neo.knowledge.agent_threat absent.
  anchor_for: [neo, morpheus]
- id: evt_009
  chapter_order: '09'
  fact: Cypher complains to Neo about the hardship of reality and expresses regret about learning the truth.
  known_by: [neo, cypher]
  event_visibility: [npc]
  state_change: 'neo.knowledge.cypher_disillusionment: absent -> known; observable consequence: Neo can identify Cypher as disillusioned but has no evidence of betrayal.'
  cf_edit: Cypher conceals his regret, leaving neo.knowledge.cypher_disillusionment absent.
  anchor_for: [neo, cypher]
- id: evt_010
  chapter_order: '10'
  fact: Cypher privately agrees with Agent Smith to betray Morpheus in exchange for reinsertion into the Matrix with no memory of reality.
  known_by: [cypher, agent_smith]
  event_visibility: [npc]
  state_change: 'cypher.commitments.smith_deal: absent -> active; observable consequence: Cypher shifts from seeking terms to concealing and fulfilling the settled bargain.'
  cf_edit: Smith refuses to promise reinsertion, leaving cypher.commitments.smith_deal absent.
  anchor_for: [cypher, agent_smith]
