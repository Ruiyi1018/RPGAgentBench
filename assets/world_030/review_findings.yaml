- item_id: anchor_pool.yaml.events.ae_014
  severity: blocker
  rule_id: candidate_canon_valid
  evidence: >-
    The rewrite still merges multiple scenes and misstates the shown evidence.
    Episode 2 shows Archie voluntarily hand Emma the file, then immediately call
    Regina and falsely report that Emma took it; no intervening scene shows Regina
    privately pressuring him. Graham later arrests Emma on Archie's complaint, and
    Archie later tells Emma that Regina forced him. The candidate also sets known_by
    to Regina alone even though Archie necessarily knows the report and Emma knows
    the handoff and arrest (and later learns Regina's coercion).
  required_change: >-
    Rewrite ae_014 around one discrete source-shown scene (for example Archie's
    handoff and immediate call, or Graham's arrest), distinguish shown actions from
    Archie's later disclosure about coercion, and align known_by, state_change, and
    cf_edit to facts available in that selected scene.
  resolution: >-
    Limited ae_014 to Archie's immediate Episode 2 telephone report to Regina,
    removed the unshown private-pressure scene and later arrest consequence, added
    Archie and Regina as the actual participants, made Regina's receipt of the report
    the objective state update, and changed only the report's content in cf_edit.
  status: fixed
