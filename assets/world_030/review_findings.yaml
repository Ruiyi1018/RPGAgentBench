  status: fixed
- item_id: anchor_pool.yaml.events.state_change_objectivity
  severity: major
  rule_id: stage1_state_uniquely_answerable
  evidence: ae_002 records both characters as "aware of their attachment," ae_021 says Emma gives Henry's concerns "further consideration," and ae_012 says Regina realizes Mr. Gold "may know more." These are vague internal interpretations without a unique executable value, so later Stage 1 questions cannot identify one defensible before/after state.
  required_change: Replace each vague interpretation with a discrete, source-supported knowledge, commitment, relationship, permission, or resource value whose effective state and acquisition event are uniquely answerable.
  resolution: >-
    Replaced all three interpretations with objective values: ae_002
    closes Snow and Charming's temporary cooperation while preserving his active
    engagement and their separate departure; ae_021 records Emma learning Henry's
    stated Savior motive; ae_012 records Mr. Gold withholding answers and Regina
    observing that his use of please compels her compliance.
  status: fixed
