- item_id: characters.prince_charming.testable_boundaries.bc_002_bc_003
  severity: major
  rule_id: stage3_boundary_current_executable
  evidence: >-
    Prince Charming's runtime snapshot is immediately after the Pilot's
    curse-planning council, but bc_002 is explicitly limited to his first encounter
    with Snow White and bc_003's only challenge space is explicitly before their
    wedding. Both situations are already historical at the selected snapshot, so
