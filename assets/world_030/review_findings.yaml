- item_id: canon.yaml.canon_policy.shared_snapshot
  severity: blocker
  rule_id: snapshot_current_state_compatible
  evidence: The shared snapshot spans all Storybrooke time before the curse breaks and multiple noncontemporaneous flashbacks. This produces incompatible current states, most clearly in prince_charming initial_context where surviving the first carriage encounter, breaking Snow White's sleeping curse, and planning against the later Dark Curse are all simultaneously active goals.
  required_change: Define one effective current snapshot for each runtime context, or an explicit compatible snapshot mapping, and make every Profile and Frozen current field represent only that point while retaining earlier material as history.
  resolution: Defined the Storybrooke current state immediately after Episode 7,
    separated it from the latest shown fairytale runtime context, and synchronized
    current Profile and Frozen goals, locations, commitments, and knowledge to those points.
  status: fixed
- item_id: environment.yaml.locations
  severity: major
  rule_id: active_scene_locations_mapped
  evidence: The assets use Granny's Bed and Breakfast as Emma's lodging, Mary Margaret's apartment as Emma's later residence, Regina's office, the school or bus stop, the town line, the abandoned mine, and Regina's graveyard vault in episodes 1-7, but the environment either omits them or conflates the inn with grannys_diner.
  required_change: Add runtime-valid nodes or explicit unambiguous mappings for every active scene, residence, workplace, meeting place, and movement destination used by the selected snapshot and candidate material.
  resolution: Added distinct nodes for Granny's inn, Mary Margaret's apartment,
    mayor's office, school, bus stop, town line, abandoned mine, graveyard, and
    Regina's vault, with runtime connections.
  status: fixed
- item_id: characters.regina_mills.private.secrets
  severity: blocker
  rule_id: future_knowledge_excluded
  evidence: The Profile states that Regina knows Emma is the Savior, while episode 2 has Henry explain that he removed the pages identifying Emma so Regina does not know who she is, and Regina asks Mr. Gold who Emma Swan is. No event through episode 7 grounds Regina acquiring that knowledge.
  required_change: Remove or downgrade Regina's unsupported knowledge of Emma's Savior identity and align her goals, boundaries, and Frozen knowledge with what she actually knows by the selected snapshot.
  resolution: Removed the claim that Regina knows Emma is the Savior; her Profile
    and Frozen state now ground hostility in custody and control and explicitly limit
    Mr. Gold's Episode 2 disclosure.
  status: fixed
- item_id: characters.rumplestiltskin.private
  severity: major
  rule_id: character_source_grounded
  evidence: The Profile and Frozen state assert as current fact that Mr. Gold retains full curse identity knowledge, knows Emma may break the curse, is steering her toward that outcome, and has already struck a deal with Regina over Emma. Episodes 1-7 show suggestive behavior but do not establish all of these internal conclusions, and the alleged Emma bargain did not occur.
  required_change: Restrict Mr. Gold's current private knowledge and goals to conclusions directly established within episodes 1-7, distinguish inference from known fact, and remove the nonexistent completed Emma bargain.
  resolution: Restricted Mr. Gold's Profile and Frozen state to his observed interest,
    adoption knowledge, and unexplained leverage; removed full curse-memory certainty,
    a curse-breaking plan, and the nonexistent Emma bargain.
  status: fixed
- item_id: anchor_pool.yaml.events.ae_001
  severity: blocker
  rule_id: candidate_canon_valid
  evidence: ae_001 says Charming is pulled from a carriage after an attack and meets Snow while she robs him. In episode 3, Snow ambushes the guarded carriage carrying Charming and Abigail, steals the jewels, and Charming pursues and catches her; he is not pulled unconscious from the carriage.
  required_change: Replace the fact, state change, and counterfactual with the discrete first-meeting event actually shown in episode 3.
  resolution: Rewrote ae_001 as Snow's carriage robbery, Charming's pursuit, and
    capture of Snow, with a matching state change and single-variable counterfactual;
    corrected both Profiles and Frozen provenance.
  status: fixed
- item_id: anchor_pool.yaml.events.ae_012_ae_013
  severity: blocker
  rule_id: candidate_canon_valid
  evidence: These candidates claim Regina asks Mr. Gold to remove Emma and that he establishes a favor bargain tied to Emma. In episode 2 Mr. Gold offers help for a price, Regina refuses to make another deal, questions him about Emma, and he exits by invoking the pre-curse "please" condition; no new Emma-removal bargain is made.
  required_change: Remove the fabricated bargain or rewrite the candidates to the discrete exchange and resulting knowledge or leverage actually shown in episode 2.
  resolution: Removed ae_013 and rewrote ae_012 as Regina's Episode 2 questions,
    Mr. Gold's refusal, and his invocation of pre-curse leverage, without any new bargain.
  status: fixed
- item_id: anchor_pool.yaml.events.ae_019
  severity: blocker
  rule_id: candidate_canon_valid
  evidence: ae_019 and Snow White's assets say Snow meets Rumplestiltskin while preparing to be taken away under the Evil Queen's control. In the pilot, pregnant Snow and Charming voluntarily consult Rumplestiltskin, who is their prisoner, to learn about the threatened curse.
  required_change: Correct the event participants, custody, timing, purpose, resulting knowledge, and all corresponding Profile and Frozen references.
  resolution: Rewrote ae_019 as pregnant Snow and Charming voluntarily consulting
    their prisoner for the curse prophecy; synchronized participants, custody, purpose,
    knowledge, Profiles, and Frozen states.
  status: fixed
- item_id: anchor_pool.yaml.events.chronology
  severity: major
  rule_id: candidate_chronology_recoverable
  evidence: None of the 24 candidates has a source_id, episode order, chapter_order, or other ordering key, although the pool mixes distant fairytale chronology with Storybrooke episodes and canon_policy requires narrative-time ordering.
  required_change: Add valid source references and a recoverable explicit chronology that handles the two timelines without pretending their cross-timeline order is known.
  resolution: Added source_id, timeline_id, and chapter_order to every retained
    candidate and documented that ordering is total only within each of the separate
    fairytale and Storybrooke timelines.
  status: fixed
- item_id: anchor_pool.yaml.events.event_boundaries
  severity: major
  rule_id: candidate_event_discrete
  evidence: The cited ae_003, ae_023, and ae_024 defects were repaired, but retained ae_008 still combines Henry's earlier apple warning with Regina's later delivery of an apple basket as if they were one event. The two actions occur in separate scenes and in the opposite causal order implied by the candidate.
  required_change: Split or rewrite ae_008 as one discrete scene, with fact, chronology, state change, known_by, and counterfactual all tied to that scene.
  resolution: Rewrote ae_008 as only Regina's Episode 2 visit to Emma's room and
    delivery of an apple basket; removed Henry's earlier warning and Henry from
    known_by/anchor_for so fact, state change, participants, and counterfactual all
    share one scene.
  status: fixed
- item_id: anchor_pool.yaml.events.cf_edit
  severity: major
  rule_id: stage2_causal_variable_isolatable
  evidence: The ae_021, ae_022, and ae_024 defects were repaired, but ae_008 remains non-causal. Its cf_edit changes Regina's later gift to flowers, while its state change is attributed to Henry's earlier warning; changing the later gift cannot cause or prevent already-acquired knowledge.
  required_change: After making ae_008 discrete, define a one-variable counterfactual that can causally change that event's objective state update or decision.
  resolution: Made ae_008's state update Emma learning that Regina deliberately
    selected apples as her gift and changed only gift presence in the counterfactual;
    if Regina arrives without a gift, that knowledge is not acquired.
  status: fixed
- item_id: frozen.all.knowledge.visibility
  severity: major
  rule_id: player_npc_visibility_executable
  evidence: The six Frozen files use mutually undocumented scalar labels including public, private, shared, semi-public, known_to_emma, and public_to_henry. canon.yaml defines no default Player identity or knowledge semantics, while every context places an unspecified Player beside the NPC.
  required_change: Define the default Player role and normalize each knowledge item's NPC and Player visibility to one runtime-supported, unambiguous representation without exposing private facts.
  resolution: Defined the default neutral Player in canon.yaml and normalized all
    six Frozen files to visibility arrays using only [npc] and [npc, player].
  status: fixed
- item_id: frozen.all.knowledge.source_event
  severity: major
  rule_id: stage1_state_traceable
  evidence: Every Frozen knowledge item cites only the generic source_event initial_state, despite candidate events and episode sources being available. This does not trace when knowledge was acquired and cannot support a defensible before/after Stage 1 answer.
  required_change: Give each knowledge state a stable, specific canon or candidate provenance and preserve distinct acquisition timing where it affects state questions.
  resolution: Replaced generic initial_state provenance on every Frozen knowledge
    item with a specific retained candidate ID or covered episode source ID.
  status: fixed
- item_id: frozen.emma_swan.environment.locations
  severity: major
  rule_id: frozen_current_location_matches_snapshot
  evidence: Emma's residence was correctly changed to Mary Margaret's apartment, but Frozen location is a current scene location rather than a residence field. The canon snapshot says immediately after Episode 7, whose final scene leaves Emma at the sheriff's station holding the dying Graham; placing her at Mary Margaret's apartment silently advances beyond the bounded source.
  required_change: Place Emma at the sheriff's station for this immediate post-Episode-7 context, or explicitly redefine and ground a later compatible runtime-scene policy without adding events beyond Episode 7.
  resolution: Moved Emma and the co-located default Player from Mary Margaret's
    apartment to sheriffs_station, matching Emma's latest source-grounded Episode 7 scene.
  status: fixed
- item_id: frozen.snow_white.runtime_state.relationships.snow_white
  severity: major
  rule_id: relationships_directional_nonself
  evidence: Snow White's Frozen state contains a loyal relationship from snow_white to herself, which has no Profile grounding and creates a meaningless Stage 1 relationship answer.
  required_change: Remove the self-relationship and retain only grounded directional relationships to other entities.
  resolution: Removed Snow White's self-relationship and retained only directional
    relationships to other characters with explicit basis events.
  status: fixed
- item_id: frozen.all.environment.access_and_resources
  severity: major
  rule_id: stage3_runtime_affordances_sufficient
  evidence: All six contexts have empty access, offers, commitments, and inventories even where Profiles rely on executable authority or resources such as Emma's deputy role, Regina's mayoral and custodial authority, Henry's storybook, and Mr. Gold's pawnshop control. The current runtime state cannot pressure or exercise those boundaries.
  required_change: Encode only the canon-grounded permissions, possessions, resources, and commitments needed to make selected Stage 3 boundaries executable and objectively testable.
  resolution: Added grounded active commitments, possessions, and permission records,
    Emma's deputy badge and station access, Henry's storybook, Regina's mayoral and
    household control, Mr. Gold's key and shop control, and royal commitments/access.
  status: fixed
- item_id: characters.henry_mills.style.verbal_habits
  severity: minor
  rule_id: quotation_policy_consistent
  evidence: The verbal habit reproduces the dialogue phrase "I know it sounds crazy" despite canon.yaml requiring all dialogue facts to be paraphrased and no quotations reproduced.
  required_change: Paraphrase the habit without retaining source dialogue wording.
  resolution: Paraphrased the habit as acknowledging that his claims may sound
    implausible, without reproducing the source dialogue.
