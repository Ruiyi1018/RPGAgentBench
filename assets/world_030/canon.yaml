data_constraints:
- Every fact must be verifiable within Once Upon a Time Season 1 episodes 1 through
  7.
- No fact may reference events, reveals, or character developments from episodes after
  episode 7 of Season 1.
- All Storybrooke facts must reflect the period before the curse breaks.
- All fairytale realm facts must come from flashbacks shown in episodes 1 through
  7.
- Do not include dialogue quotations; paraphrase all statements.
- Do not include uncertain or speculative details such as unstated dates, chapter
  numbers, or episode numbers not shown on screen.
- All anchor events must be ordered chronologically according to narrative time, not
  airing order.
- Locations and items must appear or be referenced within episodes 1 through 7.
