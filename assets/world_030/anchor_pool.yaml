world_id: world_030
source: Once Upon a Time, Season 1 episodes 1-7
chronology_policy: Order by chapter_order within timeline_id only. Cross-timeline
  order between fairytale_realm and storybrooke_present is intentionally undefined.
events:
- id: ae_001
  source_id: ouat_s1_e3
  timeline_id: fairytale_realm
  chapter_order: 10
  fact: Snow White ambushes the guarded carriage carrying Prince Charming and Abigail,
    steals their jewels, and is caught by Charming after he pursues her.
  known_by: [snow_white, prince_charming]
  state_change: Snow White and Prince Charming become personally acquainted as adversaries.
  cf_edit: Prince Charming does not catch Snow White after the robbery.
  anchor_for: [snow_white, prince_charming]
- id: ae_002
  source_id: ouat_s1_e3
  timeline_id: fairytale_realm
  chapter_order: 20
  fact: After recovering the stolen jewels together, Snow White and Prince Charming
    part when his existing engagement prevents him from remaining with her.
  known_by: [snow_white, prince_charming]
  state_change: Their temporary cooperation to recover the jewels ends, and they
    depart separately while Prince Charming remains bound to his existing engagement.
  cf_edit: Prince Charming is not bound by an existing engagement when the quest ends.
  anchor_for: [snow_white, prince_charming]
- id: ae_003
  source_id: ouat_s1_e1
  timeline_id: fairytale_realm
  chapter_order: 30
  fact: Snow White and Prince Charming marry at the royal castle.
  known_by: [snow_white, prince_charming]
  state_change: Snow White and Prince Charming become spouses.
  cf_edit: The wedding is interrupted before the marriage is completed.
  anchor_for: [snow_white, prince_charming]
- id: ae_019
  source_id: ouat_s1_e1
  timeline_id: fairytale_realm
  chapter_order: 40
  fact: Pregnant Snow White and Prince Charming voluntarily consult their prisoner
    Rumplestiltskin about the Evil Queen's threatened curse; he predicts their unborn
    child can save them and receives the child's name as his price.
  known_by: [snow_white, prince_charming, rumplestiltskin]
  state_change: Snow White and Prince Charming learn the curse prophecy, while
    Rumplestiltskin learns that their unborn daughter will be named Emma.
  cf_edit: Snow White refuses to give the unborn child's name as the price for the prophecy.
  anchor_for: [snow_white, prince_charming, rumplestiltskin]
- id: ae_004
  source_id: ouat_s1_e1
  timeline_id: storybrooke_present
  chapter_order: 10
  fact: Henry arrives at Emma's Boston apartment and identifies himself as the son
    she gave up for adoption.
  known_by: [emma_swan, henry_mills]
  state_change: Emma learns that her biological son has found her.
  cf_edit: Henry does not identify himself as Emma's son.
  anchor_for: [emma_swan, henry_mills]
- id: ae_005
  source_id: ouat_s1_e1
  timeline_id: storybrooke_present
  chapter_order: 20
  fact: During the drive to Storybrooke, Henry tells Emma that the town's residents
    are cursed fairytale characters and that Regina is the Evil Queen.
  known_by: [emma_swan, henry_mills]
  state_change: Emma learns the content of Henry's curse belief without accepting it.
  cf_edit: Henry withholds his curse theory during the drive.
  anchor_for: [emma_swan, henry_mills]
- id: ae_006
  source_id: ouat_s1_e1
  timeline_id: storybrooke_present
  chapter_order: 30
  fact: Emma returns Henry to the Mills house and meets Regina, his adoptive mother.
  known_by: [emma_swan, henry_mills, regina_mills]
  state_change: Emma and Regina become personally acquainted.
  cf_edit: Regina is absent when Emma returns Henry.
  anchor_for: [emma_swan, regina_mills]
- id: ae_007
  source_id: ouat_s1_e1
  timeline_id: storybrooke_present
  chapter_order: 40
  fact: Emma finds Henry's storybook in her car and examines it.
  known_by: [emma_swan, henry_mills]
  state_change: Emma gains possession of and sees Henry's claimed evidence.
  cf_edit: Henry keeps the storybook when Emma prepares to leave.
  anchor_for: [emma_swan, henry_mills]
- id: ae_020
  source_id: ouat_s1_e1
  timeline_id: storybrooke_present
  chapter_order: 50
  fact: After Henry goes missing from Regina's house, Emma agrees to find him.
  known_by: [emma_swan, regina_mills]
  state_change: Emma takes responsibility for locating Henry.
  cf_edit: Henry remains at the Mills house.
  anchor_for: [emma_swan, henry_mills, regina_mills]
- id: ae_021
  source_id: ouat_s1_e1
  timeline_id: storybrooke_present
  chapter_order: 60
  fact: Emma finds Henry at his castle playground and listens as he explains why
    he brought her to Storybrooke.
  known_by: [emma_swan, henry_mills]
  state_change: Emma learns that Henry brought her to Storybrooke because he believes
    she is the Savior who can break the curse.
  cf_edit: Henry refuses to explain why he brought Emma to Storybrooke.
  anchor_for: [emma_swan, henry_mills]
- id: ae_018
  source_id: ouat_s1_e1
  timeline_id: storybrooke_present
  chapter_order: 70
  fact: At the Mills house, Regina orders Emma to leave Storybrooke.
  known_by: [emma_swan, regina_mills]
  state_change: Emma learns that Regina explicitly wants her to leave Storybrooke.
  cf_edit: Regina does not demand that Emma leave town.
  anchor_for: [emma_swan, regina_mills]
- id: ae_009
  source_id: ouat_s1_e1
  timeline_id: storybrooke_present
  chapter_order: 80
  fact: Emma checks into Granny's Bed and Breakfast for a one-week stay.
  known_by: [emma_swan]
  state_change: Emma establishes temporary lodging in Storybrooke.
  cf_edit: Emma does not rent a room at the inn.
  anchor_for: [emma_swan]
- id: ae_008
  source_id: ouat_s1_e2
  timeline_id: storybrooke_present
  chapter_order: 90
  fact: Regina visits Emma's room at Granny's Bed and Breakfast and gives Emma a
    basket of apples.
  known_by: [emma_swan, regina_mills]
  state_change: Emma learns that Regina deliberately selected apples as a gift for her.
  cf_edit: Regina visits Emma's room without bringing a gift.
  anchor_for: [emma_swan, regina_mills]
- id: ae_014
  source_id: ouat_s1_e2
  timeline_id: storybrooke_present
  chapter_order: 100
  fact: Immediately after meeting Emma, Archie calls Regina and reports that Emma
    took Henry's therapy file.
  known_by: [archie_hopper, regina_mills]
  state_change: Regina receives Archie's report identifying Emma as having taken
    Henry's therapy file.
  cf_edit: Archie tells Regina that he voluntarily handed the therapy file to Emma.
  anchor_for: [regina_mills]
- id: ae_022
  source_id: ouat_s1_e2
  timeline_id: storybrooke_present
  chapter_order: 110
  fact: While confronting Emma in Emma's room at Granny's Bed and Breakfast, Regina
    tells her that Henry is receiving counseling.
  known_by: [emma_swan, regina_mills]
  state_change: Emma learns Regina's account that Henry is receiving counseling.
  cf_edit: Regina withholds Henry's counseling from Emma.
  anchor_for: [emma_swan, regina_mills]
- id: ae_012
  source_id: ouat_s1_e2
  timeline_id: storybrooke_present
  chapter_order: 120
  fact: Regina questions Mr. Gold about Emma and Henry's adoption; he refuses to
    answer and invokes the special compliance attached to the word please.
  known_by: [regina_mills, rumplestiltskin]
  state_change: Regina learns that Mr. Gold will withhold answers and observes that
    his use of the word please compels her compliance.
  cf_edit: Mr. Gold withholds the answers but does not invoke the word please.
  anchor_for: [regina_mills, rumplestiltskin]
- id: ae_023
  source_id: ouat_s1_e4
  timeline_id: storybrooke_present
  chapter_order: 130
  fact: Emma calls Sheriff Graham and accepts the previously offered deputy job.
  known_by: [emma_swan]
  state_change: Emma commits to working as a Storybrooke deputy.
  cf_edit: Emma declines the deputy job.
  anchor_for: [emma_swan]
