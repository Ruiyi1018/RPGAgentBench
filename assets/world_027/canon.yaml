  title: Lucifer, Season 1
  creator: Tom Kapinos, Fox/Netflix
  scope: Season 1, episodes 1-13
  authority: primary
data_constraints:
- Facts must derive only from Season 1 episodes 1-13
- No later-season plot knowledge may be used
- Do not invent URLs or absolute dates; episode_order may identify and order televised
    events within the approved season.
- All anchor_events must be canonical within the shared snapshot
- cf_edit must provide a real minimal alternative interpretation or detail, never
  none or N/A
- All location connections must reference listed location IDs
- known_by and anchor_for must use only roster character IDs
