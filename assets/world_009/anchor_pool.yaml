world_id: world_009
source: 电视连续剧《武林外传》前40集
snapshot_end: 第40集结束
ordering_rule: 先按集序、再按同集内事件顺序；chapter_order为唯一排序键
events:
- id: ae_001
  chapter_order: '01.1'
  source_ref: 第1集
  fact: 郭芙蓉以闯荡江湖的方式到达同福客栈并损坏店内财物，随后被留下以做杂役抵偿损失。
  known_by: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui, mo_xiaobei]
  state_change: 郭芙蓉由外来闯荡者变为受佟湘玉管理、对客栈负有劳动偿还义务的杂役。
  cf_edit: 若佟湘玉免除赔偿并允许郭芙蓉当日离开，郭芙蓉不会取得客栈杂役身份与相应劳动义务。
  anchor_for: [guo_furong, tong_xiangyu]
- id: ae_002
  chapter_order: '03.1'
  source_ref: 第3集
  fact: 莫小贝进入白马书院上学，佟湘玉开始围绕书院要求安排并约束她的学习。
  known_by: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui, mo_xiaobei]
  state_change: 莫小贝取得白马书院学童身份，并新增受监护人督促上学的当前义务。
  cf_edit: 若白马书院没有接收莫小贝，她将没有到书院上学的义务，佟湘玉只能另寻教育安排。
  anchor_for: [mo_xiaobei, tong_xiangyu]
- id: ae_003
  chapter_order: '05.1'
  source_ref: 第5集
  fact: 白展堂在展红绫追查盗圣事件中向同福客栈主要成员确认自己就是盗圣白玉汤，众人随后继续替他对外保密。
  known_by: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui, mo_xiaobei]
  visibility_note: known_by仅表示六名客栈成员知道；默认Player和其他外部人员不知道。
  state_change: 六名客栈成员对白展堂身份的知识由猜测或不知转为确认，同时形成不向外部披露的共同保密约束。
  cf_edit: 若白展堂当时未确认盗圣身份，客栈成员对其真实身份仍是未知，不能形成基于已确认身份的保密约束。
  anchor_for: [bai_zhantang, tong_xiangyu, guo_furong, lv_xiucai, li_dazui, mo_xiaobei]
- id: ae_004
  chapter_order: '07.1'
  source_ref: 第7集
  fact: 郭芙蓉欠吕秀才二钱报名费，吕秀才因碍于情面迟迟未能讨回，最终明确让她留下二钱并放弃追讨。
  known_by: [guo_furong, lv_xiucai]
  state_change: 当集临时形成的二钱个人还款义务随吕秀才放弃追讨而闭合；第40集不存在由此延续的债务、催收决定或客栈账本权限。
  cf_edit: 若吕秀才最终没有放弃追讨，郭芙蓉的二钱个人还款义务会在当集结束后继续有效；其他客栈职务与账本权限均不改变。
  anchor_for: [guo_furong, lv_xiucai]
- id: ae_005
  chapter_order: '12.1'
  source_ref: 第12集
  fact: 伙计们以装作投向竞争客栈的方式回应在同福客栈受到的委屈，迫使佟湘玉正面处理用人与经营矛盾。
  known_by: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui]
  state_change: 佟湘玉认识到维持经营不能只靠命令，伙计们也确认集体行动能够迫使掌柜协商。
  cf_edit: 若只有一名伙计私下抱怨而没有形成集体装叛变，佟湘玉不会面对人员同时流失的压力，也无需立即协商。
  anchor_for: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui]
- id: ae_006
  chapter_order: '17.1'
  source_ref: 第17集
  fact: 衡山派来人确认莫小贝接掌衡山派，莫小贝成为衡山派掌门。
  known_by: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui, mo_xiaobei]
  state_change: 莫小贝新增衡山派掌门身份和回应本派事务的有限权限，但仍是受佟湘玉监护的未成年学童。
  cf_edit: 若衡山派来人没有确认由莫小贝接掌，她仍只是客栈寄居学童，不具备以掌门名义回应本派事务的权限。
  anchor_for: [mo_xiaobei, tong_xiangyu]
- id: ae_007
  chapter_order: '24.1'
  source_ref: 第24集
  fact: 郭芙蓉与吕秀才彼此确认情意，二人的关系由互有好感的同僚转为已经确立的恋爱关系。
  known_by: [guo_furong, lv_xiucai]
  state_change: 郭芙蓉与吕秀才的双向关系由亲近同僚更新为恋爱关系；第26集冲突、第30至31集分离、第36集回归与第39集和解均未在第40集快照撤销该关系。
  cf_edit: 若郭芙蓉没有回应吕秀才的情意，二人只保留互有好感的同僚关系，不会在该事件中确立恋爱关系。
  anchor_for: [guo_furong, lv_xiucai]
- id: ae_008
  chapter_order: '29.1'
  source_ref: 第29集
  fact: 姬无命威胁客栈众人时，吕秀才通过连续说理使其放弃继续行凶，客栈危机解除。
  known_by: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui, mo_xiaobei]
  state_change: 吕秀才从被视为缺乏武力的账房，增加了可用语言和推理应对特定危机的可观察能力记录。
  cf_edit: 若姬无命拒绝听吕秀才说理，吕秀才的语言介入不会解除威胁，客栈仍须依赖其他脱险手段。
  anchor_for: [lv_xiucai]
- id: ae_009
  chapter_order: '30.1'
  source_ref: 第30集
  fact: 郭芙蓉决定回家探望父母并离开同福客栈，吕秀才因她离开而明显牵挂。
  known_by: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui, mo_xiaobei]
  state_change: 郭芙蓉的地点和日常杂役承诺暂时离开客栈，吕秀才对她的特殊在意由日常互动转为分离中的持续牵挂。
  cf_edit: 若郭芙蓉决定留下而不回家，杂役承诺和地点保持不变，吕秀才不会进入因分离而牵挂的状态。
  anchor_for: [guo_furong, lv_xiucai]
- id: ae_010
  chapter_order: '32.1'
  source_ref: 第32集
  fact: 祝无双的厨艺使李大嘴失去原有掌勺位置，佟湘玉改派他做其他杂务。
  known_by: [tong_xiangyu, bai_zhantang, lv_xiucai, li_dazui, mo_xiaobei]
  state_change: 李大嘴对后厨的日常操作权被撤回，当前目标转为恢复厨子位置或证明自己的价值。
  cf_edit: 若佟湘玉没有撤换李大嘴，他仍持有后厨日常操作权，也不会因失去厨子位置而寻找补救。
  anchor_for: [li_dazui, tong_xiangyu]
- id: ae_011
  chapter_order: '33.1'
  source_ref: 第33集
  fact: 吕秀才和祝无双被姬无病扣作人质后，白展堂以盗圣身份相关手段介入并参与救人。
  known_by: [tong_xiangyu, bai_zhantang, lv_xiucai, li_dazui, mo_xiaobei]
  state_change: 白展堂在同伴面临直接危险时暂时放宽隐藏身份的策略，以实际行动承担营救责任。
  cf_edit: 若吕秀才和祝无双没有被扣作人质，白展堂不会获得必须以盗圣相关身份手段介入的紧迫触发。
  anchor_for: [bai_zhantang, lv_xiucai]
- id: ae_010_restore
  chapter_order: '37.1'
  source_ref: 第37集
  fact: 祝无双在第37集离开同福客栈，李大嘴随后重新承担客栈掌勺与日常供餐工作。
  known_by: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui, mo_xiaobei]
  state_change: 李大嘴的厨子职务与后厨日常操作权限由暂时撤回恢复为有效，佟湘玉仍保留后厨用人和经营安排的最终授权权。
  cf_edit: 若祝无双在第37集没有离店并继续承担掌勺，李大嘴在该事件后不会恢复后厨日常操作权限，只保留争取复职的目标。
  anchor_for: [li_dazui, tong_xiangyu]
- id: ae_012
  chapter_order: '40.1'
  source_ref: 第40集
  fact: 中秋之夜，原本已在同福客栈聚首的六人经历了彼此未曾聚到客栈的假设人生，并在梦境结束后确认现实中的共同生活。
  known_by: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui, mo_xiaobei]
  state_change: 六人新增对“维持同福客栈共同生活与当前归属”的确认；现实地点、既有职务、资源与郭芙蓉第36集已经恢复的在店状态均未发生转移。
  cf_edit: 若假设人生没有呈现彼此未聚首所带来的困境，六人不会因该体验新增对客栈共同生活的确认；现实地点和既有分工仍保持不变。
  anchor_for: [tong_xiangyu, bai_zhantang, guo_furong, lv_xiucai, li_dazui, mo_xiaobei]
