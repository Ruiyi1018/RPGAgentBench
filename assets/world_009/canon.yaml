    initial_knowledge: 仅知道在客栈公共空间可直接观察到的人员职务、地点和公开经营事实；不因事实属于世界真相或客栈内部共享信息而自动知情
    initial_authority: 无权查阅账本、进入后厨操作、替掌柜调度人员或处置衡山派事务；临时授权必须由具体场景显式写入access
    visibility_semantics:
      npc_only: "[npc]表示该Frozen角色知道、默认Player不知道"
      npc_and_player: "[npc, player]表示该Frozen角色与默认Player在开局时都知道"
    scenario_override: 场景若赋予Player特定身份、既有关系、知识或权限，必须逐项显式覆盖默认值；未写出的项目继续沿用默认语义
