world_id: world_028
source: "Hannibal Season 1 Episodes 1-3 (Aperitif, Amuse-Bouche, Potage)"
events:
- id: jack_recruits_will
  episode: "S01E01 Aperitif"
  episode_order: 1
  event_order: 1
  fact: Jack Crawford asks FBI Academy lecturer Will Graham to consult on the missing-college-student investigation, and Will reluctantly agrees.
  known_by: [jack_crawford, will_graham]
  state_change: "will_graham.fbi_case_access: absent -> granted_by_jack; will_graham.goal.find_missing_girls: absent -> active"
  cf_edit: "Jack asks Will only for a classroom briefing and does not grant case or scene access; will_graham.fbi_case_access remains absent and will_graham.goal.find_missing_girls remains absent."
  anchor_for: [will_graham, jack_crawford]
- id: alana_refers_hannibal
  episode: "S01E01 Aperitif"
  episode_order: 1
  event_order: 2
  fact: Alana Bloom recommends psychiatrist Hannibal Lecter to Jack as an expert who can help assess Will without making Will feel formally examined.
  known_by: [alana_bloom, jack_crawford]
  state_change: "jack_crawford.knowledge.hannibal_as_candidate: absent -> known; jack_crawford.goal.recruit_hannibal: absent -> active"
  cf_edit: "Alana says she cannot recommend a suitable psychiatrist; jack_crawford.knowledge.hannibal_as_candidate remains absent and jack_crawford.goal.recruit_hannibal remains absent."
  anchor_for: [alana_bloom, jack_crawford]
- id: jack_consults_hannibal
  episode: "S01E01 Aperitif"
  episode_order: 1
  event_order: 3
  fact: Acting on Alana's referral, Jack meets Hannibal in Hannibal's Baltimore office and asks him to assist with the case and observe Will.
  known_by: [jack_crawford, hannibal_lecter]
  state_change: "hannibal_lecter.fbi_consultant_access: absent -> limited; jack_crawford.relationship.hannibal_lecter: neutral -> trusting"
  cf_edit: "After Alana's referral, Jack asks Hannibal only a general psychiatric question and grants no case or Will-observation role; hannibal_lecter.fbi_consultant_access remains absent and jack_crawford.relationship.hannibal_lecter remains neutral."
  anchor_for: [hannibal_lecter, jack_crawford]
- id: hannibal_meets_will_at_quantico
  episode: "S01E01 Aperitif"
  episode_order: 1
  event_order: 4
  fact: Jack brings Hannibal to Quantico, where Hannibal and Will meet for the first time during a case briefing.
  known_by: [jack_crawford, will_graham, hannibal_lecter]
  state_change: "will_graham.knowledge.hannibal_identity: absent -> known; hannibal_lecter.knowledge.will_in_person: absent -> known"
  cf_edit: "Jack shares Will's written work with Hannibal but does not introduce them in person at Quantico; will_graham.knowledge.hannibal_identity and hannibal_lecter.knowledge.will_in_person both remain absent."
  anchor_for: [will_graham, hannibal_lecter, jack_crawford]
- id: cassie_boyle_copycat_discovered
  episode: "S01E01 Aperitif"
  episode_order: 1
  event_order: 5
  fact: Will, Jack, and Beverly examine Cassie Boyle's body in a Minnesota field; its conspicuous public staging differs from Hobbs's concealed victims and supports suspicion of a separate copycat.
  known_by: [will_graham, jack_crawford, beverly_katz]
  state_change: "fbi.knowledge.copycat_possible: absent -> suspected; beverly_katz.goal.compare_staging: absent -> active"
  cf_edit: "The body lacks the conspicuous staging element; fbi.knowledge.copycat_possible remains absent and beverly_katz.goal.compare_staging remains absent."
  anchor_for: [will_graham, jack_crawford, beverly_katz]
- id: hannibal_brings_will_breakfast
  episode: "S01E01 Aperitif"
  episode_order: 1
  event_order: 6
  fact: After their Quantico introduction, Hannibal brings breakfast to Will's room at the Minnesota hotel used by the investigation team before they continue work on the case.
  known_by: [will_graham, hannibal_lecter]
  state_change: "will_graham.knowledge.hannibal_hospitality: absent -> known; will_graham.relationship.hannibal_lecter: neutral -> trusting"
  cf_edit: "Keeping the earlier Quantico introduction unchanged, Hannibal does not bring breakfast or meet Will at the hotel before work; will_graham.knowledge.hannibal_hospitality remains absent and will_graham.relationship.hannibal_lecter remains neutral."
  anchor_for: [will_graham, hannibal_lecter]
- id: will_identifies_hobbs
  episode: "S01E01 Aperitif"
  episode_order: 1
  event_order: 7
  fact: Using the victim pattern and construction-site records, Will identifies Garrett Jacob Hobbs and gives the name to the team.
  known_by: [will_graham, jack_crawford, hannibal_lecter]
  state_change: "fbi.knowledge.garrett_hobbs_identity: absent -> known; fbi.goal.reach_hobbs_residence: absent -> active"
  cf_edit: "The records search yields no unique name; fbi.knowledge.garrett_hobbs_identity remains absent and fbi.goal.reach_hobbs_residence remains absent at that point."
  anchor_for: [will_graham, jack_crawford, hannibal_lecter]
- id: hannibal_warns_hobbs
  episode: "S01E01 Aperitif"
  episode_order: 1
  event_order: 8
  fact: After Will identifies Garrett Jacob Hobbs, Hannibal secretly telephones Hobbs and warns him that law enforcement has identified him.
  known_by: [hannibal_lecter]
  state_change: "hannibal_lecter.knowledge.warning_delivered: absent -> known; hannibal_lecter.goal.conceal_interference: absent -> active"
  cf_edit: "Hannibal does not place the warning call; hannibal_lecter.knowledge.warning_delivered and hannibal_lecter.goal.conceal_interference both remain absent, while all prior FBI actions remain unchanged."
  anchor_for: [hannibal_lecter]
- id: will_shoots_hobbs
  episode: "S01E01 Aperitif"
  episode_order: 1
  event_order: 9
  fact: At the Hobbs residence, Hobbs kills his wife and cuts Abigail's throat; Will shoots Hobbs to stop him, and Abigail survives the immediate attack.
  known_by: [will_graham, hannibal_lecter, abigail_hobbs]
  state_change: "world.garrett_hobbs_alive: true -> false; abigail_hobbs.injury: none -> severe_neck_wound; will_graham.knowledge.shot_hobbs: absent -> known"
  cf_edit: "Will fires before Hobbs cuts Abigail; world.garrett_hobbs_alive still becomes false and will_graham.knowledge.shot_hobbs still becomes known, but abigail_hobbs.injury remains none."
  anchor_for: [will_graham, hannibal_lecter, abigail_hobbs]
- id: abigail_wakes_at_port_haven
  episode: "S01E03 Potage"
  episode_order: 3
  event_order: 1
  fact: Abigail regains consciousness under care at Port Haven, making a clinical interview possible.
  known_by: [abigail_hobbs, alana_bloom, will_graham, hannibal_lecter, jack_crawford]
  state_change: "abigail_hobbs.condition: unconscious -> awake"
  cf_edit: "At this event boundary Abigail does not regain consciousness; abigail_hobbs.condition remains unconscious, so the clinical interview and home visit cannot yet begin."
  anchor_for: [abigail_hobbs, alana_bloom, will_graham, hannibal_lecter, jack_crawford]
- id: alana_interviews_abigail
  episode: "S01E03 Potage"
  episode_order: 3
  event_order: 2
  fact: Acting as Abigail's treating psychiatrist, Alana conducts the first clinical interview after Abigail wakes; Abigail tells Alana she remembers the attack after withholding that from the nurses.
  known_by: [abigail_hobbs, alana_bloom]
  state_change: "abigail_hobbs.disclosure.attack_memory: withheld_from_staff -> shared_with_alana_only; abigail_hobbs.goal.control_account: absent -> active"
  cf_edit: "Abigail truthfully tells the nurses she remembers before Alana arrives; abigail_hobbs.disclosure.attack_memory is shared_with_staff rather than shared_with_alana_only, while Alana's already-established treatment role is unchanged."
  anchor_for: [abigail_hobbs, alana_bloom]
- id: abigail_visits_hobbs_home
  episode: "S01E03 Potage"
  episode_order: 3
  event_order: 3
  fact: Abigail travels under supervision with Will, Hannibal, and Alana to her Minnesota home as part of confronting what happened there.
  known_by: [abigail_hobbs, will_graham, hannibal_lecter, alana_bloom]
  state_change: "abigail_hobbs.location: port_haven_psychiatric_facility -> hobbs_residence_minnesota; abigail_hobbs.access.home_visit: denied -> supervised; alana_bloom.permission.accompany_abigail: absent -> granted"
  cf_edit: "The same supervised home visit proceeds, but Port Haven assigns another clinician instead of Alana; abigail_hobbs.location and supervised access change as stated, while alana_bloom.permission.accompany_abigail remains absent."
  anchor_for: [abigail_hobbs, will_graham, hannibal_lecter, alana_bloom]
- id: abigail_kills_nicholas_boyle
  episode: "S01E03 Potage"
  episode_order: 3
  event_order: 4
  fact: Nicholas Boyle confronts Abigail at the Hobbs home; during the struggle Abigail kills him with a knife.
  known_by: [abigail_hobbs]
  state_change: "abigail_hobbs.knowledge.killed_nicholas_boyle: absent -> known; abigail_hobbs.goal.conceal_boyle_death: absent -> active"
  cf_edit: "Nicholas leaves after the confrontation without being injured; abigail_hobbs.knowledge.killed_nicholas_boyle and abigail_hobbs.goal.conceal_boyle_death both remain absent, while all prior history remains unchanged."
  anchor_for: [abigail_hobbs]
- id: hannibal_conceals_boyle_death
  episode: "S01E03 Potage"
  episode_order: 3
  event_order: 5
  fact: At the Hobbs home, Abigail privately tells Hannibal that she killed Nicholas Boyle, and Hannibal helps her conceal Boyle's body from the others.
  known_by: [abigail_hobbs, hannibal_lecter]
  state_change: "hannibal_lecter.knowledge.boyle_death: absent -> known; hannibal_lecter.goal.conceal_boyle_death: absent -> active"
  cf_edit: "Abigail tells Hannibal that she killed Boyle, but Hannibal refuses to help conceal the body; hannibal_lecter.knowledge.boyle_death becomes known while hannibal_lecter.goal.conceal_boyle_death remains absent."
  anchor_for: [abigail_hobbs, hannibal_lecter]
- id: hannibal_abigail_secret_agreement
  episode: "S01E03 Potage"
  episode_order: 3
  event_order: 6
  fact: After leaving Port Haven without permission, Abigail goes to Hannibal's Baltimore office, identifies him as the caller who warned her father, and agrees to keep that warning secret after Hannibal agrees to keep his concealment of Nicholas Boyle's death secret.
  known_by: [abigail_hobbs, hannibal_lecter]
  state_change: "abigail_hobbs.knowledge.hannibal_warned_hobbs: absent -> known; abigail_hobbs.relationship.hannibal_lecter: neutral -> trusting; both.commitment.mutual_secrecy: absent -> active"
  cf_edit: "After Abigail identifies him as the caller, Hannibal denies it and offers no exchange of secrets; abigail_hobbs.knowledge.hannibal_warned_hobbs becomes known, but her relationship to Hannibal remains neutral and both.commitment.mutual_secrecy remains absent."
  anchor_for: [abigail_hobbs, hannibal_lecter]
