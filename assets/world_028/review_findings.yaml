- item_id: anchor_pool.events.state_change_cf_edit
  severity: major
  rule_id: stage2_causal_pairability
  evidence: "当前仍有不可用反事实。hannibal_brings_will_breakfast的cf_edit称Hannibal在酒店公共餐区“first meets Will”，但更早的hannibal_meets_will_at_quantico已明确两人在Quantico首次见面，反事实因而同时改写既有历史。hannibal_conceals_boyle_death的state_change仅声明Hannibal获知Boyle死亡并激活藏尸目标，而其cf_edit仍让Hannibal藏尸，只取消未写入该state_change的“private alliance”；该分支不会改变所声明的知识或目标状态，无法形成该事件的Sensitivity因果对。"
  required_change: "使每个拟用于Sensitivity的cf_edit只改动一个尚未由既有事件锁定的原因，并让该改动明确改变本事件声明的一个状态后果；尤其不得把酒店早餐改写成首次见面，并需让hannibal_conceals_boyle_death的反事实对应其knowledge或goal状态差异。"
  resolution: "已逐项把cf_edit写成可直接比较的状态分支：酒店早餐分支明确保留更早的Quantico初见，只取消酒店会面，使hospitality知识保持absent、Will对Hannibal关系保持neutral；Boyle藏尸分支让Abigail照常披露，但Hannibal拒绝协助，使其knowledge变known而conceal目标保持absent。其余分支也明确列出保持或改变的state_change字段，苏醒延迟等原先无状态差异的写法已删除。"
  status: fixed

- item_id: anchor_pool.events.known_by
  severity: major
  rule_id: knowledge_visibility
  evidence: "known_by多处混合直接参与、后来可能听说和作者全知，且无披露事件支持。例如will_fears_his_own_mind描述Will向Alana吐露却加入Hannibal；alana_defends_will描述Alana与Jack的交涉却加入Will和Hannibal；beverly_warns_will描述Beverly警告Will却加入Jack。"
