- item_id: canon.canon_policy.shared_snapshot
  severity: blocker
  rule_id: snapshot_timeline_compatibility
  evidence: "shared_snapshot仅写“A fixed Season 1 episode range”，未给出起止集或截止事件；generated_timeline又宣称覆盖第一季并按时间排序。现有Profile与initial_context采用Abigail在院、Will仍为FBI顾问且信任Hannibal的中段状态，而anchor_pool.season_one_investigation_ongoing明确指向该范围末尾；第一季结尾Will已识破Hannibal并被羁押、Abigail被推定死亡，不能与当前状态同时成立。"
  required_change: "锁定唯一、可引用的共享截止事件或集数范围，并据此统一canon、全部Profile、候选事件和Frozen当前状态；移除截止点之后的信息，且让current字段表示截止点的最新有效状态。"
  resolution: "已将共享截止点锁定为S01E03《Potage》最后一场互保秘密结束时：Abigail与Hannibal位于Lecter办公室，不推定其后返院，并明确排除E04+；六份Profile与Frozen仅保留该截止点前已成立状态。"
  status: fixed

- item_id: canon.canon_policy.player_semantics
  severity: major
  rule_id: player_role_bounded
  evidence: "canon未定义默认Player身份、可接触材料、权限或visibility语义；六份initial_context却都把Player放在NPC所在地点，并用private/shared标记知识，无法判定Player开局实际知道什么或能做什么。"
  required_change: "在canon中定义默认Player身份、能力、临时授权和开局知识语义，并规定场景覆盖方式；同步Frozen visibility与access，使Player可见和可执行边界唯一。"
  resolution: "已在canon定义默认Player为预先获准、仅可交谈且无执法/临床/证物/羁押权限的观察者，明确visibility主体列表和场景覆盖规则；六份Frozen均加入开局场景说明及最小access边界。"
  status: fixed

- item_id: anchor_pool.source_factuality
  severity: blocker
  rule_id: source_event_validity
  evidence: "多个候选并非第一季中所述的离散正典事件：hannibal_meets_jack称Jack在Baltimore寻找专家时遇见Hannibal，实际由Alana推荐；will_first_meets_hannibal把早餐写成Hannibal办公室场景；alana_returns_to_baltimore虚构“返回Baltimore”；abigail_moved_to_port_hope把Port Haven写成Port Hope；abigail_returns_to_baltimore又把本就在Baltimore的Port Haven写成从外地返回。"
  required_change: "逐项对照第一季具体剧集，纠正或删除不成立的事实，并为每项保留可复核的episode/source locator；相关Profile、environment和Frozen派生状态必须同步回到同一正典事实。"
  resolution: "已逐项重建S01E01-E03候选池：Alana推荐Hannibal、Will与Hannibal先在Quantico见面、随后在Minnesota调查酒店吃早餐；使用正确Port Haven名称，删除虚构返院事件，并把E03最后事件改为Lecter办公室互保警告电话与Boyle秘密。"
  status: fixed

- item_id: anchor_pool.events.chronology_and_boundaries
