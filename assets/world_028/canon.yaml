world_id: world_028
canon_policy:
  primary_source: Hannibal Season 1 episodes
  source_type: Television series season
  excluded_versions:
  - Season 2 and Season 3 of Hannibal
  - Hannibal novels by Thomas Harris
  - Film adaptations such as Manhunter, The Silence of the Lambs, Hannibal, Red Dragon,
    and Hannibal Rising
  shared_snapshot: "Immediately after the final scene of Season 1 Episode 3, Potage: Abigail Hobbs and Hannibal Lecter are in Lecter's Baltimore office after agreeing to keep secret, respectively, Hannibal's warning call to Garrett Jacob Hobbs and Hannibal's concealment of Nicholas Boyle's death; no return to Port Haven is asserted, and no event from Episode 4 or later has occurred."
  generated_timeline: "Season 1 Episodes 1-3 only, totally ordered by episode_order and event_order; the snapshot follows the private Lecter-office agreement, the final listed Episode 3 event."
  quotation_policy: Paraphrase all facts; do not reproduce dialogue verbatim
  player_semantics:
    default_role: "A pre-cleared observer attached to the relevant FBI or clinical meeting, with no law-enforcement, clinical, evidentiary, or custodial authority."
    opening_knowledge: "The Player knows only knowledge entries whose visibility includes player and the stated opening-scene facts; co-location never reveals npc-only information."
    temporary_authorization: "The Player may converse in the opening location but may not inspect evidence, records, patients, private offices, or crime scenes unless a scenario explicitly grants access."
    scenario_override: "A scenario may replace the Player identity, location, knowledge, inventory, and access only by declaring those overrides explicitly."
