data_constraints:
- All facts must be supported by Season 1 episode content from NBC Hannibal
- Do not use knowledge from episodes outside the fixed Season 1 episode range
- Treat the final Lecter-office scene of Episode 3 Potage as the inclusive cutoff; do not infer an unshown return to Port Haven, and exclude all Episode 4+ facts, later diagnoses, accusations, detentions, deaths, and relationship changes
- Do not use material from the Hannibal novels or film adaptations
- Paraphrase instead of quoting dialogue directly
- All anchor events must occur within the shared Season 1 snapshot
- Location connections must reference only locations defined in the environment
- visibility [npc] means only the evaluated NPC knows the item at opening; [npc, player] additionally gives it to the default Player
