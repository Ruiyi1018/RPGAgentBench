  required_change: 在第一部电影内锁定一个全角色兼容的最新已发生事件和首个未发生事件，并据此统一回归全部Profile、Frozen和候选池；不得让Frozen已生效状态的触发事件再次作为后续候选。
  resolution: 已将统一开局锁定为秦风抵达、与唐仁会合并在阿香住所过夜之后且唐仁接到抓捕预警之前；新增latest_included_event、first_excluded_event、current_state_rule及生成时间线起止，并将六份Profile/Frozen回归该时点，候选池仅保留开局后的事件。
