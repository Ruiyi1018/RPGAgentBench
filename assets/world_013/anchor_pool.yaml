world_id: world_013
source: 电影《唐人街探案》（2015）
timeline_scope: 全部候选均发生在Frozen初始化之后、canon.canon_policy.generated_timeline.end之前，并按chapter_order构成唯一顺序
known_by_semantics: 仅列出亲历该事实、被明确告知或实际接触对应证据的受评NPC；怀疑不等于确认，player不因同地或世界事实自动知情
fact_layer_semantics: 事件含fact_layers时，顶层known_by只对应顶层fact；每层知识以该层自己的known_by及必要的suspected_by或outcome_known_by为准，不在层间自动传播
events:
- id: ev_101
  chapter_order: "010"
  fact: 唐仁接到匿名电话，被告知警方已经包围并准备抓捕他；他与秦风随即逃离黄兰登带队的追捕。
  known_by: [tang_ren, qin_feng, huang_lan_deng]
  player_visible: false
  state_change: 唐仁和秦风分别新增“警方正在抓捕唐仁”的知识，唐仁的洗清嫌疑目标与两人的躲避状态转为active。
  state_paths_by_npc:
    tang_ren: runtime_state.knowledge.tangren_k_police_pursuit
    qin_feng: runtime_state.knowledge.know_qf_police_pursuit
    huang_lan_deng: runtime_state.goals.hld_goal_arrest_tang
  cf_edit: 仅将匿名电话是否成功接通改为未接通。
  counterfactual_consequence: 唐仁不能提前确认包围行动，无法在警方合围前主动逃离。
  anchor_for: [tang_ren, qin_feng, huang_lan_deng]
- id: ev_102
  chapter_order: "020"
  fact: 黄金盗窃团伙三人抓住唐仁与秦风；唐仁为自保披露自己曾把颂帕交付的密封箱送到海天大厦地下停车场。
  known_by: [tang_ren, qin_feng]
  player_visible: false
  state_change: 秦风新增箱子交付地点知识，唐仁新增与秦风共同查清箱子去向的active承诺。
  state_path: runtime_state.knowledge.know_qf_haitian_delivery
  commitment_state_path: runtime_state.commitments.investigate_delivery_crate
  cf_edit: 仅将唐仁是否说出停车场地点改为拒绝披露。
  counterfactual_consequence: 秦风不会从本次逼问得知交付地点，两人也不会据此把停车场作为下一调查目标。
  anchor_for: [tang_ren, qin_feng]
- id: ev_103
  chapter_order: "030"
  fact: 唐仁与秦风逃脱后到海天大厦地下停车场查找接走箱子的面包车；秦风闻到鱼腥味，并沿海鲜运输线索查到废车场。
  known_by: [tang_ren, qin_feng]
  player_visible: false
  state_change: 两人新增“接箱车辆与海鲜运输、废车场有关”的调查线索知识。
  state_paths_by_npc:
    qin_feng: runtime_state.knowledge.know_qf_scrapyard_route
    tang_ren: runtime_state.knowledge.tangren_k_scrapyard_route
  cf_edit: 仅将面包车是否留下鱼腥味改为没有留下该气味。
  counterfactual_consequence: 两人不能由停车场证据把车辆路线收窄到海鲜市场和废车场。
  anchor_for: [qin_feng, tang_ren]
- id: ev_104
  chapter_order: "040"
  fact: 唐仁与秦风潜入颂帕工坊查看现场，并在丹的房间床下发现有人长期藏身留下的生活痕迹。
  known_by: [tang_ren, qin_feng]
  player_visible: false
  state_change: 秦风新增“案发前有人曾在工坊床下长期藏身”的确认知识。
  state_path: runtime_state.knowledge.know_qf_workshop_hiding
  cf_edit: 仅将床下是否保留藏身痕迹改为已被彻底清理。
  counterfactual_consequence: 秦风不能从现场确认有人提前进入并长期藏匿。
  anchor_for: [qin_feng, tang_ren]
- id: ev_105
  chapter_order: "050"
  fact: 坤泰利用警局职务便利让唐仁与秦风限时查看颂帕案件资料和消费记录，但拒绝让二人带走卷宗或物证。
  known_by: [kun_tai, tang_ren, qin_feng]
  player_visible: false
  state_change: 唐仁和秦风对item_case_file的访问由denied临时变为granted，离开查看区域后恢复为denied；坤泰的卷宗访问保持granted。
  state_path: environment.access.case_file.subjects.tang_ren
  state_paths_by_npc:
    qin_feng: environment.access.case_file.subjects.qin_feng
    kun_tai: environment.access.case_file.subjects.kun_tai
  cf_edit: 仅将坤泰的决定改为拒绝临时查看。
  counterfactual_consequence: 唐仁与秦风的卷宗访问持续为denied，不能从官方资料获得颂帕家庭与消费记录。
  anchor_for: [kun_tai, tang_ren, qin_feng]
- id: ev_106
  chapter_order: "060"
  fact: 唐仁与秦风根据消费记录到颂帕常去的咖啡馆，确认颂帕常持相机拍摄街对面的思诺住所。
  known_by: [tang_ren, qin_feng]
  player_visible: false
  state_change: 两人新增“颂帕持续拍摄思诺住所方向”的知识，但尚不能据此确认拍摄动机。
  state_paths_by_npc:
    qin_feng: runtime_state.knowledge.know_qf_songpa_photos
    tang_ren: runtime_state.knowledge.tangren_k_songpa_photos
  cf_edit: 仅将咖啡馆人员是否确认颂帕经常拍摄街对面改为无法确认。
  counterfactual_consequence: 两人不能由消费记录把颂帕与思诺住所建立可核验联系。
  anchor_for: [qin_feng, tang_ren]
- id: ev_107
  chapter_order: "070"
  fact: 秦风与唐仁到思诺住所询问；思诺明知二人正被通缉仍允许他们进入，并只披露自己父母去世、被李先生领养。
  known_by: [si_nuo, qin_feng, tang_ren]
  player_visible: false
  state_change: 思诺对二人的住宅会面区访问由denied临时变为granted；秦风和唐仁新增其公开披露的家庭背景知识，思诺的日记设计仍仅自己知情。
  state_path: environment.access.si_nuo_meeting_area.subjects.qin_feng
  state_paths_by_npc:
    tang_ren: environment.access.si_nuo_meeting_area.subjects.tang_ren
    si_nuo: runtime_state.knowledge.si_nuo_knows_controlled_disclosure
  cf_edit: 仅将思诺是否开门允许二人进入改为拒绝会面。
  counterfactual_consequence: 二人不能进入住所或当面获得家庭背景，思诺也无需在本次会面维持选择性披露。
  anchor_for: [si_nuo, qin_feng, tang_ren]
- id: ev_108
  chapter_order: "080"
  fact: 李先生回到思诺住所，秦风、唐仁与思诺亲历其到场。
  known_by: [qin_feng, tang_ren, si_nuo]
  fact_layers:
  - id: ev_108_li_returns
    content: 李先生回到思诺住所。
    known_by: [qin_feng, tang_ren, si_nuo]
  - id: ev_108_qin_recognizes_li
    content: 秦风凭此前在废车场见过的面孔认出李先生是废车场工人。
    known_by: [qin_feng]
  - id: ev_108_qin_suspects_li
    content: 秦风把李先生列为与面包车线索有关的怀疑对象，尚未确认其为凶手。
    known_by: [qin_feng]
    suspected_by: [qin_feng]
  suspected_by: [qin_feng]
  outcome_known_by: [qin_feng]
  player_visible: false
  state_change: 秦风新增“李先生在废车场工作并可能关联面包车”的suspected知识，尚未确认他是凶手。
  state_path: runtime_state.knowledge.know_qf_suspects_li
  cf_edit: 仅将秦风是否在废车场见过李先生改为没有见过。
  counterfactual_consequence: 秦风无法凭面孔把思诺养父与废车场线索连接起来。
  anchor_for: [qin_feng]
- id: ev_109
  chapter_order: "090"
  fact: 闫先生的人抓住唐仁与秦风，并限令二人在五天内找回失窃黄金。
  known_by: [tang_ren, qin_feng]
  player_visible: false
  state_change: 两人新增“五天内找回黄金”的active外部承诺与期限压力。
  state_path: runtime_state.commitments.recover_gold_for_yan
  cf_edit: 仅将闫先生是否给出五日期限改为不设期限。
  counterfactual_consequence: 两人仍可调查黄金，但不存在五日到期的可判分承诺状态。
  anchor_for: [tang_ren, qin_feng]
- id: ev_110
  chapter_order: "100"
  fact: 唐仁与秦风再次进入工坊时遭戴面具的李先生袭击，李先生纵火试图毁掉现场；二人逃出。
  known_by: [tang_ren, qin_feng]
  player_visible: false
  state_change: 秦风对“李先生会为阻止调查而毁坏现场”的判断由suspected更新为亲历确认。
  state_path: runtime_state.knowledge.know_qf_li_destroyed_scene
  cf_edit: 仅将李先生是否点火毁坏现场改为未点火。
  counterfactual_consequence: 二人仍遭袭击，但不能确认袭击者同时意图销毁工坊痕迹。
  anchor_for: [qin_feng, tang_ren]
- id: ev_111
  chapter_order: "110"
  fact: 唐仁与秦风回到阿香住所，发现黄金盗窃团伙成员挟持阿香；脱困过程中阿香受伤，二人把她送往医院。
  known_by: [a_xiang, tang_ren, qin_feng]
  player_visible: false
  state_change: 阿香的位置更新为医院、health由100降为受伤状态；唐仁形成把阿香送医并确保安全的active承诺。
  state_path: environment.health.a_xiang
  location_state_path: environment.locations.a_xiang
  commitment_state_path: runtime_state.commitments.protect_a_xiang
  cf_edit: 仅将阿香是否在脱困中受伤改为没有受伤。
  counterfactual_consequence: 阿香health保持100且无需转移到医院，唐仁不会形成送医承诺。
  anchor_for: [a_xiang, tang_ren, qin_feng]
- id: ev_112
  chapter_order: "120"
  fact: 在医院，唐仁单向向秦风解释自己来到泰国的私人缘由。
  known_by: [tang_ren, qin_feng]
  player_visible: false
  state_change: 仅将秦风对唐仁的定向关系由neutral更新为trusting；唐仁对秦风的关系及双方其他状态在本候选中保持不变。
  state_owner: qin_feng
  state_path: runtime_state.relationships.tang_ren.level
  cf_edit: 仅将唐仁是否披露该私人缘由改为唐仁保持沉默，医院地点、脱身条件及此前关系均保持不变。
  counterfactual_consequence: 秦风对唐仁的定向关系保持neutral；唐仁对秦风的关系及双方其他状态仍不变。
  anchor_for: [qin_feng]
