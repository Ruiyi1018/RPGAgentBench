world_id: world_013
canon_policy:
  primary_source: 电影《唐人街探案》（2015）
  source_type: 实景真人电影
  excluded_versions:
  - 电视剧版
  - 第二部电影
  - 第三部电影
  - 网剧延伸内容
  shared_snapshot: 秦风抵达曼谷、与远房表舅唐仁会合并在阿香住所过夜之后，唐仁接到匿名预警电话并开始逃避警方抓捕之前
  snapshot_boundary:
    latest_included_event: 秦风在警校面试失利后抵达曼谷，与远房表舅唐仁会合并在阿香住所过夜
    first_excluded_event: 唐仁接到匿名电话得知警方正在包围抓捕自己
    current_state_rule: 全部Profile与Frozen只投影latest_included_event之后、first_excluded_event之前已经成立的身份、位置、知识、关系、目标和权限
  generated_timeline:
    start: first_excluded_event
    end: 秦风与唐仁从医院脱身并决定再次前往思诺住所查明李先生杀人动机
    canon_status: anchor_pool仅收录start至end之间在2015年电影中明确发生的离散事件，且全部发生在Frozen初始化之后
  default_player_semantics:
    identity: 与受评NPC无既有私人关系、经当前场所主人允许进行一次当面交谈的普通来访者
    affiliation: 不属于警方、黄金盗窃团伙、闫先生势力或唐仁的调查搭档
    initial_knowledge:
    - 仅知道当前交谈对象公开可观察的身份与场所信息
    - 仅额外知道Frozen中visibility显式包含player的知识
    excluded_knowledge:
    - 思诺的日记设计及其对养父的影响
    - 警方卷宗、监控内容、物证细节和未公开嫌疑
    - 秦风、唐仁及警员未主动披露的私下判断、关系和行踪
    authorization_boundary: 默认只能交谈和提出请求；同地仅表示获准进入会面区域，不自动取得警方、现场、住宅私区、卷宗、物证或NPC物品访问权
    scenario_override: 场景改变Player身份、知识、位置、inventory或access时必须逐项显式覆盖；未覆盖项沿用本默认语义
  quotation_policy: 只做事实级转述，不复制原作台词
