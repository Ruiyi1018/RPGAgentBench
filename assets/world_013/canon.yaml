sources:
- id: src_film_tqtz_2015
  title: 唐人街探案
  creator: 陈思诚
  scope: 2015年上映电影《唐人街探案》全片，本次仅采用案件调查中段
  authority: primary
initialization_sources:
- id: initial_state
  scope: 仅用于没有前史互动支持的默认neutral关系、基础健康值和默认Player会面状态；不得支持知识、强关系、案件目标或特权
- id: pre_ev_qin_arrival
  fact: 秦风因警校面试失利抵达曼谷，并与远房表舅唐仁会合
- id: pre_ev_a_xiang_lodging
  fact: 阿香是唐仁的房东，唐仁在其住所租住；阿香允许唐仁接待秦风进入指定生活与会面区域
- id: pre_ev_tang_agency
  fact: 唐仁已经在曼谷唐人街经营侦探社，以抓小三、找人找物和送货等委托维生
- id: pre_ev_tang_kuntai_acquaintance
  fact: 唐仁与担任刑警探长的坤泰在唐人街事务中已有私人往来；双方知道彼此是熟人，但该往来不赋予唐仁任何警务权限
- id: pre_ev_police_rank_competition
  fact: 坤泰与黄兰登同为刑警探长，并竞争副局长职位
- id: pre_ev_police_authority
  fact: 曼谷警局刑警探长依法拥有警局受限区、承办卷宗和物证的职务访问权，民间人员默认不拥有这些权限
- id: pre_ev_si_nuo_diary
  fact: 思诺已经编写虚假日记并有意让养父李先生看到，以利用其扭曲依恋把行动引向跟踪自己的颂帕
data_constraints:
- 不得使用2015年电影《唐人街探案》案件调查中段之后发生的情节
- 不得混入《唐人街探案2》《唐人街探案3》或其他衍生作品内容
- 地点和物品只能来自当前来源范围及共享快照
- 当前状态严格限定在latest_included_event之后、first_excluded_event之前
- anchor_pool事件必须晚于Frozen初始化且不得晚于generated_timeline.end
- 世界事实不等于NPC或Player已知事实，知情必须来自亲历、明确披露或证据访问
- 默认Player仅拥有default_player_semantics.initial_knowledge与visibility显式授予的知识
- 每个cf_edit必须给出只改变关键原因的真实替代情形，不得写‘无’
- 无法可靠确认的细节宁可省略，不得伪造URL、章节号或集数
- 所有Anchor池事件必须按时间排序
- 只有入选Longitudinal层的角色才需要满足每角色10个正典Anchor
