world_id: world_026
source: 'My Little Pony: Friendship Is Magic (2010 animated series), S01E01-S01E14'
events:
- id: anch_001
  episode_order: 2
  event_order: 1
  source_location: S01E02, Castle of the Two Sisters confrontation
  fact: Twilight recognizes that she and her five companions embody the six Elements
    of Harmony, and together they defeat Nightmare Moon.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: The six ponies know that their friendship can activate the Elements
    of Harmony and regard one another as friends.
  cf_edit: Twilight fails to recognize the six embodied Elements, so the group cannot
    activate them.
  anchor_for: [twilight_sparkle]
- id: anch_002
  episode_order: 2
  event_order: 2
  source_location: S01E02, Ponyville reunion at the episode ending
  fact: Princess Celestia allows Twilight to remain in Ponyville and assigns her to
    continue studying friendship.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: Twilight becomes a Ponyville resident with an ongoing friendship-study
    assignment.
  cf_edit: Celestia recalls Twilight to Canterlot instead of permitting her to stay.
  anchor_for: [twilight_sparkle]
- id: anch_003
  episode_order: 3
  event_order: 1
  source_location: S01E03, Sweet Apple Acres opening
  fact: Twilight receives two Grand Galloping Gala tickets while helping Applejack.
  known_by: [twilight_sparkle, applejack]
  state_change: Twilight controls one spare Gala invitation and must decide whom,
    if anyone, to invite.
  cf_edit: Twilight receives exactly one ticket, leaving no spare invitation to allocate.
  anchor_for: [twilight_sparkle]
- id: anch_004
  episode_order: 3
  event_order: 2
  source_location: S01E03, Golden Oaks Library ending
  fact: Twilight returns both tickets rather than choose among her friends; Celestia
    then sends enough invitations for the whole group.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: All six know they are invited to the Gala, and Twilight no longer
    controls a scarce spare ticket.
  cf_edit: Celestia sends no additional tickets after Twilight returns the original
    pair.
  anchor_for: [twilight_sparkle]
- id: anch_005
  episode_order: 4
  event_order: 1
  source_location: S01E04, Sweet Apple Acres after Big McIntosh's injury
  fact: Applejack promises to harvest the orchard alone and repeatedly refuses Twilight's
    offer of help.
  known_by: [applejack, twilight_sparkle]
  state_change: Applejack has an active solo-harvest commitment and is unwilling to
    delegate it.
  cf_edit: Applejack accepts Twilight's first offer of help instead of committing
    to work alone.
  anchor_for: [applejack]
- id: anch_006
  episode_order: 4
  event_order: 2
  source_location: S01E04, Sweet Apple Acres final harvest scene
  fact: After exhaustion and failed chores expose that much of the orchard remains,
    Applejack accepts help from all five friends.
  known_by: [applejack, twilight_sparkle, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: Applejack's solo-harvest commitment closes and group assistance is
    permitted.
  cf_edit: The remaining orchard is already harvested, so Applejack does not accept
    group assistance.
  anchor_for: [applejack]
- id: anch_007
  episode_order: 5
  event_order: 1
  source_location: S01E05, prank sequence around Ponyville
  fact: Pinkie Pie and Rainbow Dash agree to play harmless pranks together while
    avoiding targets who would be hurt by them.
  known_by: [pinkie_pie, rainbow_dash]
  state_change: Pinkie and Rainbow establish a shared harmless-prank activity and
    a limit against distressing Fluttershy.
  cf_edit: Rainbow refuses Pinkie's invitation to prank together.
  anchor_for: [pinkie_pie]
- id: anch_008
  episode_order: 5
  event_order: 2
  source_location: S01E05, Gilda's party at Sugarcube Corner
  fact: Rainbow learns Gilda bullied Pinkie and Fluttershy, rejects that conduct,
    and Gilda leaves the party.
  known_by: [pinkie_pie, rainbow_dash, fluttershy, twilight_sparkle, applejack, rarity]
  state_change: Rainbow withdraws support from Gilda's bullying and affirms her Ponyville
    friends.
  cf_edit: Rainbow does not learn that Gilda bullied Pinkie and Fluttershy.
  anchor_for: [rainbow_dash]
- id: anch_009
  episode_order: 6
  event_order: 1
  source_location: S01E06, Trixie's stage and Ursa Minor attack
  fact: Trixie admits she did not defeat an Ursa Major after failing to stop the Ursa
    Minor brought into Ponyville.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity]
  state_change: The witnesses know Trixie's Ursa Major claim is false.
  cf_edit: Trixie demonstrates verifiable evidence that she previously defeated an
    Ursa Major.
  anchor_for: [twilight_sparkle]
- id: anch_010
  episode_order: 6
  event_order: 2
  source_location: S01E06, Ponyville after Twilight returns the Ursa Minor
  fact: Twilight safely returns the Ursa Minor to its cave, and her friends explain
    that using talent to help others is not boastful.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity]
  state_change: Twilight is willing to use powerful magic openly when it is needed
    to protect others.
  cf_edit: Twilight's friends condemn her rescue magic as boastful instead of reassuring
    her.
  anchor_for: [twilight_sparkle]
- id: anch_011
  episode_order: 7
  event_order: 1
  source_location: S01E07, Golden Oaks Library mission briefing
  fact: Celestia tasks Twilight and her friends with persuading a sleeping dragon
    to leave before its smoke covers Equestria.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: The six acquire an active joint commitment to make the dragon relocate.
  cf_edit: Celestia reports that the smoke is harmless and assigns no relocation mission.
  anchor_for: [fluttershy]
- id: anch_012
  episode_order: 7
  event_order: 2
  source_location: S01E07, dragon's mountain cave
  fact: Fluttershy confronts the dragon after it attacks her friends and persuades
    it to apologize and relocate.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: The dragon-relocation commitment is fulfilled, and the group knows
    Fluttershy can act firmly to protect others despite fear.
  cf_edit: The dragon agrees to leave before threatening Fluttershy's friends, so
    Fluttershy never has to confront it.
  anchor_for: [fluttershy]
- id: anch_013
  episode_order: 8
  event_order: 1
  source_location: S01E08, storm preparations and Golden Oaks Library
  fact: Applejack and Rarity's dispute over practical versus tidy storm work continues
    after Twilight invites them into the library.
  known_by: [applejack, rarity, twilight_sparkle]
  state_change: Applejack and Rarity are in an unresolved task-method conflict during
    the storm.
  cf_edit: Applejack and Rarity agree on the storm work method before entering the
    library.
  anchor_for: [rarity]
- id: anch_014
  episode_order: 8
  event_order: 2
  source_location: S01E08, Golden Oaks Library after a tree falls through the window
  fact: Applejack apologizes and works with Rarity to remove the fallen tree, ending
    their dispute.
  known_by: [applejack, rarity, twilight_sparkle]
  state_change: Their storm-work conflict closes and each accepts the other's different
    practical strengths.
  cf_edit: Applejack does not apologize after the tree falls, so the storm-work dispute
    remains unresolved at the scene ending.
  anchor_for: [applejack, rarity]
- id: anch_015
  episode_order: 9
  event_order: 1
  source_location: S01E09, Everfree Forest Poison Joke patch
  fact: The six walk through blue flowers after dismissing Zecora's warning, then
    develop strange symptoms and blame Zecora.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: The six hold a provisional but mistaken belief that Zecora cursed
    them.
  cf_edit: The six heed Zecora's warning and avoid touching the blue flowers.
  anchor_for: [twilight_sparkle]
- id: anch_016
  episode_order: 9
  event_order: 2
  source_location: S01E09, Zecora's hut and Ponyville spa
  fact: Zecora explains that Poison Joke caused the symptoms and provides the remedy;
    the six apologize for judging her.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: The provisional curse belief closes when Zecora's remedy cures the
    symptoms and confirms Poison Joke as their cause; hostility toward Zecora is withdrawn.
  cf_edit: Zecora's herbal bath fails to cure the symptoms, so its efficacy does
    not confirm her Poison Joke explanation and the provisional belief remains unresolved.
  anchor_for: [twilight_sparkle]
- id: anch_017
  episode_order: 10
  event_order: 1
  source_location: S01E10, Fluttershy's cottage after the first removal attempt
  fact: Fluttershy secretly keeps one parasprite, which reproduces into a new swarm
    after the others believe the creatures were removed.
  known_by: [fluttershy]
  state_change: Fluttershy privately knows her choice caused the renewed infestation;
    the others do not know this before the swarm emerges.
  cf_edit: Fluttershy releases every parasprite during the first removal attempt.
  anchor_for: [fluttershy]
- id: anch_018
  episode_order: 10
  event_order: 2
  source_location: S01E10, Ponyville street at Princess Celestia's arrival
  fact: Pinkie assembles instruments and leads the parasprite swarm out of Ponyville.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: The infestation is removed, and the group knows Pinkie's ignored
    instrument requests were part of a working plan.
  cf_edit: Pinkie cannot obtain the final instrument needed to lead the swarm away.
  anchor_for: [pinkie_pie]
- id: anch_019
  episode_order: 11
  event_order: 1
  source_location: S01E11, Winter Wrap Up after team leaders report delays
  fact: Twilight identifies scheduling bottlenecks and is asked to organize the delayed
    Winter Wrap Up.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: Twilight receives coordination authority over the remaining Winter
    Wrap Up work.
  cf_edit: The teams are already on schedule and do not ask Twilight to coordinate.
  anchor_for: [twilight_sparkle]
- id: anch_020
  episode_order: 11
  event_order: 2
  source_location: S01E11, Ponyville after Winter Wrap Up finishes on time
  fact: Mayor Mare gives Twilight an all-team vest and appoints her official organizer
    for future Winter Wrap Ups.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: Twilight gains an ongoing public Winter Wrap Up organizer role.
  cf_edit: The reorganization misses the deadline, so Mayor Mare grants Twilight
    no future organizer role.
  anchor_for: [twilight_sparkle]
- id: anch_021
  episode_order: 13
  event_order: 1
  source_location: S01E13, Iron Pony competition at Sweet Apple Acres
  fact: Rainbow uses her wings to win later contests; Applejack disputes the fairness
    and challenges her to the Running of the Leaves without wing use.
  known_by: [applejack, rainbow_dash, twilight_sparkle, pinkie_pie]
  state_change: Applejack and Rainbow enter an active no-wing race commitment to settle
    their athletic dispute.
  cf_edit: Rainbow competes without using her wings, so Applejack does not challenge
    the result as unfair.
  anchor_for: [applejack, rainbow_dash]
- id: anch_022
  episode_order: 13
  event_order: 2
  source_location: S01E13, Running of the Leaves finish
  fact: Applejack and Rainbow learn they tied for last after sabotaging each other,
    apologize, and agree friendship matters more than winning.
  known_by: [applejack, rainbow_dash, twilight_sparkle, pinkie_pie]
  state_change: The no-wing race commitment and athletic dispute close; both commit
    to fairer friendly competition.
  cf_edit: Applejack and Rainbow do not sabotage one another, so there is no shared
    race misconduct for them to acknowledge and correct at the finish.
  anchor_for: [applejack, rainbow_dash]
- id: anch_023
  episode_order: 14
  event_order: 1
  source_location: S01E14, Carousel Boutique revised-dress fashion show
  fact: Rarity finishes the five revised dresses specified by her friends before
    their public fashion show, where the designs receive a disastrous response.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: Rarity's commitment to make the five requested revisions is complete;
    the failed show gives all six direct evidence that overriding her design judgment
    produced an unacceptable result and creates a need to repair the harm.
  cf_edit: The same five revised dresses receive a positive public response, so the
    show provides no evidence that the friends' specifications harmed Rarity's work.
  anchor_for: [rarity]
- id: anch_024
  episode_order: 14
  event_order: 2
  source_location: S01E14, Carousel Boutique apology, second fashion show, and ending
  fact: The five friends apologize and complete Rarity's own unfinished Gala dress
    from her design as a repair gesture; after the restored original designs succeed
    in a second show, Hoity Toity orders twelve of each design by the following Tuesday.
  known_by: [twilight_sparkle, applejack, pinkie_pie, rainbow_dash, rarity, fluttershy]
  state_change: The friends' repair effort closes, the six original-design Gala dresses
    are complete, her friends defer to Rarity's design judgment, and Rarity acquires
    a new active commitment to produce Hoity Toity's bulk order by the following Tuesday.
  cf_edit: Hoity Toity praises the restored original designs but places no bulk order,
    so Rarity acquires no deadline-bound production commitment.
  anchor_for: [rarity]
