- item_id: anchor_pool.anch_024.event_boundary_and_lifecycle
  severity: major
  rule_id: event_boundary_exact
  evidence: S01E14中五位朋友道歉后完成的是Rarity自己尚未完成的一套Gala礼服；随后由六位朋友穿着Rarity原始设计进行复展示，结尾Hoity Toity要求Rarity在下周二前为每款制作十二套。anch_024却写成朋友们帮助完成六套替代礼服，并把早已在失败时装秀前完成的“revision commitment”延迟到结尾才关闭，既错置事件对象也遗漏结尾新承诺。
  required_change: 按剧集顺序重写anch_023/anch_024边界与状态生命周期：朋友指定的改版礼服在失败时装秀前已完成；朋友们后来完成Rarity自己的礼服并道歉；原始设计复展示成功后，记录Hoity Toity的批量订单及其新生效的限时制作承诺。同步校准canon快照事实、Profile和Frozen。
  resolution: 已将anch_023边界移到改版礼服已完成且首场秀失败，明确改版承诺在此关闭并产生修复需要；anch_024依次记录道歉、五位朋友完成Rarity自己的未完成礼服、原始设计复展示成功及Hoity Toity下达每款十二套且下周二到期的订单。canon.sf_rarity_designer、Rarity Profile、环境物品及六份Frozen知识已同步，Rarity Frozen新增active批量订单承诺和目标。
  status: fixed

