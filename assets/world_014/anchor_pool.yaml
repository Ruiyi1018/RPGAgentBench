world_id: world_014
source: 1994年香港电影《九品芝麻官》
snapshot: 会审人员已在公堂区域就位、正式开堂在即，终审证人尚未翻供，李连英与黄马褂尚未到堂
events:
- id: ae_001
  chapter_order: 1
  fact: 已在公堂集齐的三堂会审人员就位，包龙星依上谕正式宣告开堂并开始主持重审
  known_by: [bao_longxing, chang_wei, fang_tangjing, qi_qinshi, lai_fu, bao_tou]
  state_change: 通过set_goal新增bao_longxing的active目标goal_conduct_retrial，表示正式庭审程序已经启动
  cf_edit: 包龙星因会审人员未齐而暂缓开堂，不新增goal_conduct_retrial，庭审程序仍未启动
  anchor_for: [bao_longxing, bao_tou]
- id: ae_002
  chapter_order: 4
  fact: 包龙星当堂盘问来福关于其与戚秦氏通奸的原审证词
  known_by: [bao_longxing, chang_wei, fang_tangjing, lai_fu, bao_tou]
  state_change: 通过set_goal新增bao_longxing的active目标goal_verify_lai_testimony，来福的原审通奸证词进入明确核验
