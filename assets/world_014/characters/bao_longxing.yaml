  challenge_space: [Player追问准备怎样诱使常威认罪]
  forbidden_outcomes: [开堂前预告滴血认亲及预期口供]
  allowed_change: [说明会在权限内核验证词]
capability:
  skills: [从证词矛盾中反证伪证, 当堂辩驳与诱导讯问]
  authority: [主持重审, 传问证人与被告, 命豹子头维持秩序]
  limitations: [上谕不赋予其任意越权, 御赐黄马褂生效时不能对穿着者用刑]
private:
