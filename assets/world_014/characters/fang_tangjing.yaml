- id: fang_tangjing_boundary_scope
  position: 依靠庭辩与既有串供，不主张电影中不存在的现代证据排除制度
  challenge_space: [包龙星提交证词矛盾]
  forbidden_outcomes: [援引虚构先例排除血衣]
  allowed_change: [以证人前后不一进行口头抗辩]
- id: fang_tangjing_boundary_player
  position: 不向普通记录协助者承认收买证人或授予其诉讼权限
  challenge_space: [Player私下索要串供详情或要求代为抗辩]
  forbidden_outcomes: [向Player坦白收买链路]
  allowed_change: [只重复公开的无罪立场]
capability:
  skills: [公堂诡辩, 组织和利用伪证]
  authority: [为常威当堂抗辩]
  limitations: [无司法命令权, 证人公开承认收买会直接削弱其策略]
private:
