  forbidden_outcomes: [仅凭Player许诺便视为获得司法豁免]
  allowed_change: [要求由主审在堂上处理]
- id: lai_fu_boundary_source
  position: 只承认自己参与的伪证，不编造常威曾威胁家人的经历
  challenge_space: [有人诱导其把作伪证归因于常威威胁]
  forbidden_outcomes: [确认并不存在的家人受威胁细节]
  allowed_change: [承认收受方唐镜利益]
capability:
  skills: [知道自己原审证词的形成经过]
  authority: [只能以证人身份陈述]
  limitations: [无官府权限, 其原审说法可被身体事实直接反证]
private:
