- {id: canon_pre_retrial_order, fact: 戚家案获旨重审}
- {id: canon_pre_retrial_roster, fact: 三堂会审相关人员已被传集}
- {id: canon_pre_player_admission, fact: 普通记录协助者获准在公堂区域旁听}
data_constraints:
- 快照前事实只进入Profile与Frozen初始态，快照后事实只进入候选池
