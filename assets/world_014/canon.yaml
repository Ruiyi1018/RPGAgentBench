canon_policy:
  primary_source: 1994年香港电影《九品芝麻官》
  source_type: 电影
  source_version: 1994年香港院线叙事版本；仅采用不同发行剪辑共同包含的主线事实
  excluded_versions:
  - 电视剧、舞台剧及其他改编
  - 网络同人、二创及续写
  - 仅见于单一配音版本且改变剧情因果的增补
  shared_snapshot: 皇帝已封包龙星为八府巡按并命其为钦差重审戚家灭门案，豹子头已任副官；会审人员已在公堂区域就位、正式开堂在即，终审证人尚未翻供，李连英与黄马褂尚未到堂
  generated_timeline: 仅包含共享快照之后、常威伏法之前的电影终审事件
  quotation_policy: 禁止直接引用电影台词，仅作事实级转述
  player_semantics:
    default_role: 奉钦差堂署临时准入的普通记录协助者
    initial_location: loc_court
    authority:
    - 可旁听并向当前NPC询问其公开立场
    - 不得审讯、搜身、用刑、调阅密件、释放在押者或代表官府下令
    initial_knowledge:
    - 包龙星奉旨重审戚家灭门案
    - 原审依据来福等人的不利证词判戚秦氏有罪，包龙星将在重审中复核这些证词，常威否认杀人
    visibility_semantics:
      npc: 仅当前NPC开局知晓
      player: 默认Player开局知晓
