data_constraints:
- 所有事实必须限定在《家有儿女》第一季第1至10集范围内
- 不得使用第一季第11集及以后、后续季、动画版、电影版或其他版本剧情
- 不做原作台词复制，只做事实级转述
- 集号仅用于锁定已核对的第1至10集顺序；不伪造日期、地点门牌号或URL
- 无法可靠确认的细节宁可省略
- Anchor池事件必须按从早到晚的时间排序
- 所有已知角色和地点、物品必须来自当前共享快照及来源范围
