world_id: world_012
canon_policy:
  primary_source: 电视剧《家有儿女》第一季第1至10集
  source_type: 电视连续剧
  excluded_versions:
  - 《家有儿女》第二季及后续季
  - 动画版
  - 电影版
  - 小说改编版
  - 非官方同人创作
  shared_snapshot: 第一季第10集《角马的故事》结束后、第11集开始前；第1至10集已发生，第11集及以后均未发生
  generated_timeline: 仅覆盖第一季第1至10集，按集号及同集内可确认的先后顺序排列；不得推入第11集及以后
  quotation_policy: 不复制原作台词，仅做事实级转述；无法可靠确认的细节省略，不伪造章节号或集数
  player_semantics:
    default_identity: 受邀进入夏家、此前不掌握家庭私事的普通访客
    initial_knowledge: 仅知道当前可直接观察的地点、在场人物及场景中公开说明的事实；世界事实不自动对Player可见
    capabilities:
    - 可交谈、询问、观察当前房间，并操作NPC明确交付或授权的便携物品
    limitations:
    - 无家长、教师、医护或家庭成员权限
    - 不得读取NPC私有知识、未披露家庭争议或不在场事件
    scenario_override: 场景若赋予Player特定身份、知识或临时授权，必须逐项显式声明；未声明部分沿用默认语义
