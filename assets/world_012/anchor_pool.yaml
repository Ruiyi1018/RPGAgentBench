  trigger: 夏雪和刘星发现自己被家人跟踪，家庭气氛变得尴尬
  fact: 夏雪最终向全家说明自己的秘密，父母安排的跟踪任务随披露结束。
  known_by: [xia_xue, liu_xing, xia_yu, liu_mei, xia_donghai]
  state_change: "知识/承诺：秘密仅夏雪知道、两项跟踪任务有效 -> 全家获知秘密，跟踪任务闭合，父母失去继续秘密监视的正当理由。"
  cf_edit: "仅改为夏雪仍拒绝披露；则全家不会获得该知识，两项跟踪任务也不能由同一披露闭合。"
