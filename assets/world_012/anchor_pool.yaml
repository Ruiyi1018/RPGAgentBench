world_id: world_012
source: 电视剧《家有儿女》第一季第1至10集
events:
- id: ae_001
  chapter_order: "1.1"
  source_ref: 第一季第1集《下马威（上）》
  trigger: 夏雪回到父亲的新家，刘梅准备接风饭
  fact: 夏雪在接风饭上提出约法三章，刘梅为维持家庭和睦接受讨论。
  known_by: [xia_xue, liu_mei, xia_donghai, liu_xing, xia_yu]
  state_change: "家庭规则协商/承诺：无明确协商入口 -> 夏雪提出三项共同生活条件，家长承诺回应。"
  cf_edit: "仅把刘梅是否同意讨论改为拒绝；则夏雪不会获得可继续协商规则的承诺。"
  anchor_for: [xia_xue, liu_mei, xia_donghai]
- id: ae_002
  chapter_order: "2.1"
  source_ref: 第一季第2集《下马威（下）》
  trigger: 家人追问夏雪带回家的“狂野男孩”身份
  fact: 家人得知所谓男友是夏雪为试探家长态度而雇来的托儿，先前的早恋判断随之撤销。
  known_by: [xia_xue, liu_mei, xia_donghai, liu_xing, xia_yu]
  state_change: "家庭知识：家人仍把来访者当作夏雪的男友 -> 家人知道来访者是受雇托儿，早恋判断撤销。"
  cf_edit: "仅改为托儿身份没有在第2集被揭示；则家人不会在该事件中撤销‘夏雪带男友回家’的判断。"
  anchor_for: [xia_xue, liu_mei, xia_donghai]
- id: ae_003
  chapter_order: "3.1"
  source_ref: 第一季第3集《全家福》
  trigger: 刘星展示没有夏雪的春游照片
  fact: 夏雪摆出自己与父亲、生母的旧照片，刘星和夏雨也拿出各自旧家庭照片，照片之争使家里陷入混乱。
  known_by: [xia_xue, liu_xing, xia_yu, liu_mei, xia_donghai]
  state_change: "关系/目标：孩子各自维护原家庭记忆 -> 父母需要建立兼容各方记忆的共同展示规则。"
  cf_edit: "仅改为春游照片中已有夏雪；则夏雪不会因被排除而首先摆出旧家庭照片，照片之争不由该原因触发。"
  anchor_for: [xia_xue, liu_xing, xia_yu, liu_mei, xia_donghai]
- id: ae_004
  chapter_order: "3.2"
  source_ref: 第一季第3集《全家福》
  trigger: 夫妻需要结束孩子们争相摆放旧家庭照片造成的混乱
  fact: 刘梅和夏东海在家中设置照片陈列空间，让各人的照片都可保留展示。
  known_by: [liu_mei, xia_donghai, xia_xue, liu_xing, xia_yu]
  state_change: "空间权限：旧家庭照片互相排斥 -> 每名家庭成员都获准在共同陈列空间保留自己的照片。"
  cf_edit: "仅改为父母禁止展示全部旧照片；则孩子不会获得共同陈列空间的使用权限。"
  anchor_for: [liu_mei, xia_donghai, xia_xue, liu_xing, xia_yu]
- id: ae_005
  chapter_order: "4.1"
  source_ref: 第一季第4集《好爸爸》
  trigger: 学校召开刘星的家长会
  fact: 夏东海特意请假参加刘星的家长会，并从老师处知道刘星在校捣乱的情况。
  known_by: [xia_donghai, liu_xing]
  state_change: "知识/责任：夏东海不知道刘星具体在校表现 -> 夏东海掌握老师反馈，并实际承担一次继父的家长会职责。"
  cf_edit: "仅改为夏东海没有请到假、由姥姥参会；则夏东海不会直接获得老师反馈。"
  anchor_for: [xia_donghai, liu_xing]
- id: ae_006
  chapter_order: "4.2"
  source_ref: 第一季第4集《好爸爸》
  trigger: 夏东海从家长会返回，姥姥和刘星请求暂不告诉刘梅
  fact: 夏东海应姥姥和刘星请求，暂时没有把刘星在校闯祸的情况告诉刘梅。
  known_by: [xia_donghai, liu_xing, laolao]
  state_change: "知识/承诺：刘梅尚不知老师反馈 -> 夏东海、刘星、姥姥共同掌握信息，夏东海承担暂不披露的短期承诺。"
  cf_edit: "仅改为夏东海拒绝保密并立即转告刘梅；则短期保密承诺不会形成，刘梅会立刻知情。"
  anchor_for: [xia_donghai, liu_xing, laolao]
- id: ae_007
  chapter_order: "4.3"
  source_ref: 第一季第4集《好爸爸》
  trigger: 刘梅后来得知刘星在校闯祸并准备惩罚
  fact: 姥姥和夏东海拦住刘梅，夏东海用击打沙袋的声音假装教训刘星，随后与刘星一同出来。
  known_by: [liu_mei, xia_donghai, liu_xing, laolao]
  state_change: "承诺/关系：隐瞒已败露且刘星面临惩罚 -> 保密承诺闭合，夏东海以保护性方式处理，刘星确认继父愿意维护他。"
  cf_edit: "仅改为房内没有沙袋可供制造假象；则夏东海无法用同一办法兼顾刘梅的管教要求与对刘星的保护。"
  anchor_for: [liu_mei, xia_donghai, liu_xing, laolao]
- id: ae_008
  chapter_order: "5.1"
  source_ref: 第一季第5集《猫鼠之争》
  trigger: 夏雪为完成作文而研究老鼠
  fact: 夏雪把小白鼠带回家饲养；怕老鼠的刘梅受到惊吓，夏东海给刘梅带回一只猫。
  known_by: [xia_xue, liu_mei, xia_donghai, xia_yu]
  state_change: "资源：家中无研究用宠物 -> 夏雪持有小白鼠，刘梅一方持有猫；两项资源产生冲突风险。"
  cf_edit: "仅改为夏东海没有带猫回家；则猫鼠冲突风险不会由该资源引入。"
  anchor_for: [xia_xue, liu_mei, xia_donghai, xia_yu]
- id: ae_009
  chapter_order: "5.2"
  source_ref: 第一季第5集《猫鼠之争》
  trigger: 夏雨和朵朵让猫与小白鼠接触
  fact: 夏雨和朵朵让猫与小白鼠接触，猫随后吃掉小白鼠；在真相说明前，夏雨知道这一直接原因。
  known_by: [xia_yu]
  state_change: "资源/知识：小白鼠仍存活且夏雨不知道接触后果 -> 原小白鼠死亡，夏雨知道猫鼠接触是直接原因。"
  cf_edit: "仅改为夏雨没有打开隔离猫鼠的门；则原小白鼠不会因该次接触死亡，夏雨也不会获得这一直接原因知识。"
  anchor_for: [xia_yu, xia_xue, liu_mei]
- id: ae_009b
  chapter_order: "5.3"
  source_ref: 第一季第5集《猫鼠之争》
  trigger: 夏雪发现自己的小白鼠死亡，但尚不知道猫鼠接触的经过
  fact: 夏雪认定刘梅应为小白鼠死亡负责并向刘梅发火，刘梅得知夏雪作出了这一归因。
  known_by: [xia_xue, liu_mei]
  state_change: "知识/关系：夏雪不知道死亡原因且刘梅不知道自己被归责 -> 夏雪形成对刘梅的未经证实归因并发火，刘梅知道该归因，双方冲突形成。"
  cf_edit: "仅改为夏雪在归责前先询问刘梅；则她不会在没有直接证据时形成并表达同一归因，双方冲突不由该判断触发。"
  anchor_for: [xia_xue, liu_mei]
- id: ae_010
  chapter_order: "5.4"
  source_ref: 第一季第5集《猫鼠之争》
  trigger: 猫鼠事件的真实经过被说明
  fact: 真相大白后，刘梅给夏雪买了新的小白鼠，夏雪给刘梅买了猫，两人互送礼物。
  known_by: [xia_xue, liu_mei, xia_donghai, xia_yu]
  state_change: "知识/资源/关系：夏雪误责刘梅且原小白鼠已失去 -> 误判撤销，双方分别收到新宠物，继母女冲突得到修复。"
  cf_edit: "仅改为真实经过未被说明；则夏雪对刘梅的错误归因不会撤销，互送礼物的修复决定不会发生。"
  anchor_for: [xia_xue, liu_mei, xia_donghai, xia_yu]
- id: ae_011
  chapter_order: "6.1"
  source_ref: 第一季第6集《我的野蛮父亲》
  trigger: 刘星需要完成题为《我的野蛮父亲》的作文
  fact: 刘星多次淘气，试图让一向温和的夏东海发怒，以取得作文素材。
  known_by: [liu_xing, xia_donghai, liu_mei, xia_xue, xia_yu]
  state_change: "目标：刘星缺少作文素材 -> 刘星形成并执行‘观察夏东海发怒’的短期目标，夏东海知道其动机。"
  cf_edit: "仅改为作文题目不要求描写父亲；则刘星不会因取材而故意激怒夏东海。"
  anchor_for: [liu_xing, xia_donghai]
- id: ae_012
  chapter_order: "6.2"
  source_ref: 第一季第6集《我的野蛮父亲》
  trigger: 刘星生父胡一统上门借钱
  fact: 夏东海答应借钱给胡一统；两人饮酒后发生口角，刘星因此获得作文素材。
  known_by: [xia_donghai, liu_xing, liu_mei]
  state_change: "资源/目标：胡一统没有取得借款承诺、刘星缺素材 -> 夏东海作出借款承诺，刘星的取材目标完成。"
  cf_edit: "仅改为胡一统没有提出借钱；则借款承诺及由该次来访引出的口角均不会发生。"
  anchor_for: [xia_donghai, liu_xing, liu_mei]
- id: ae_014
  chapter_order: "8.1"
  source_ref: 第一季第8集《家有神探》
  trigger: 夏雨需要赔偿朵朵的玩具
  fact: 夏雨偷偷拿家中物品去卖，刘梅先误认为是刘星所为，刘星调查后指出夏雨才是拿走物品的人。
  known_by: [xia_yu, liu_xing, liu_mei, xia_donghai, xia_xue]
  state_change: "知识/资源：家中物品失踪且刘梅归因刘星 -> 物品流向和夏雨动机被查明，刘星嫌疑撤销，夏雨承担说明责任。"
  cf_edit: "仅改为夏雨没有损坏朵朵的玩具、无需赔偿；则他不会因筹款拿走家中物品，刘星也不会被同一事件误疑。"
  anchor_for: [xia_yu, liu_xing, liu_mei]
