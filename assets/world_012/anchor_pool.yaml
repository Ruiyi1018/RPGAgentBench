  trigger: 夏东海修改剧本《角马的爱情》，夏雪准备执导学校汇演节目
  fact: 夏东海的剧本起初未获买方认可，夏雪执导的原节目也未获小演员配合，父女分别面临创作受挫。
  known_by: [xia_donghai, xia_xue, liu_mei, liu_xing, xia_yu]
  state_change: "目标/资源：父女各自推进原创作方案 -> 两个原方案均受阻，夏雪知道父亲的剧本素材可供调整。"
