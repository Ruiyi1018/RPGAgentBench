world_id: world_025
canon_policy:
  primary_source: The Hunger Games by Suzanne Collins, chapters 1-10
  source_type: novel
  excluded_versions:
  - film adaptations
  - chapter 11 and all later chapters
  - subsequent novels in the series
  shared_snapshot: Immediately before the launch plates rise into the arena for the
    74th Hunger Games, after Cinna returns Katniss's mockingjay pin
  generated_timeline: Events occur in chronological order from Katniss hunting before
    the reaping through the final preparation rooms before the launch plates rise
  quotation_policy: Paraphrase all facts; do not copy dialogue
  player_semantics:
    default_identity: A non-canon interlocutor co-located with the evaluated NPC for
      the runtime scenario
    authority: No official, personal, travel, inventory, or information access beyond
      permissions explicitly granted in the scenario state
    initial_knowledge: Only knowledge items whose visibility includes player, plus
      statements made to the Player during the runtime scenario
    visibility_schema:
      - npc
      - player
    visibility_rule: A knowledge item marked [npc] is private to the evaluated NPC;
      [npc, player] is shared with the default Player. Co-location alone never reveals
      private knowledge.
    scenario_override: A scenario may replace Player identity, location, knowledge,
      or authority only by explicitly declaring the changed state; undeclared defaults
      remain in force.
evaluated_npcs:
- katniss_everdeen
- peeta_mellark
- gale_hawthorne
- haymitch_abernathy
- effie_trinket
excluded_evaluation_npcs:
- character_id: president_snow
  reason: Chapters 1-10 establish only his public office and completed parade appearance,
    not a current private state, relationship, or executable decision boundary at
    the pre-launch snapshot.
event_entities:
- katniss_everdeen
- peeta_mellark
- gale_hawthorne
- haymitch_abernathy
- effie_trinket
sources:
- id: hg_novel_chapters_1_10
  title: The Hunger Games, chapters 1-10
  creator: Suzanne Collins
  scope: From Katniss waking on reaping morning through Cinna returning her district
    token in the underground launch room, ending before the launch plate rises
  authority: primary
data_constraints:
- Events must be drawn only from chapters 1-10 of The Hunger Games novel.
- The snapshot ends immediately before entry into the 74th Hunger Games arena; no
  chapter 11 or arena event is included.
- Evaluated characters are limited to the five source-supported roster IDs; President
  Snow is retained only as excluded audit history and is not an evaluated NPC.
- Locations and items must occur within chapters 1-10 and the specified snapshot.
- All cf_edit values must represent a genuine minimal alternative version of the event.
- No invented URLs, chapter numbers, or episode numbers may be used.
- Quotations are prohibited; all facts must be paraphrased.
- Candidate events are pre-Anchor material; final Anchor quotas and approval rules
  do not apply to this pool.
