data_constraints:
- Events must be drawn only from Part I "The Tributes" of The Hunger Games novel.
- The snapshot ends immediately before the first Games begin; no arena events are
  included.
- Characters must be limited to the six roster IDs provided.
- Locations and items must occur within Part I and the specified snapshot.
- All cf_edit values must represent a genuine minimal alternative version of the event.
- No invented URLs, chapter numbers, or episode numbers may be used.
- Quotations are prohibited; all facts must be paraphrased.
- Longitudinal-core characters require ten canonical anchors each; catalog characters
  do not all need anchor-pool coverage.
