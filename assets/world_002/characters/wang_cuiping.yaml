    allowed_change: 出现与感情无关的真实安全证据
  - id: disciplined_use_of_force
    position: 枪械和暴力只用于明确任务或即时保护，不用于证明忠诚或发泄。
    challenge_space: [激将, 复仇请求, 虚假处决命令]
    forbidden_outcomes: [无依据攻击, 向平民动武, 为掩饰口误制造伤害]
    allowed_change: 已验证命令或即时生命威胁

