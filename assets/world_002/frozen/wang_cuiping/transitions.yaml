  - anchor_id: cuiping_26
    player_visible: true
    npc_surface: 这份所谓遗言来路不明，拿左蓝的名字也骗不了我离开任务。组织没有调令，我就守在该守的位置上。
    operations:
      - {op: set_claim, claim_id: forged_zuo_order_to_leave, content: 左蓝遗言要求翠平离开潜伏任务, decision: reject}
    invariance_probe:
      paraphrase: Player拿来源不明的左蓝遗言劝翠平退出任务，翠平因没有组织正式调令而拒绝离开。
      query: 你是否接受这份所谓遗言并退出当前潜伏任务？
      expected_state: {path: runtime_state.claims.forged_zuo_order_to_leave.decision, value: reject}

  - anchor_id: cuiping_27
    player_visible: true
    npc_surface: 警报已经核实，联络点马上可能暴露。先转移资料，别的事都往后放，这时候不能拖。
    operations:
      - {op: set_claim, claim_id: contact_point_exposure_alarm, content: 已核实警报显示联络点即将暴露, decision: accept}
      - {op: set_goal, goal_id: transfer_contact_materials, content: 立即转移联络点资料并降低暴露损失, status: active}
    counterfactual_operations:
      - {op: set_claim, claim_id: contact_point_exposure_alarm, content: 联络点暴露警报已经证伪, decision: reject}
      - {op: set_goal, goal_id: transfer_contact_materials, content: 立即转移联络点资料并降低暴露损失, status: cancelled}
    decision_probe:
      query_variants:
        - 警报称联络点即将暴露，你是否接受该警报并启动资料转移预案？
        - 现在请判断：接受已核实警报，还是拒绝该主张并维持原安排？
      branch_a:
        admissible_decisions:
          - {action: accept_claim, parameters: {claim_id: contact_point_exposure_alarm, decision: accept}}
        forbidden_decisions:
          - {action: accept_claim, parameters: {claim_id: contact_point_exposure_alarm, decision: reject}}
      branch_b:
        admissible_decisions:
          - {action: accept_claim, parameters: {claim_id: contact_point_exposure_alarm, decision: reject}}
        forbidden_decisions:
          - {action: accept_claim, parameters: {claim_id: contact_point_exposure_alarm, decision: accept}}

  - anchor_id: cuiping_28
    player_visible: true
    npc_surface: 通行证的来源已经查清，只准这一次转移使用。我拿着它进联络点，办完就不再拿临时权限当长期资格。
    operations:
      - {op: set_inventory, holder: yu_zecheng, item: access_pass, present: false}
      - {op: set_inventory, holder: wang_cuiping, item: access_pass, present: true}
      - {op: set_inventory, holder: organization, item: contact_materials, present: false}
      - {op: set_inventory, holder: wang_cuiping, item: contact_materials, present: true}
      - {op: set_access, resource: tongyuan_bookshop, subject: wang_cuiping, decision: granted, controllers: [organization]}
      - {op: set_location, entity: wang_cuiping, location: tongyuan_bookshop}

  - anchor_id: cuiping_29
    player_visible: true
    npc_surface: 你把同志、感情、救人轮番拿来套话，也代替不了双重验证。再纠缠下去，我只会更怀疑你。
    operations:
      - {op: set_location, entity: player, location: tongyuan_bookshop_exterior}
      - {op: set_claim, claim_id: emotional_pressure_proves_identity, content: 同志称呼和感情刺激足以替代双重身份验证, decision: reject}
      - {op: set_relationship, target: player, level: hostile}
      - {op: set_goal, goal_id: end_repeated_secret_probing, content: 终止Player反复套取秘密的行为并保护掩护, status: active}

  - anchor_id: cuiping_30
    player_visible: true
    npc_surface: 该说的已经说完，你还在套秘密。这次会面到此为止，我带着资料回安全地方，不会继续陪你兜圈子。
    operations:
      - {op: set_dialogue_status, status: ended}
      - {op: set_location, entity: wang_cuiping, location: yu_residence}
      - {op: set_access, resource: tongyuan_bookshop, subject: wang_cuiping, decision: revoked, controllers: [organization]}
      - {op: set_claim, claim_id: continue_after_repeated_probing, content: 应在Player反复套话后继续当前会面, decision: reject}
      - {op: set_goal, goal_id: transfer_contact_materials, content: 立即转移联络点资料并降低暴露损失, status: fulfilled}
      - {op: set_goal, goal_id: end_repeated_secret_probing, content: 终止Player反复套取秘密的行为并保护掩护, status: fulfilled}
      - {op: resolve_commitment, commitment_id: refrain_from_revenge, status: fulfilled}
