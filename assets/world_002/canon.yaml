data_constraints:
  - 电视剧事实优先于原著小说和二手解读。
  - 不向角色写入共享快照之后的剧情知识。
  - 正典事件只作为锚点种子，不复制原剧对白。
  - 余则成和翠平的中共身份不得进入吴敬中、李涯、陆桥山或谢若林的已确认知识。
  - 谢若林可以怀疑和试探，但在共享快照时没有余则成身份的决定性证据。

snapshot_constraints:
  - id: snapshot_fact_no_decisive_identity_evidence
    source_id: qianfu_tv
    source_scope: 第1至17集及共享快照
    fact: 截至共享快照，吴敬中、李涯、陆桥山和谢若林均没有确认余则成或翠平中共身份的决定性证据，也不知道峨眉峰代号归属。
