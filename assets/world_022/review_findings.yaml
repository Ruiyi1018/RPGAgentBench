  required_change: "只改变一个能阻止或改变餐厅设饵状态的原因，例如短信未成功发送或 John 拒绝借出手机，并给出由该单一变化导致的对应状态；不得把未知的持机者反应与两人的决定捆绑修改。"
  resolution: "将 ae_13 的反事实收窄为单一权限变化：John 拒绝借出手机，因此诱饵短信未发送且不会形成餐厅会面；正文同步明确短信在 221B 成功发出及随后等待承诺，不再假定未知持机者是否回应。"
  status: fixed
