world_id: world_022
source: 'Sherlock: A Study in Pink (2010)'
events:
- id: ae_01
  chapter_order: 1
  fact: John Watson has returned from Afghanistan and is living alone while adjusting
    to civilian life.
  location: john_bedsit
  known_by: [john_watson]
  state_change: John needs affordable housing and a workable civilian routine.
  cf_edit: John already has stable shared housing and does not need a flatmate.
  anchor_for: [john_watson]
- id: ae_02
  chapter_order: 3
  fact: Stamford introduces John Watson to Sherlock Holmes in a laboratory at St
    Bartholomew's Hospital.
  location: st_bartholomews_hospital
  known_by: [john_watson, sherlock_holmes]
  state_change: John and Sherlock become acquainted as prospective flatmates.
  cf_edit: Stamford leaves before introducing them.
  anchor_for: [john_watson, sherlock_holmes]
- id: ae_03
  chapter_order: 4
  fact: Sherlock deduces details of John's military and medical history from his
    appearance and phone, then proposes that they inspect a flat together.
  location: st_bartholomews_hospital
  known_by: [john_watson, sherlock_holmes]
  state_change: John gains direct evidence of Sherlock's deductive ability and accepts
    an invitation to inspect 221B.
  cf_edit: Sherlock makes no deductions and gives John no reason to pursue the flatshare.
  anchor_for: [john_watson, sherlock_holmes]
- id: ae_04
  chapter_order: 2
  fact: Molly Hooper observes Sherlock's riding-crop bruising experiment on a cadaver
    and records the time elapsed after death.
  location: st_bartholomews_hospital
  known_by: [molly_hooper, sherlock_holmes]
  state_change: Molly permits a bounded professional use of mortuary facilities while
    retaining responsibility for the body.
  cf_edit: Molly refuses use of the cadaver, preventing the experiment.
  anchor_for: [molly_hooper, sherlock_holmes]
- id: ae_05
  chapter_order: 5
  fact: Mrs Hudson shows John and Sherlock the available rooms at 221B Baker Street.
  location: 221b_baker_street
  known_by: [mrs_hudson, john_watson, sherlock_holmes]
  state_change: Mrs Hudson grants both men access to inspect the proposed home.
  cf_edit: Mrs Hudson declines to show them the flat.
  anchor_for: [mrs_hudson, john_watson, sherlock_holmes]
- id: ae_06
  chapter_order: 6
  fact: John and Sherlock agree to share 221B under Mrs Hudson's tenancy.
  location: 221b_baker_street
  known_by: [mrs_hudson, john_watson, sherlock_holmes]
  state_change: John and Sherlock become co-tenants and Mrs Hudson becomes their landlady.
  cf_edit: John decides not to take the room after inspecting it.
  anchor_for: [mrs_hudson, john_watson, sherlock_holmes]
- id: ae_07
  chapter_order: 7
  fact: Lestrade asks Sherlock to attend Lauriston Gardens after a fourth apparent
    suicide is reported.
  location: 221b_baker_street
  known_by: [greg_lestrade, sherlock_holmes, john_watson, mrs_hudson]
  state_change: Sherlock receives a police consultation and the household learns
    he is leaving on a serious case.
  cf_edit: Lestrade keeps the fourth death within the police team and does not consult
    Sherlock.
  anchor_for: [greg_lestrade, sherlock_holmes, mrs_hudson]
- id: ae_08
  chapter_order: 8
  fact: Sherlock invites John to accompany him to Lauriston Gardens because John
    is a doctor.
  location: 221b_baker_street
  known_by: [sherlock_holmes, john_watson]
  state_change: John accepts an informal role accompanying Sherlock without police
    authority.
  cf_edit: John declines and remains at 221B.
  anchor_for: [john_watson, sherlock_holmes]
- id: ae_09
  chapter_order: 9
  fact: Lestrade permits Sherlock into the Lauriston Gardens crime scene while John
    remains an unofficial companion.
  location: lauriston_gardens_crime_scene
  known_by: [greg_lestrade, sherlock_holmes, john_watson]
  state_change: Lestrade grants Sherlock temporary scene access but grants John no
    police powers.
  cf_edit: Lestrade denies Sherlock entry because he is a civilian.
  anchor_for: [greg_lestrade, sherlock_holmes, john_watson]
- id: ae_10
  chapter_order: 10
  fact: Sherlock establishes from the body and room that the fourth victim was left-handed
    and that the death does not fit an ordinary suicide.
  location: lauriston_gardens_crime_scene
  known_by: [sherlock_holmes, greg_lestrade, john_watson]
  state_change: The victim's handedness and evidence of another person's involvement
    become shared case knowledge.
  cf_edit: The physical details support an ordinary solitary suicide.
  anchor_for: [sherlock_holmes, greg_lestrade, john_watson]
- id: ae_11
  chapter_order: 11
  fact: Sherlock notices that the victim's distinctive pink suitcase is absent from
    the crime scene despite evidence that she travelled with it.
  location: lauriston_gardens_crime_scene
  known_by: [sherlock_holmes, greg_lestrade, john_watson]
  state_change: Recovering the missing suitcase becomes an active evidential goal.
  cf_edit: The suitcase remains beside the body and creates no missing-item lead.
  anchor_for: [sherlock_holmes, greg_lestrade]
- id: ae_12
  chapter_order: 16
  fact: Sherlock recovers the pink suitcase after searching the streets around Lauriston
    Gardens and brings it to 221B.
  location: 221b_baker_street
  known_by: [sherlock_holmes, john_watson]
  state_change: The pink suitcase is located at 221B under Sherlock's control for
    examination.
  cf_edit: Sherlock fails to locate the suitcase.
  anchor_for: [sherlock_holmes, john_watson]
- id: ae_13
  chapter_order: 17
  fact: At 221B, John lets Sherlock use his phone to send the fourth victim's missing
    pink phone a message proposing a meeting at Angelo's restaurant.
  location: 221b_baker_street
  known_by: [sherlock_holmes, john_watson]
  state_change: The lure message is successfully sent and the pair commit to waiting
    at Angelo's for its recipient.
  cf_edit: John refuses use of his phone, so the lure message is not sent and no restaurant
    rendezvous is created.
  anchor_for: [sherlock_holmes, john_watson]
- id: ae_14
  chapter_order: 18
  fact: Sherlock and John chase the taxi that appears at the arranged time through
    nearby streets, then discover its passenger is unrelated to the case.
  location: northumberland_street
  known_by: [sherlock_holmes, john_watson]
  state_change: The restaurant trap is resolved as a false lead while John demonstrates
    willingness to share physical risk.
  cf_edit: They record the taxi details instead of pursuing it on foot.
  anchor_for: [sherlock_holmes, john_watson]
- id: ae_15
  chapter_order: 19
  fact: After the chase, John states that Sherlock's deductive work is extraordinary.
  location: angelo_restaurant
  known_by: [sherlock_holmes, john_watson]
  state_change: John's stance toward Sherlock shifts from skeptical interest to guarded
    admiration.
  cf_edit: John dismisses the deductions as lucky guesses.
  anchor_for: [john_watson, sherlock_holmes]
- id: ae_16
  chapter_order: 12
  fact: Mycroft's assistant intercepts John and transports him to a controlled meeting
    in a derelict warehouse.
  location: derelict_warehouse
  known_by: [john_watson, mycroft_holmes]
  state_change: John loses control of the meeting location but remains free to question
    and refuse Mycroft.
  cf_edit: John refuses to enter the car and the warehouse meeting does not occur.
  anchor_for: [john_watson, mycroft_holmes]
- id: ae_17
  chapter_order: 13
  fact: Mycroft demonstrates detailed knowledge of John's service, therapy, finances,
    and recent movements before offering money for reports about Sherlock.
  location: derelict_warehouse
  known_by: [john_watson, mycroft_holmes]
  state_change: Mycroft makes an explicit recruitment offer and John learns that
    he is under extensive observation.
  cf_edit: Mycroft has only public biographical facts and cannot credibly pressure
    John.
  anchor_for: [john_watson, mycroft_holmes]
- id: ae_18
  chapter_order: 14
  fact: John refuses Mycroft's payment and does not agree to report on Sherlock.
  location: derelict_warehouse
  known_by: [john_watson, mycroft_holmes]
  state_change: Mycroft's recruitment offer is rejected and John's independence
    from the unknown official is established.
  cf_edit: John accepts the payment and commits to regular reports.
  anchor_for: [john_watson, mycroft_holmes]
- id: ae_19
  chapter_order: 15
  fact: John returns to 221B and tells Sherlock enough about the summons for Sherlock
    to recognize the encounter as Mycroft's interference, without explaining their
    family relationship to John.
  location: 221b_baker_street
  known_by: [john_watson, sherlock_holmes]
  state_change: Sherlock learns of Mycroft's approach while John still does not know
    Mycroft is Sherlock's brother.
  cf_edit: John conceals the warehouse meeting from Sherlock.
  anchor_for: [john_watson, sherlock_holmes]
- id: ae_20
  chapter_order: 20
  fact: Lestrade leads a police search of 221B under the stated pretext of looking
    for illegal drugs to pressure Sherlock into sharing evidence.
  location: 221b_baker_street
  known_by: [greg_lestrade, sherlock_holmes, john_watson, mrs_hudson]
  state_change: Lestrade temporarily exercises police search authority inside the
    flat, overriding the tenants' ordinary control of the rooms.
  cf_edit: Lestrade waits for Sherlock to volunteer the evidence and does not search
    221B.
  anchor_for: [greg_lestrade, sherlock_holmes, john_watson, mrs_hudson]
- id: ae_21
  chapter_order: 21
  fact: During the search Sherlock presents the recovered pink suitcase and explains
    why its absence from the body matters.
  location: 221b_baker_street
  known_by: [greg_lestrade, sherlock_holmes, john_watson]
  state_change: Lestrade gains access to the recovered suitcase and its evidential
    significance; control of it passes to the police search team.
  cf_edit: Sherlock keeps the suitcase hidden and Lestrade does not recover it.
  anchor_for: [greg_lestrade, sherlock_holmes, john_watson]
- id: ae_22
  chapter_order: 22
  fact: During the 221B search Sherlock explains that the victims swallowed poison
    themselves but that the murderer somehow compelled them; he does not yet know
    the means of coercion.
  location: 221b_baker_street
  known_by: [sherlock_holmes, john_watson, greg_lestrade]
  state_change: Voluntary ingestion under unknown coercion becomes the bounded working
    inference, while the poison, coercion method, and murderer remain unresolved.
  cf_edit: The physical evidence instead indicates that the victims unknowingly ingested
    poison, removing voluntary ingestion from the working inference.
  anchor_for: [sherlock_holmes, john_watson, greg_lestrade]
