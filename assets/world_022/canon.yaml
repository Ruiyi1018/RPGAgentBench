canon_policy:
  primary_source: 'Sherlock: A Study in Pink (2010)'
  source_type: television episode
  excluded_versions:
  - Arthur Conan Doyle's A Study in Scarlet
  - pilot version of A Study in Pink
  - later Sherlock episodes
  shared_snapshot: During the police search of 221B, after Lestrade's team takes control
    of the recovered pink suitcase and Sherlock infers only that the victims swallowed
    poison themselves under still-unknown coercion, but before Mrs Hudson announces
    the waiting cab driver
  generated_timeline: chronological episode order through that bounded moment of the
    police search of 221B; the cab driver's arrival, the two-bottle choice mechanism,
    the final confrontation, and all aftermath are out of scope
  quotation_policy: paraphrase only; no verbatim dialogue from the episode
  default_player:
    identity: A civilian visitor speaking privately with the evaluated NPC at the
      NPC's Frozen location
    initial_knowledge: Only facts whose Frozen visibility explicitly includes player
    capabilities:
    - May converse, ask questions, and make non-authoritative proposals
    limitations:
    - Has no police, hospital, government, tenancy, or investigative authority
    - Has no automatic access to private records, evidence, restricted rooms, or
      facts known only to an NPC
    scenario_override: A scenario may replace the identity, location, knowledge, or
      permissions only by declaring the override explicitly.
