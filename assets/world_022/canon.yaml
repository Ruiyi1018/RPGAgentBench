data_constraints:
- No facts from later episodes, the unaired pilot, or Arthur Conan Doyle's original
  novels may be included.
- All candidate events must occur no later than the bounded police-search moment in
  shared_snapshot and before Mrs Hudson announces the waiting cab driver.
- Every anchor event must be paraphrased and must not quote direct dialogue.
- All character references in known_by and anchor_for must use the exact roster IDs
  provided.
- Every connected_to location ID must reference a location listed in the environment.
- Anchor event count must be between 18 and 24 inclusive.
- No invented URLs, chapter numbers, episode numbers, or scene timestamps may be used.
- Every cf_edit must contain a genuine minimal counterfactual alternative; none or
  N/A is not allowed.
