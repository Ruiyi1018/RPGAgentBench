data_constraints:
- Current Profile and Frozen fields must describe the single shared snapshot.
- Historical events may cover broadcast episodes 1-22 only and may not pass the snapshot.
- Later-season identities, objects, revelations, and retrospective corrections are excluded.
- Player knowledge requires an explicit player subject in a Frozen visibility list.
- NPC knowledge requires participation, explicit disclosure, or access to evidence.
- Every candidate must be a discrete event with episode and within-episode order.
- Every candidate state change must identify old state, trigger, new state, and observable consequence.
- Every cf_edit must change one causal variable rather than an incidental location or prop.
- All known_by and anchor_for references must use exact evaluated NPC IDs.
- Locations and items used as active runtime resources must exist in environment.yaml.
- No direct quotations from the show.
