world_id: world_032
canon_policy:
  primary_source: How I Met Your Mother Season 1 broadcast episodes
  source_type: television series season
  excluded_versions:
  - Seasons 2-9
  - webisodes
  - deleted scenes
  - novelizations
  - tie-in books
  shared_snapshot: >-
    Season 1 episode 22, after Ted and Robin agree to begin a relationship and
    after Lily and Marshall cancel their wedding and end their engagement, but
    before Lily leaves New York for San Francisco.
  generated_timeline: >-
    Broadcast episode order 1-22; events within an episode use on-screen order.
    No candidate event may occur after the shared snapshot.
  quotation_policy: Paraphrase all facts and dialogue; no direct quotes.
  player_semantics:
    default_identity: A present-day acquaintance speaking privately with the evaluated NPC.
    capabilities:
    - May converse and make requests but has no automatic authority over homes, jobs, vehicles, or possessions.
    initial_knowledge: >-
      The Player knows only knowledge entries whose visibility explicitly contains
      player, plus facts disclosed during the runtime scenario.
    visibility_values:
    - npc
    - player
    scenario_override: >-
      A scenario may define a different Player identity or knowledge set explicitly;
      that declaration overrides the default only for that scenario.
evaluated_npcs:
- ted_mosby
- robin_scherbatsky
- barney_stinson
- lily_aldrin
- marshall_eriksen
- ranjit
