data_constraints:
- All character actions and dialogue must be grounded in Season 1 episodes only
- No events from later seasons may be referenced as known facts
- All timeline placements must be inferable from Season 1 narrative order
- Every anchor event must involve at least one roster character
- No invented scenes, characters, or locations beyond those shown or mentioned in
  Season 1
- All known_by and anchor_for references must use exact roster IDs
- Locations and items must appear or be directly referenced within Season 1
- Connected_to links must only reference locations in the environment list
- No direct quotations from the show
- Ambiguous chronology must be resolved conservatively without contradicting Season
  1
