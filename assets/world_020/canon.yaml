sources:
- id: got_s01_primary
  title: Game of Thrones, Season 1
  creator: David Benioff and D. B. Weiss (showrunners), based on A Song of Ice and
    Fire by George R. R. Martin
  scope: Season 1 through Eddard's private confrontation with Cersei in S01E07,
    excluding Robert's return from the hunt and every later event
  authority: primary
data_constraints:
- Every fact must be traceable to events shown or clearly implied by the shared
  S01E07 cutoff
- Do not use knowledge from later episodes, later seasons, or the novels
- Paraphrase all dialogue instead of quoting it directly
- Omit uncertain details and do not invent URLs, timecodes, or specific dates;
  verified season/episode identifiers may be used for traceability
- All anchor events must fall within the shared snapshot period and be chronologically
  ordered
