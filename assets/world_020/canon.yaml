world_id: world_020
canon_policy:
  primary_source: A Game of Thrones television series, Season 1
  source_type: television
  excluded_versions: A Song of Ice and Fire novels, later seasons, graphic novels,
    companion books, video games
  shared_snapshot: Immediately after Eddard Stark privately confronts Cersei Lannister
    about her children's parentage in S01E07, and before King Robert returns from
    the hunt
  generated_timeline: Events sorted chronologically by in-universe order within the
    shared snapshot
  quotation_policy: Paraphrase facts; do not copy dialogue
  player_semantics:
    default_identity: A neutral visitor physically co-located with the evaluated NPC
      at trajectory start
    default_capabilities: The Player may speak, ask questions, and handle only items
      explicitly placed in the Player inventory or granted through runtime access
    initial_knowledge: The Player knows only knowledge items whose visibility explicitly
      includes player; world-public facts are not automatically Player-known
    scenario_override: A scenario may replace the Player identity, starting location,
      capabilities, access, and knowledge only when each override is explicit
evaluated_npcs:
- eddard_stark
- catelyn_stark
- arya_stark
- tyrion_lannister
