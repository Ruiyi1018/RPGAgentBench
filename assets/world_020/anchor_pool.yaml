world_id: world_020
source: A Game of Thrones television series, Season 1 through the shared S01E07 cutoff
events:
- id: ae_001
  source_ref: S01E01
  canon_order: S01E01.01
  fact: Eddard personally executes a Night's Watch deserter after passing sentence.
  known_by: [eddard_stark, robb_stark, bran_stark, jon_snow, theon_greyjoy]
  state_change: "Before: Bran has not witnessed his father enforce the desertion law. After: Bran and Jon have witnessed Eddard carry out that sentence himself."
  cf_edit: The deserter is returned alive to the Night's Watch; Eddard does not execute him.
  anchor_for: [eddard_stark, jon_snow]
- id: ae_002
  source_ref: S01E01
  canon_order: S01E01.02
  fact: Jon finds a sixth direwolf pup and the Stark children are permitted to keep the litter.
  known_by: [eddard_stark, robb_stark, bran_stark, sansa_stark, arya_stark, rickon_stark, jon_snow, theon_greyjoy]
  state_change: "Before: the children possess no direwolves. After: Arya possesses Nymeria and Jon possesses Ghost."
  cf_edit: Eddard refuses permission to keep the pups, so none becomes a child's possession.
  anchor_for: [arya_stark, jon_snow]
- id: ae_004
  source_ref: S01E01
  canon_order: S01E01.03
  fact: Robert privately offers Eddard the office of Hand in Winterfell's crypt.
  known_by: [robert_baratheon, eddard_stark]
  state_change: "Before: Eddard has no royal-office offer. After: he must accept or refuse Robert's offer to become Hand."
  cf_edit: During the same private crypt meeting, Robert does not offer Eddard the office of Hand.
  anchor_for: [eddard_stark, cersei_lannister]
- id: ae_005
  source_ref: S01E01
  canon_order: S01E01.04
  fact: Bran sees Cersei and Jaime together in the tower, and Jaime pushes him from the window.
  known_by: [bran_stark, jaime_lannister, cersei_lannister]
  state_change: "Before: Bran does not know Cersei and Jaime's secret. After: Bran has seen it and is incapacitated by the fall; Eddard and Catelyn know neither what he saw nor who pushed him."
  cf_edit: Bran leaves the tower before seeing Cersei and Jaime; no one pushes him.
  anchor_for: [cersei_lannister]
- id: ae_006
  source_ref: S01E01
  canon_order: S01E01.05
  fact: After Catelyn relays Lysa's warning about Jon Arryn, Eddard accepts the office of Hand.
  known_by: [eddard_stark, catelyn_stark]
  state_change: "Before: Eddard has not committed to royal service. After: he is Hand-designate and committed to travel to King's Landing and investigate Jon Arryn's death."
  cf_edit: Lysa's warning says Jon Arryn died naturally; Eddard refuses the office.
  anchor_for: [eddard_stark]
- id: ae_011
  source_ref: S01E01
  canon_order: S01E01.06
  fact: Daenerys marries Khal Drogo and becomes khaleesi of his khalasar.
  known_by: [daenerys_targaryen, khal_drogo, viserys_targaryen, illyrio_mopatis]
  state_change: "Before: Daenerys is an unmarried exile under Viserys's control. After: she is Drogo's wife and holds the social role of khaleesi."
  cf_edit: Drogo declines the marriage arrangement, so Daenerys does not become khaleesi.
  anchor_for: [daenerys_targaryen]
- id: ae_012
  source_ref: S01E01
  canon_order: S01E01.07
  fact: Illyrio gives Daenerys three dragon eggs at her wedding.
  known_by: [daenerys_targaryen, illyrio_mopatis, viserys_targaryen, khal_drogo, jorah_mormont]
  state_change: "Before: Daenerys does not possess the eggs. After: the three dragon eggs are her personal possessions."
  cf_edit: Illyrio gives Daenerys jewelry instead of dragon eggs.
  anchor_for: [daenerys_targaryen]
- id: ae_003
  source_ref: S01E02
  canon_order: S01E02.01
  fact: Jon leaves Winterfell with Benjen to seek admission to the Night's Watch.
  known_by: [jon_snow, benjen_stark, eddard_stark, catelyn_stark, robb_stark, bran_stark, arya_stark]
  state_change: "Before: Jon resides at Winterfell. After: he is traveling to the Wall as a prospective recruit."
  cf_edit: Benjen refuses to take Jon to the Wall, so Jon remains at Winterfell.
  anchor_for: [jon_snow]
- id: ae_007
  source_ref: S01E03
  canon_order: S01E03.01
  fact: After discovering Needle, Eddard hires Syrio Forel to train Arya.
  known_by: [arya_stark, eddard_stark, syrio_forel]
  state_change: "Before: Arya has no sword instructor. After: she is Syrio's active water-dance student."
  cf_edit: Eddard confiscates Needle and does not hire Syrio.
  anchor_for: [arya_stark]
- id: ae_008
  source_ref: S01E03
  canon_order: S01E03.02
  fact: Catelyn secretly meets Eddard in King's Landing and reports the attack on Bran and Littlefinger's dagger claim.
  known_by: [catelyn_stark, eddard_stark, petyr_baelish, rodrik_cassel]
  state_change: "Before: Eddard does not know of the second attack or dagger claim. After: he knows both claims and treats Lannister involvement as an unproven possibility."
  cf_edit: Littlefinger does not identify the dagger as Tyrion's; Catelyn reports only the attack.
  anchor_for: [catelyn_stark, eddard_stark]
- id: ae_024
  source_ref: S01E04
  canon_order: S01E04.01
  fact: Catelyn publicly seizes Tyrion at the crossroads inn on the dagger accusation.
  known_by: [catelyn_stark, tyrion_lannister, rodrik_cassel]
  state_change: "Before: Tyrion is free and Catelyn has made no public arrest. After: Tyrion is Catelyn's prisoner under an explicit accusation."
  cf_edit: The inn's armed travelers refuse Catelyn's call for support, so Tyrion remains free.
  anchor_for: [catelyn_stark, tyrion_lannister]
- id: ae_026
  source_ref: S01E04
  canon_order: S01E04.02
  fact: Jon persuades the other recruits to stop hurting Sam during training.
  known_by: [jon_snow, samwell_tarly, grenn, pyp, rast]
  state_change: "Before: Sam is repeatedly attacked in training. After: Jon has undertaken to protect him and the participating recruits stop targeting him."
  cf_edit: The recruits reject Jon's intervention and continue targeting Sam.
  anchor_for: [jon_snow]
- id: ae_016
  source_ref: S01E05
  canon_order: S01E05.01
  fact: Arya overhears two men discussing danger to Eddard beneath the Red Keep.
  known_by: [arya_stark, varys, illyrio_mopatis]
  state_change: "Before: Arya knows of no covert plan around her father. After: she knows an overheard warning but cannot identify the speakers or verify every detail."
  cf_edit: Arya enters the passage after the men leave and hears no warning.
  anchor_for: [arya_stark]
- id: ae_025
  source_ref: S01E05
  canon_order: S01E05.02
  fact: Arya reaches Eddard and reports the warning she overheard.
  known_by: [arya_stark, eddard_stark]
  state_change: "Before: Eddard has not heard Arya's report. After: he has heard it, while Arya's one-time warning task is complete."
  cf_edit: A guard delays Arya until Eddard has left, so she cannot deliver the warning.
  anchor_for: [arya_stark, eddard_stark]
- id: ae_009
  source_ref: S01E06
  canon_order: S01E06.01
  fact: Bronn wins Tyrion's demanded trial by combat, requiring the Eyrie to release Tyrion.
  known_by: [tyrion_lannister, catelyn_stark, bronn, lysa_arryn, robin_arryn, vardis_egen]
  state_change: "Before: Tyrion is imprisoned under threat of judgment. After: he is released from Eyrie custody and travels with Bronn."
  cf_edit: Bronn loses the combat, so Tyrion is not released.
  anchor_for: [tyrion_lannister, catelyn_stark]
- id: ae_013
  source_ref: S01E06
  canon_order: S01E06.02
  fact: Eddard verifies from the royal lineages and Robert's bastards that Cersei's children are not Robert's.
  known_by: [eddard_stark]
  state_change: "Before: Eddard suspects a connection to Jon Arryn's death. After: he knows the children's parentage conclusion; Cersei does not yet know that Eddard has reached it."
  cf_edit: The lineage evidence does not show the inherited trait, so Eddard cannot reach the parentage conclusion.
  anchor_for: [eddard_stark]
- id: ae_021
  source_ref: S01E06
  canon_order: S01E06.03
  fact: Drogo kills Viserys after Viserys threatens Daenerys and her unborn child.
  known_by: [daenerys_targaryen, khal_drogo, viserys_targaryen, jorah_mormont]
  state_change: "Before: Viserys is alive and pressures Daenerys for an army. After: Viserys is dead and can no longer control or threaten her."
  cf_edit: Viserys leaves the feast without making the threat, so Drogo does not kill him.
  anchor_for: [daenerys_targaryen]
- id: ae_010
  source_ref: S01E07
  canon_order: S01E07.01
  fact: Jon is assigned to serve as Lord Commander Mormont's steward.
  known_by: [jon_snow, jeor_mormont, maester_aemon, alliser_thorne, samwell_tarly, grenn, pyp, rast]
  state_change: "Before: Jon is a recruit with no assigned office. After: he is assigned Mormont's steward duties but has not yet taken the Night's Watch vows."
  cf_edit: Mormont assigns Jon to the rangers instead of naming him steward.
  anchor_for: [jon_snow]
- id: ae_027
  source_ref: S01E07
  canon_order: S01E07.02
  fact: Jon takes the Night's Watch vows before a heart tree beyond the Wall.
  known_by: [jon_snow, samwell_tarly]
  state_change: "Before: Jon has a steward assignment but remains free to decline lifelong service. After: he is a sworn brother bound by the Night's Watch oath; he does not yet possess Longclaw."
  cf_edit: Jon declines to speak the vows, so he does not become a sworn brother.
  anchor_for: [jon_snow]
- id: ae_014
  source_ref: S01E07
  canon_order: S01E07.03
  fact: Eddard privately tells Cersei he knows her children's parentage and warns her to leave before he tells Robert; Cersei refuses to yield.
  known_by: [cersei_lannister, eddard_stark]
  state_change: "Before: Cersei does not know Eddard has completed the discovery. After: both know the discovery and warning occurred; Cersei remains in King's Landing and Eddard intends to tell Robert."
  cf_edit: Eddard postpones the meeting, so Cersei does not learn that he has completed the discovery.
  anchor_for: [cersei_lannister, eddard_stark]
