version: 1

backends:
  venus:
    type: venus
    base_url: https://v2.open.venus.woa.com/llmproxy
    api_key_env: ENV_VENUS_OPENAPI_SECRET_ID
    api_key_suffix: "@5784"
    env_file: .env
    timeout_seconds: 300
    max_attempts: 3
    max_concurrency: 8

  dashscope:
    type: openai_compatible
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    env_file: .env
    enable_thinking: false
    timeout_seconds: 300
    max_attempts: 5
    max_concurrency: 4

models:
  venus-deepseek-v4-pro:
    backend: venus
    remote_model: deepseek-v4-pro
    max_concurrency: 4
    capabilities:
      token_parameter: max_tokens
      temperature: true
      top_p: true
      seed: true
      structured_output: json_schema
    defaults:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 4096
      seed: 42
      max_format_retries: 2

  venus-deepseek-v4-flash:
    backend: venus
    remote_model: deepseek-v4-flash
    max_concurrency: 6
    capabilities:
      token_parameter: max_tokens
      temperature: true
      top_p: true
      seed: true
      structured_output: json_schema
    defaults:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 4096
      seed: 42
      max_format_retries: 1

  venus-gpt6-astra:
